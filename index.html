en:{t:"Why do planes fly so high?",h:"Seven miles up, the air is thin, cold and calm. That's exactly why pilots want to be there.",
s:[["The sweet spot","Airliners usually cruise between 35,000 and 39,000 feet, about seven miles up."],
["Thin air saves fuel","Up there the air is much thinner, so the plane pushes through less of it. Less resistance means the engines work less hard and burn less fuel. Over thousands of flights a day, that adds up."],
["Why not even higher?","Thinner air also gives the wings less lift and the engines less oxygen. The gap between flying too slowly and too fast gets narrower too. Every plane has a certified maximum altitude: about 41,000 feet for a Boeing 737 and 39,000 for an Airbus A320. Heavy long-haul flights often start lower and climb as they burn off fuel."],
["A smoother ride","Most bad weather sits lower down. Thunderstorms can still tower above airliners, so pilots fly around them, not over."]],
w:"Outside, it's about −57°C, with too little oxygen to breathe. The cabin is pressurized to match a mountain town 6,000–8,000 feet up, which is why your ears notice the climb and descent.",
k:["Thin air means less drag and less fuel.","Too thin means too little lift and engine power.","Cruising altitude is a balance between fuel, performance, comfort and safety."],
q:[["What's the main reason airliners fly so high?",["To avoid birds","It's required for all flights over water","Radio signals work better up there","Thinner air means less drag, so they burn less fuel"],3,"Less air resistance means the engines work less hard and use less fuel."],
["Why don't airliners cruise at 60,000 feet?",["It's too warm up there","Air traffic control forbids it","There's too little lift for the wings and too little oxygen for the engines","The windows would freeze"],2,"Very thin air can't support the wings or feed the engines well enough."],
["Roughly how cold is it outside at cruising altitude?",["About −5°C","About −57°C","About 0°C","About −150°C"],1,"Around −57°C, which is why the cabin is heated and pressurized."]]},
fr:{t:"Pourquoi les avions volent-ils si haut?",h:"À onze kilomètres d'altitude, l'air est mince, froid et calme. C'est justement pour ça que les pilotes veulent s'y trouver.",
s:[["L'altitude idéale","Les avions de ligne volent habituellement entre 35 000 et 39 000 pieds, soit environ 11 kilomètres au-dessus du sol."],
["L'air mince économise du carburant","Là-haut, l'air est beaucoup moins dense : l'avion a donc moins d'air à traverser. Moins de résistance, c'est des moteurs qui forcent moins et qui consomment moins. Sur des milliers de vols par jour, ça finit par compter."],
["Pourquoi pas encore plus haut?","Un air plus mince donne aussi moins de portance aux ailes et moins d'oxygène aux moteurs. L'écart entre « trop lent » et « trop rapide » se rétrécit. Chaque appareil a une altitude maximale certifiée : environ 41 000 pieds pour un Boeing 737 et 39 000 pour un Airbus A320. Les longs-courriers, lourds au départ, volent souvent plus bas au début, puis montent à mesure qu'ils brûlent leur carburant."],
["Un vol plus calme","La plupart des intempéries restent plus bas. Les orages peuvent toutefois monter plus haut que les avions de ligne : les pilotes les contournent plutôt que de passer par-dessus."]],
w:"Dehors, il fait environ −57 °C et l'air ne contient pas assez d'oxygène pour respirer. La cabine est pressurisée comme si vous étiez dans une ville de montagne, à 6 000 ou 8 000 pieds. C'est pour ça que vos oreilles réagissent à la montée et à la descente.",
k:["Air mince : moins de traînée, moins de carburant.","Trop mince : pas assez de portance ni de puissance.","L'altitude de croisière est un équilibre entre carburant, performance, confort et sécurité."],
q:[["Quelle est la principale raison pour laquelle les avions de ligne volent si haut?",["Pour éviter les oiseaux","C'est obligatoire au-dessus des océans","Les signaux radio passent mieux","L'air plus mince offre moins de résistance, donc ils consomment moins"],3,"Moins de résistance de l'air, c'est des moteurs qui forcent moins et qui consomment moins."],
["Pourquoi les avions de ligne ne volent-ils pas à 60 000 pieds?",["Il fait trop chaud là-haut","Le contrôle aérien l'interdit","Il n'y a pas assez de portance pour les ailes ni d'oxygène pour les moteurs","Les hublots gèleraient"],2,"Un air trop mince ne porte plus assez les ailes et n'alimente plus assez les moteurs."],
["Quelle température fait-il environ à l'extérieur en altitude de croisière?",["Environ −5 °C","Environ −57 °C","Environ 0 °C","Environ −150 °C"],1,"Environ −57 °C, d'où une cabine chauffée et pressurisée."]]},
src:[["How high do commercial planes fly, and why?","Aerospace Global News","https://aerospaceglobalnews.com/news/how-high-commercial-planes-fly-and-why"],["Step climb","Wikipedia","https://en.wikipedia.org/wiki/Step_climb"]]},

{day:2,id:"seven-day-week",cat:"history",min:4,
en:{t:"Why are there seven days in a week?",h:"Your week was designed about 2,500 years ago by people watching the night sky in what is now Iraq.",
s:[["Seven lights in the sky","The Babylonians tracked seven celestial bodies they could see with the naked eye: the Sun, the Moon, Mercury, Venus, Mars, Jupiter and Saturn. Seven became a special number."],
["A month in four pieces","A lunar month was too long to manage, so they split it into four parts of seven days."],
["How it spread","The seven-day week passed to the Jews, Persians and Greeks, then to Rome. In AD 321, Emperor Constantine made it the official Roman week and Sunday a public holiday. Other systems lost out: the Egyptians had a 10-day week and the early Romans an 8-day one. The weekend as we know it only arrived in the 20th century."],
["The planets are still in the names","French kept them almost intact: lundi is the Moon, mardi Mars, mercredi Mercury, jeudi Jupiter and vendredi Venus. Dimanche comes from “the Lord's day,” and samedi from the Sabbath. English swapped the Roman gods for Germanic ones: Tuesday is Tiw (their Mars), Wednesday is Woden (Mercury), Thursday is Thor (Jupiter) and Friday is Frigg (Venus). Saturday, Sunday and Monday kept Saturn, the Sun and the Moon."]],
w:"Every time you say mardi or Tuesday, you're naming the god of war.",
k:["The seven-day week comes from the Babylonians and their seven visible celestial bodies.","Rome made it official in AD 321.","French day names still carry the planets; English swapped in Germanic gods."],
q:[["Which civilization gave us the seven-day week?",["The Egyptians","The Romans","The Babylonians","The Vikings"],2,"The Babylonians, who tracked seven celestial bodies."],
["What do mardi and Tuesday have in common?",["Both honour the god of war","Both mean “second day”","Both come from the Moon","Nothing at all"],0,"Mardi honours Mars; Tuesday honours Tiw, his Germanic equivalent."],
["When did Rome make the seven-day week official?",["44 BC","1582","AD 800","AD 321"],3,"Emperor Constantine made it official in AD 321."]]},
fr:{t:"Pourquoi la semaine a-t-elle sept jours?",h:"Votre semaine a été conçue il y a environ 2 500 ans par des gens qui observaient le ciel, dans l'Irak d'aujourd'hui.",
s:[["Sept lumières dans le ciel","Les Babyloniens suivaient sept astres visibles à l'œil nu : le Soleil, la Lune, Mercure, Vénus, Mars, Jupiter et Saturne. Le chiffre sept est devenu spécial."],
["Un mois en quatre morceaux","Un mois lunaire était trop long à gérer. Ils l'ont donc divisé en quatre parties de sept jours."],
["Comment elle s'est répandue","La semaine de sept jours est passée aux Juifs, aux Perses et aux Grecs, puis à Rome. En 321, l'empereur Constantin en a fait la semaine officielle de l'Empire et a fait du dimanche un jour férié. D'autres systèmes ont disparu : les Égyptiens avaient une semaine de 10 jours, et les premiers Romains, une semaine de 8 jours. La fin de semaine telle qu'on la connaît n'est arrivée qu'au 20e siècle."],
["Les planètes sont encore dans les noms","Le français les a presque toutes gardées : lundi, c'est la Lune; mardi, Mars; mercredi, Mercure; jeudi, Jupiter; vendredi, Vénus. Dimanche vient de « jour du Seigneur » et samedi, du sabbat. L'anglais, lui, a remplacé les dieux romains par des dieux germaniques : Tuesday, c'est Tiw (leur Mars); Wednesday, Woden (Mercure); Thursday, Thor (Jupiter); Friday, Frigg (Vénus). Saturday, Sunday et Monday ont gardé Saturne, le Soleil et la Lune."]],
w:"Chaque fois que vous dites « mardi », vous nommez le dieu de la guerre.",
k:["La semaine de sept jours vient des Babyloniens et de leurs sept astres visibles.","Rome l'a rendue officielle en 321.","Les jours en français portent encore le nom des planètes; l'anglais a choisi des dieux germaniques."],
q:[["Quelle civilisation nous a donné la semaine de sept jours?",["Les Égyptiens","Les Romains","Les Babyloniens","Les Vikings"],2,"Les Babyloniens, qui suivaient sept astres."],
["Qu'ont en commun « mardi » et l'anglais « Tuesday »?",["Les deux honorent le dieu de la guerre","Les deux veulent dire « deuxième jour »","Les deux viennent de la Lune","Rien du tout"],0,"Mardi honore Mars; Tuesday honore Tiw, son équivalent germanique."],
["En quelle année Rome a-t-elle rendu la semaine de sept jours officielle?",["44 av. J.-C.","1582","800","321"],3,"L'empereur Constantin l'a rendue officielle en 321."]]},
src:[["Why are there seven days in a week?","Colorado State University SOURCE","https://source.colostate.edu/why-are-there-seven-days-in-a-week/"],["Why are there 7 days in a week? Thank the Babylonians","Astronomy","https://www.astronomy.com/science/why-are-there-7-days-in-a-week-thank-the-babylonians/"],["Names of the days of the week","Wikipedia","https://en.wikipedia.org/wiki/Names_of_the_days_of_the_week"]]},

{day:3,id:"why-we-yawn",cat:"body",min:3,
en:{t:"Why do we yawn?",h:"It probably isn't about oxygen. The leading idea is that a yawn helps cool your brain.",
s:[["The oxygen myth","Many people believe yawning brings in extra oxygen, but research hasn't found a link between yawning and blood oxygen levels."],
["The cooling idea","Psychologist Andrew Gallup and colleagues suggest a yawn's big intake of air helps cool the brain. If they're right, yawning should happen most within a “thermal window.” In one study, people in Vienna yawned more in summer and people in Arizona more in winter. Contagious yawning peaked at around 20°C and dropped off near 37°C and near freezing."],
["The cold-pack test","In a 2019 study, 92 students held a pack against the arteries in their neck for five minutes, then watched a video of people yawning. With a cold pack, 48.5% felt the urge to yawn. At room temperature it was 69.2%, and with a warm pack 84.8%."],
["Why yawns are contagious","One idea is that catching a yawn helps a group stay alert together. Dogs can even catch their owners' yawns."]],
w:"Yawning in a warm, stuffy meeting may say more about the room than about the speaker. This is still a leading hypothesis, not settled science.",
k:["Research hasn't linked yawning to blood oxygen.","A leading hypothesis says yawns help cool the brain.","Temperature seems to change how often we yawn."],
q:[["Did research confirm that we yawn to get more oxygen?",["No, studies found no link with blood oxygen levels","Yes, clearly","Only in children","Only during sleep"],0,"Previous research could not find a link between yawning and blood oxygen."],
["In the 2019 study, which pack reduced the urge to yawn?",["The warm one","The room-temperature one","None of them","The cold one"],3,"48.5% felt the urge with a cold pack, versus 84.8% with a warm one."],
["When did people in Vienna yawn more?",["In winter","In summer","At night only","No difference"],1,"Vienna yawned more in summer; Arizona, where summers are very hot, more in winter."]]},
fr:{t:"Pourquoi bâille-t-on?",h:"Ce n'est probablement pas une question d'oxygène. L'hypothèse principale : le bâillement aiderait à refroidir le cerveau.",
s:[["Le mythe de l'oxygène","Beaucoup croient que bâiller fait entrer plus d'oxygène, mais la recherche n'a trouvé aucun lien entre le bâillement et le taux d'oxygène dans le sang."],
["L'idée du refroidissement","Le psychologue Andrew Gallup et ses collègues avancent que la grande bouffée d'air d'un bâillement aide à refroidir le cerveau. Si c'est vrai, on devrait bâiller surtout dans une certaine « fenêtre de température ». Dans une étude, les gens de Vienne bâillaient davantage en été, et ceux de l'Arizona, en hiver. Le bâillement contagieux culminait autour de 20 °C et diminuait près de 37 °C et près du point de congélation."],
["Le test du sac froid","Dans une étude de 2019, 92 étudiants ont tenu un sac contre les artères de leur cou pendant cinq minutes, puis ont regardé une vidéo de gens qui bâillent. Avec un sac froid, 48,5 % ont ressenti l'envie de bâiller. À température ambiante, c'était 69,2 %, et avec un sac chaud, 84,8 %."],
["Pourquoi c'est contagieux","Une hypothèse : « attraper » un bâillement aiderait un groupe à rester alerte ensemble. Même les chiens peuvent attraper le bâillement de leur maître."]],
w:"Bâiller dans une réunion, dans une salle chaude et mal aérée, en dit peut-être plus sur la pièce que sur la personne qui parle. Ça reste une hypothèse, pas une certitude scientifique.",
k:["La recherche n'a pas relié le bâillement à l'oxygène dans le sang.","Une hypothèse importante : le bâillement refroidirait le cerveau.","La température semble influencer la fréquence des bâillements."],
q:[["La recherche a-t-elle confirmé qu'on bâille pour avoir plus d'oxygène?",["Non, aucun lien avec l'oxygène dans le sang n'a été trouvé","Oui, clairement","Seulement chez les enfants","Seulement pendant le sommeil"],0,"Les études n'ont trouvé aucun lien entre le bâillement et l'oxygène sanguin."],
["Dans l'étude de 2019, quel sac a réduit l'envie de bâiller?",["Le sac chaud","Le sac à température ambiante","Aucun","Le sac froid"],3,"48,5 % avec le sac froid, contre 84,8 % avec le sac chaud."],
["Quand les gens de Vienne bâillaient-ils davantage?",["En hiver","En été","Seulement la nuit","Aucune différence"],1,"À Vienne, plus en été; en Arizona, où l'été est torride, plus en hiver."]]},
src:[["Do we yawn to cool our brains?","Medical News Today","https://www.medicalnewstoday.com/articles/276571"],["Why do we yawn? Contagious yawns help cool down the brain","Newsweek","https://www.newsweek.com/why-do-we-yawn-contagious-yawns-cool-down-brain-scientists-1443106"],["Manipulating neck temperature alters contagious yawning in humans","Physiology & Behavior","https://www.sciencedirect.com/science/article/abs/pii/S0031938419302665"]]},

{day:4,id:"how-gps-works",cat:"tech",min:4,
en:{t:"How does my phone know where I am?",h:"Every time you open a map, you're using Einstein's theory of relativity.",
s:[["A ring of clocks in space","GPS satellites orbit about 20,200 km above Earth, each circling the planet twice a day. From almost anywhere, at least four are in view."],
["Timing is everything","Each satellite constantly broadcasts the exact time from its atomic clocks. Your phone measures how long each signal took to arrive, turns that delay into a distance, and works out the one spot that fits all the distances. For this to work, the clocks must be correct to within 20–30 billionths of a second."],
["Where Einstein comes in","The satellites move fast, so their clocks run about 7 millionths of a second slower per day (special relativity). They're higher up in weaker gravity, so their clocks run about 45 millionths of a second faster per day (general relativity). The net result: satellite clocks gain about 38 millionths of a second per day."],
["Without the fix","Positions would drift by about 10 kilometres every day. Engineers build the correction into the system."]],
w:"The blue dot on your map is one of the most everyday proofs that Einstein was right.",
k:["GPS works by timing signals from several satellites.","Relativity makes satellite clocks gain about 38 millionths of a second a day.","Without correcting for it, your position would drift about 10 km a day."],
q:[["How many GPS satellites can you usually see from almost anywhere on Earth?",["One","Two","At least four","Exactly 24"],2,"The constellation is arranged so at least four are in view from virtually anywhere."],
["Do GPS satellite clocks run faster or slower than clocks on the ground?",["Slower, by about 7 millionths of a second a day","Exactly the same","Faster, by about 38 millionths of a second a day","Faster, by about one second a day"],2,"Weaker gravity speeds them up more than their speed slows them down: a net gain of about 38 millionths of a second."],
["What would happen without the relativity correction?",["Your position would drift by about 10 km a day","Maps would load slower","Nothing noticeable","Satellites would fall"],0,"Tiny timing errors become large distance errors: about 10 km a day."]]},
fr:{t:"Comment mon téléphone sait-il où je suis?",h:"Chaque fois que vous ouvrez une carte, vous utilisez la théorie de la relativité d'Einstein.",
s:[["Un anneau d'horloges dans l'espace","Les satellites GPS tournent à environ 20 200 km au-dessus de la Terre et font chacun deux fois le tour de la planète par jour. De presque n'importe où, au moins quatre sont visibles."],
["Tout est une question de temps","Chaque satellite diffuse en continu l'heure exacte de ses horloges atomiques. Votre téléphone mesure le temps que chaque signal a mis à arriver, le convertit en distance, puis trouve le seul point qui correspond à toutes ces distances. Pour que ça marche, les horloges doivent être justes à 20 ou 30 milliardièmes de seconde près."],
["Là où Einstein entre en jeu","Les satellites se déplacent vite : leurs horloges retardent d'environ 7 millionièmes de seconde par jour (relativité restreinte). Ils sont aussi plus haut, où la gravité est plus faible : leurs horloges avancent d'environ 45 millionièmes de seconde par jour (relativité générale). Résultat net : elles gagnent environ 38 millionièmes de seconde par jour."],
["Sans correction","Les positions dériveraient d'environ 10 kilomètres par jour. Les ingénieurs ont intégré la correction au système."]],
w:"Le point bleu sur votre carte est l'une des preuves les plus quotidiennes qu'Einstein avait raison.",
k:["Le GPS fonctionne en chronométrant les signaux de plusieurs satellites.","La relativité fait gagner aux horloges des satellites environ 38 millionièmes de seconde par jour.","Sans correction, votre position dériverait d'environ 10 km par jour."],
q:[["Combien de satellites GPS voit-on habituellement de presque partout sur Terre?",["Un","Deux","Au moins quatre","Exactement 24"],2,"La constellation est disposée pour qu'au moins quatre soient visibles de presque partout."],
["Les horloges des satellites GPS avancent-elles ou retardent-elles par rapport au sol?",["Elles retardent d'environ 7 millionièmes de seconde par jour","Elles sont exactement pareilles","Elles avancent d'environ 38 millionièmes de seconde par jour","Elles avancent d'environ une seconde par jour"],2,"La gravité plus faible les accélère plus que leur vitesse ne les ralentit : un gain net d'environ 38 millionièmes de seconde."],
["Que se passerait-il sans la correction de la relativité?",["Votre position dériverait d'environ 10 km par jour","Les cartes chargeraient plus lentement","Rien de visible","Les satellites tomberaient"],0,"De minuscules erreurs de temps deviennent de grandes erreurs de distance : environ 10 km par jour."]]},
src:[["Real-World Relativity: The GPS Navigation System","Ohio State University","https://www.astronomy.ohio-state.edu/pogge.1/Ast162/Unit5/gps.html"],["GPS Space Segment","GPS.gov","https://www.gps.gov/systems/gps/space/"]]},

{day:5,id:"prices-ending-99",cat:"money",min:3,
en:{t:"Why do prices end in .99?",h:"$2.99 and $3.00 are one cent apart, but your brain doesn't treat them that way.",
s:[["We read prices left to right","Researchers Manoj Thomas and Vicki Morwitz of New York University studied this “left-digit effect.” It was published in the Journal of Consumer Research in 2005."],
["The key finding","A .99 price feels cheaper mainly when it changes the first digit. Going from $3.00 to $2.99 turns the 3 into a 2, and the price seems noticeably lower. When the first digit doesn't change, the study suggests the effect is much weaker. It's also stronger when you're comparing against a similar price."],
["It's on purpose","For a store, choosing a .99 ending isn't a trivial one-cent decision. It shapes how cheap something feels."]],
w:"When you compare prices, round up in your head. $19.99 is $20.",
k:["We anchor on the first digit of a price.","The .99 effect is strongest when the first digit changes.","Stores choose .99 endings deliberately."],
q:[["When is the .99 effect strongest?",["When the price is very high","On weekends","When the price is written in red","When it changes the first digit"],3,"$3.00 to $2.99 changes the 3 to a 2, which is when the price feels noticeably lower."],
["Which change is more likely to feel like a deal?",["$5.49 → $5.48","$5.00 → $4.99","$5.20 → $5.19","They all feel the same"],1,"Only $5.00 → $4.99 changes the first digit."],
["How far apart are $2.99 and $3.00 in reality?",["It depends on taxes","Ten cents","One dollar","One cent"],3,"Just one cent, even though they can feel further apart."]]},
fr:{t:"Pourquoi les prix finissent-ils en ,99?",h:"2,99 $ et 3,00 $, c'est un cent de différence. Mais votre cerveau ne les voit pas comme ça.",
s:[["On lit les prix de gauche à droite","Les chercheurs Manoj Thomas et Vicki Morwitz, de l'Université de New York, ont étudié cet « effet du premier chiffre ». Leur étude a été publiée dans le Journal of Consumer Research en 2005."],
["Le constat principal","Un prix en ,99 paraît moins cher surtout quand il change le premier chiffre. Passer de 3,00 $ à 2,99 $ transforme le 3 en 2, et le prix semble nettement plus bas. Quand le premier chiffre ne change pas, l'étude suggère que l'effet est beaucoup plus faible. Il est aussi plus fort quand on compare avec un prix semblable."],
["C'est voulu","Pour un magasin, choisir un prix en ,99 n'est pas une décision anodine d'un cent. Ça change l'impression qu'un produit est bon marché."]],
w:"Quand vous comparez des prix, arrondissez dans votre tête : 19,99 $, c'est 20 $.",
k:["On s'accroche au premier chiffre d'un prix.","L'effet du ,99 est le plus fort quand le premier chiffre change.","Les magasins choisissent les prix en ,99 délibérément."],
q:[["Quand l'effet du ,99 est-il le plus fort?",["Quand le prix est très élevé","La fin de semaine","Quand le prix est écrit en rouge","Quand il change le premier chiffre"],3,"De 3,00 $ à 2,99 $, le 3 devient un 2 : c'est là que le prix paraît nettement plus bas."],
["Quel changement a le plus de chances de ressembler à une aubaine?",["5,49 $ → 5,48 $","5,00 $ → 4,99 $","5,20 $ → 5,19 $","Ils se ressemblent tous"],1,"Seul 5,00 $ → 4,99 $ change le premier chiffre."],
["Quel est l'écart réel entre 2,99 $ et 3,00 $?",["Ça dépend des taxes","Dix cents","Un dollar","Un cent"],3,"Un seul cent, même si l'écart semble plus grand."]]},
src:[["Penny Pinching: How Consumers React To Prices Ending In 99","ScienceDaily","https://www.sciencedaily.com/releases/2005/06/050607030351.htm"],["Penny Wise and Pound Foolish: The Left-Digit Effect in Price Cognition","Journal of Consumer Research (EconPapers)","https://econpapers.repec.org/RePEc:oup:jconrs:v:32:y:2005:i:1:p:54-64"]]},

{day:6,id:"origin-of-ok",cat:"work",min:3,
en:{t:"Where does “OK” come from?",h:"The most widely understood word on Earth started as a newspaper joke in 1839.",
s:[["A joke in Boston","On 23 March 1839, the Boston Morning Post ran a story using “o.k.” as a joking abbreviation of “all correct,” deliberately misspelled. It was a bit of humour about a local society, not a serious coinage."],
["An election made it famous","In the 1840 US presidential campaign, supporters of Martin Van Buren used OK for his nickname, “Old Kinderhook.” The slogan spread the two letters across the country."],
["A myth along the way","A later hoax claimed President Andrew Jackson couldn't spell and wrote “OK” on documents. It wasn't true, but the story kept the word in circulation."],
["From telegraphs to everywhere","Railway telegraph operators used OK to signal that a train had arrived safely. By 1854 it appeared in Thoreau's Walden. Today it's understood almost everywhere, even where English isn't spoken."]],
w:"Language often grows from jokes and accidents, not committees. The word you type dozens of times a day began as a newspaper pun.",
k:["OK first appeared in print in Boston in 1839, as a joke.","An 1840 election slogan made it widespread.","Telegraph operators helped turn it into an everyday word."],
q:[["Where did “OK” first appear in print?",["A Boston newspaper in 1839","A London dictionary","A presidential speech","A telegraph manual"],0,"The Boston Morning Post used it on 23 March 1839."],
["What did OK stand for in the 1840 election?",["Our Kingdom","Old Kinderhook","Only Kentucky","Open Knowledge"],1,"It was Martin Van Buren's nickname, “Old Kinderhook.”"],
["Is the story that Andrew Jackson invented OK because he couldn't spell true?",["No, it was a hoax","Partly","Yes","Nobody knows"],0,"It was a later hoax, though it helped spread the word."]]},
fr:{t:"D'où vient le mot « OK »?",h:"Le mot le plus compris de la planète est né d'une blague dans un journal, en 1839.",
s:[["Une blague à Boston","Le 23 mars 1839, le Boston Morning Post a publié un article utilisant « o.k. » comme abréviation humoristique de « all correct » (« tout est correct »), volontairement mal épelée. C'était une plaisanterie au sujet d'une société locale, pas un mot inventé sérieusement."],
["Une élection l'a rendu célèbre","Pendant la campagne présidentielle américaine de 1840, les partisans de Martin Van Buren ont utilisé OK pour son surnom, « Old Kinderhook ». Le slogan a répandu ces deux lettres dans tout le pays."],
["Un mythe en chemin","Plus tard, un canular a prétendu que le président Andrew Jackson ne savait pas écrire et inscrivait « OK » sur les documents. C'était faux, mais l'histoire a gardé le mot en circulation."],
["Du télégraphe au monde entier","Les télégraphistes des chemins de fer utilisaient OK pour signaler qu'un train était bien arrivé. En 1854, le mot apparaissait dans Walden, de Thoreau. Aujourd'hui, on le comprend presque partout, même là où on ne parle pas anglais, y compris dans le français de tous les jours."]],
w:"Les langues évoluent souvent grâce à des blagues et des hasards, pas à des comités. Le mot que vous tapez des dizaines de fois par jour a commencé comme un jeu de mots dans un journal.",
k:["OK est apparu pour la première fois dans un journal de Boston en 1839, comme une blague.","Un slogan électoral de 1840 l'a répandu.","Les télégraphistes en ont fait un mot de tous les jours."],
q:[["Où « OK » est-il apparu pour la première fois par écrit?",["Dans un journal de Boston, en 1839","Dans un dictionnaire londonien","Dans un discours présidentiel","Dans un manuel de télégraphie"],0,"Le Boston Morning Post l'a utilisé le 23 mars 1839."],
["Que voulait dire OK pendant l'élection de 1840?",["Our Kingdom","Old Kinderhook","Only Kentucky","Open Knowledge"],1,"C'était le surnom de Martin Van Buren : « Old Kinderhook »."],
["Est-il vrai qu'Andrew Jackson a inventé OK parce qu'il ne savait pas écrire?",["Non, c'était un canular","En partie","Oui","Personne ne le sait"],0,"C'était un canular apparu plus tard, même s'il a aidé à répandre le mot."]]},
src:[["OK: The Improbable Story of America's Greatest Word (review of Allan Metcalf's book)","World Wide Words","https://www.worldwidewords.org/re-oka1.html"]]},

{day:7,id:"leaves-change-colour",cat:"science",min:4,
en:{t:"Why do leaves change colour in the fall?",h:"The yellow was there all summer. The red is brand new.",
s:[["The green fades","As days get shorter and temperatures change, leaves stop their food-making process. The green pigment, chlorophyll, breaks down and fades."],
["Yellow and orange were hiding","Yellow and orange pigments, called carotenes and xanthophylls, are in the leaf all year. Most of the year, they're simply masked by large amounts of green."],
["Red is made in the fall","Reds and purples come from pigments called anthocyanins, which form in autumn through new chemical changes. Cool temperatures above freezing favour bright reds in maples. An early frost weakens them. Rainy or overcast days tend to make fall colours more intense."],
["The goodbye layer","At the base of each leaf stem, a special layer of cells grows and gradually cuts the leaf off. The tree seals the spot, leaving a small leaf scar when the leaf falls."]],
w:"The best red maples follow cool, not freezing, weather. A clear, dry, cool day is ideal for looking at them.",
k:["Fall colour starts when chlorophyll breaks down.","Yellows were there all along; reds are made in autumn.","Cool weather above freezing gives the brightest reds."],
q:[["Where do the yellow and orange colours come from?",["Pigments made only in the fall","Sunburn on the leaf","Frost damage","Pigments present all year, hidden by green"],3,"Carotenes and xanthophylls are always there, masked by chlorophyll."],
["What kind of weather favours bright red maples?",["Hot, dry days","Cool temperatures above freezing","Hard frost","Heavy snow"],1,"Cool temperatures above freezing favour anthocyanin, the red pigment; early frost weakens it."],
["What makes a leaf finally fall?",["The leaf freezing solid","Wind alone","Animals","A layer of cells at the stem that cuts it off"],3,"A special layer of cells gradually severs the leaf from the branch."]]},
fr:{t:"Pourquoi les feuilles changent-elles de couleur à l'automne?",h:"Le jaune était là tout l'été. Le rouge, lui, est tout nouveau.",
s:[["Le vert s'efface","Quand les jours raccourcissent et que la température change, les feuilles cessent de fabriquer de la nourriture. Le pigment vert, la chlorophylle, se dégrade et pâlit."],
["Le jaune et l'orange se cachaient","Les pigments jaunes et orangés, les carotènes et les xanthophylles, sont dans la feuille toute l'année. La plupart du temps, ils sont simplement masqués par la grande quantité de vert."],
["Le rouge apparaît à l'automne","Les rouges et les pourpres viennent de pigments appelés anthocyanes, qui se forment à l'automne par de nouvelles réactions chimiques. Des températures fraîches, mais au-dessus du point de congélation, favorisent les rouges vifs des érables. Un gel hâtif les affaiblit. Les journées pluvieuses ou nuageuses ont tendance à intensifier les couleurs."],
["La couche de l'au revoir","À la base de chaque tige, une couche spéciale de cellules se forme et sépare peu à peu la feuille de la branche. L'arbre referme l'endroit, ce qui laisse une petite cicatrice quand la feuille tombe."]],
w:"Les plus beaux érables rouges suivent un temps frais, mais pas glacial. Une journée claire, sèche et fraîche est idéale pour les admirer.",
k:["Les couleurs d'automne commencent quand la chlorophylle se dégrade.","Le jaune était là depuis toujours; le rouge se fabrique à l'automne.","Un temps frais au-dessus de zéro donne les rouges les plus vifs."],
q:[["D'où viennent le jaune et l'orange des feuilles?",["De pigments fabriqués seulement à l'automne","D'un coup de soleil sur la feuille","Des dégâts causés par le gel","De pigments présents toute l'année, cachés par le vert"],3,"Les carotènes et les xanthophylles sont toujours là, masqués par la chlorophylle."],
["Quel temps favorise les érables d'un rouge vif?",["Des journées chaudes et sèches","Des températures fraîches au-dessus de zéro","Un gel intense","De grosses chutes de neige"],1,"Le frais au-dessus de zéro favorise les anthocyanes, le pigment rouge; un gel hâtif les affaiblit."],
["Qu'est-ce qui fait finalement tomber une feuille?",["Le gel de la feuille","Le vent seulement","Les animaux","Une couche de cellules à la base de la tige qui la sépare"],3,"Une couche spéciale de cellules coupe peu à peu la feuille de la branche."]]},
src:[["Why Leaves Change Color","SUNY College of Environmental Science and Forestry","https://www.esf.edu/ecenter/eis/leaves.php"]]},

{day:8,id:"marathon-distance",cat:"history",min:3,
en:{t:"Why is a marathon 42.195 km?",h:"The strangest number in sport comes down to where a royal family wanted the race to start and finish.",
s:[["The legend","According to Greek legend, a soldier ran from Marathon to Athens, about 40 km, to announce a military victory. That run inspired the race."],
["No fixed distance at first","When the marathon appeared at the first modern Olympics in 1896, it was roughly 40 km. For years, the exact length varied."],
["London, 1908","For the London Olympics, organizers set the course from Windsor Castle to a finish line in front of the royal box at the Olympic stadium. That route measured 26 miles 385 yards: 42.195 km."],
["Made official in 1921","The distance wasn't standardized right away. In 1921, the International Amateur Athletic Federation, today World Athletics, adopted 42.195 km for all future Olympic marathons."]],
w:"Every marathoner who has suffered through the final stretch is running a distance shaped by a 1908 seating plan.",
k:["The marathon is inspired by a legendary run from Marathon to Athens.","The 1908 London course set the 42.195 km distance.","It became the official standard in 1921."],
q:[["Which Olympics set the 42.195 km distance?",["Athens 1896","London 1908","Paris 1900","Los Angeles 1932"],1,"The 1908 London course ran from Windsor Castle to the royal box."],
["Where did the 1908 race finish?",["In front of the royal box at the Olympic stadium","At Buckingham Palace","At Windsor Castle","On London Bridge"],0,"It started at Windsor Castle and finished in front of the royal box."],
["When did 42.195 km become the official standard?",["1908","1921","1948","1984"],1,"The international athletics federation adopted it in 1921."]]},
fr:{t:"Pourquoi un marathon fait-il 42,195 km?",h:"Le chiffre le plus étrange du sport s'explique par l'endroit où une famille royale voulait voir la course commencer et finir.",
s:[["La légende","Selon la légende grecque, un soldat aurait couru de Marathon jusqu'à Athènes, environ 40 km, pour annoncer une victoire militaire. Cette course a inspiré l'épreuve."],
["Pas de distance fixe au départ","Quand le marathon est apparu aux premiers Jeux olympiques modernes, en 1896, il faisait environ 40 km. Pendant des années, la longueur exacte a varié."],
["Londres, 1908","Pour les Jeux de Londres, les organisateurs ont tracé le parcours du château de Windsor jusqu'à une ligne d'arrivée devant la loge royale du stade olympique. Ce trajet mesurait 26 milles et 385 verges : 42,195 km."],
["Officiel en 1921","La distance n'a pas été normalisée tout de suite. En 1921, la Fédération internationale d'athlétisme amateur, aujourd'hui World Athletics, a adopté les 42,195 km pour tous les marathons olympiques à venir."]],
w:"Tous les marathoniens qui ont souffert dans les derniers kilomètres courent une distance dictée par un plan de places de 1908.",
k:["Le marathon s'inspire d'une course légendaire de Marathon à Athènes.","Le parcours de Londres, en 1908, a fixé les 42,195 km.","La distance est devenue la norme officielle en 1921."],
q:[["Quels Jeux olympiques ont fixé la distance de 42,195 km?",["Athènes 1896","Londres 1908","Paris 1900","Los Angeles 1932"],1,"Le parcours de Londres 1908 allait du château de Windsor à la loge royale."],
["Où la course de 1908 se terminait-elle?",["Devant la loge royale du stade olympique","Au palais de Buckingham","Au château de Windsor","Sur le pont de Londres"],0,"Elle partait du château de Windsor et finissait devant la loge royale."],
["Quand 42,195 km est-il devenu la norme officielle?",["1908","1921","1948","1984"],1,"La fédération internationale d'athlétisme l'a adopté en 1921."]]},
src:[["Why Is a Marathon 26.2 Miles?","Encyclopaedia Britannica","https://www.britannica.com/sports/Why-Is-a-Marathon-26-2-Miles"]]},

{day:9,id:"goosebumps",cat:"body",min:3,
en:{t:"Why do we get goosebumps?",h:"It looks like a leftover from furrier ancestors. It may still be doing a hidden job.",
s:[["A tiny muscle at every hair","Under the skin, a tiny muscle is attached to each hair follicle. When you're cold, your nervous system tells these muscles to contract, and the hairs stand up: goosebumps."],
["Useful for animals with fur","In animals with thick fur, raised hair may help protect them from the cold. Humans don't seem to get much warmth from it. Even Charles Darwin wondered why we still have them."],
["The hidden job","In 2020, Harvard researchers led by Ya-Chieh Hsu found that the same nerve and muscle connect to stem cells in the hair follicle. Under prolonged cold, the nerve activates those stem cells to grow new hair. The study, published in the journal Cell, was done in mice."]],
w:"Goosebumps are a reminder that the body keeps old systems around, and sometimes those systems have more than one job.",
k:["Goosebumps happen when tiny muscles at each hair contract.","Raised fur helps furry animals stay warm; humans get little benefit.","In mice, the same nerve and muscle help trigger new hair growth."],
q:[["What physically causes goosebumps?",["Tiny muscles at each hair follicle contracting","Skin shrinking from cold","Blood rushing to the skin","Sweat glands closing"],0,"Each follicle has a tiny muscle that contracts and lifts the hair."],
["What did the 2020 Harvard study find?",["Goosebumps warm humans a lot","Goosebumps are caused by fear only","The goosebump nerve and muscle help activate hair-growing stem cells","Humans have lost the goosebump muscle"],2,"Under prolonged cold, the nerve activates hair follicle stem cells to grow hair."],
["In what animal was the 2020 study done?",["Humans","Cats","Mice","Geese"],2,"It was done in mice, so the human picture isn't settled."]]},
fr:{t:"Pourquoi a-t-on la chair de poule?",h:"On dirait un vestige de nos ancêtres poilus. Elle a peut-être encore un rôle caché.",
s:[["Un minuscule muscle à chaque poil","Sous la peau, un muscle minuscule est attaché à chaque follicule pileux. Quand vous avez froid, votre système nerveux fait contracter ces muscles, et les poils se dressent : c'est la chair de poule."],
["Utile pour les animaux à fourrure","Chez les animaux à fourrure épaisse, les poils dressés aident peut-être à se protéger du froid. Les humains, eux, n'en tirent pas grand-chose. Même Charles Darwin se demandait pourquoi on l'a encore."],
["Le rôle caché","En 2020, des chercheurs de Harvard dirigés par Ya-Chieh Hsu ont découvert que le même nerf et le même muscle sont reliés aux cellules souches du follicule. Lors d'un froid prolongé, le nerf active ces cellules souches pour faire pousser de nouveaux poils. L'étude, publiée dans la revue Cell, a été menée chez la souris."]],
w:"La chair de poule rappelle que le corps garde de vieux systèmes, et que ceux-ci ont parfois plus d'un rôle.",
k:["La chair de poule vient de minuscules muscles qui se contractent à chaque poil.","La fourrure dressée garde les animaux au chaud; chez l'humain, l'effet est faible.","Chez la souris, le même nerf et le même muscle aident à faire pousser de nouveaux poils."],
q:[["Qu'est-ce qui cause physiquement la chair de poule?",["De minuscules muscles qui se contractent à chaque follicule","La peau qui rétrécit au froid","Le sang qui afflue vers la peau","Les glandes sudoripares qui se ferment"],0,"Chaque follicule a un petit muscle qui se contracte et redresse le poil."],
["Qu'a découvert l'étude de Harvard en 2020?",["La chair de poule réchauffe beaucoup les humains","La chair de poule vient seulement de la peur","Le nerf et le muscle de la chair de poule aident à activer les cellules souches qui font pousser les poils","Les humains ont perdu ce muscle"],2,"Lors d'un froid prolongé, le nerf active les cellules souches du follicule."],
["Chez quel animal l'étude de 2020 a-t-elle été faite?",["L'humain","Le chat","La souris","L'oie"],2,"Chez la souris : ce qui se passe chez l'humain n'est donc pas encore établi."]]},
src:[["The hair-raising reason for goosebumps is revealed","Harvard Gazette","https://news.harvard.edu/gazette/story/2020/07/the-hair-raising-reason-for-goosebumps-is-revealed/"]]},

{day:10,id:"how-ai-writes",cat:"tech",min:4,
en:{t:"How does an AI like ChatGPT write sentences?",h:"It doesn't plan a whole answer. It keeps guessing the next small piece of text.",
s:[["A reasonable continuation","A chatbot like ChatGPT tries to produce a “reasonable continuation” of the text so far: what a person would plausibly write next, based on the huge amount of text it learned from."],
["One piece at a time","It writes by adding one “token” at a time. A token can be a whole word or part of a word. At each step, it calculates a ranked list of possible next tokens, each with a probability."],
["A little randomness","Always picking the top-ranked word gives flat, repetitive text. So it sometimes picks a lower-ranked one. A setting called “temperature” controls how often. That's why the same question can get different answers."],
["How it learned","The model is a neural network trained on hundreds of billions of words from web pages and books. The version behind the original ChatGPT had about 175 billion internal settings, called weights. People then rated its answers, and those ratings were used to tune it toward more helpful responses."]],
w:"Fluent doesn't mean checked. An AI predicts text that sounds right, which is why these lessons are written with AI help but built on linked sources and checked by a person.",
k:["Chatbots write one token at a time, predicting what comes next.","A bit of randomness makes answers less repetitive and less predictable.","Sounding right and being right are not the same thing."],
q:[["What does a chatbot like ChatGPT do at each step?",["Looks up the answer in a database","Copies a whole web page","Predicts the next small piece of text","Asks a human"],2,"It ranks possible next tokens and adds one at a time."],
["What is a “token”?",["A whole word or part of a word","A password","A full sentence","A type of computer chip"],0,"Tokens are the small pieces of text the model works with."],
["Why can the same question get different answers?",["The AI is broken","The internet changes every second","Someone edits each answer","A “temperature” setting adds some randomness"],3,"The model sometimes picks lower-ranked words, controlled by temperature."]]},
fr:{t:"Comment une IA comme ChatGPT écrit-elle ses phrases?",h:"Elle ne planifie pas toute sa réponse. Elle devine sans cesse le prochain petit bout de texte.",
s:[["Une suite plausible","Un agent conversationnel comme ChatGPT essaie de produire une « suite raisonnable » du texte : ce qu'une personne écrirait vraisemblablement ensuite, d'après l'immense quantité de textes dont il a appris."],
["Un morceau à la fois","Il écrit en ajoutant un « jeton » à la fois. Un jeton peut être un mot entier ou une partie de mot. À chaque étape, il calcule une liste classée des jetons possibles, chacun avec une probabilité."],
["Un peu de hasard","Toujours choisir le mot le mieux classé donne un texte plat et répétitif. Il choisit donc parfois un mot moins bien classé. Un réglage appelé « température » contrôle la fréquence de ces choix. C'est pourquoi une même question peut recevoir des réponses différentes."],
["Comment il a appris","Le modèle est un réseau de neurones entraîné sur des centaines de milliards de mots tirés de pages Web et de livres. La version derrière le ChatGPT d'origine comptait environ 175 milliards de paramètres internes, appelés poids. Des gens ont ensuite évalué ses réponses, et ces évaluations ont servi à l'ajuster pour qu'il soit plus utile."]],
w:"Fluide ne veut pas dire vérifié. Une IA prédit un texte qui sonne juste. C'est pourquoi ces leçons sont écrites avec l'aide de l'IA, mais appuyées sur des sources citées et vérifiées par une personne.",
k:["Les agents conversationnels écrivent un jeton à la fois, en prédisant la suite.","Un peu de hasard rend les réponses moins répétitives et moins prévisibles.","Sonner juste et être juste, ce n'est pas la même chose."],
q:[["Que fait un agent conversationnel comme ChatGPT à chaque étape?",["Il cherche la réponse dans une base de données","Il copie une page Web au complet","Il prédit le prochain petit bout de texte","Il demande à un humain"],2,"Il classe les jetons possibles et en ajoute un à la fois."],
["Qu'est-ce qu'un « jeton »?",["Un mot entier ou une partie de mot","Un mot de passe","Une phrase complète","Un type de puce électronique"],0,"Les jetons sont les petits morceaux de texte avec lesquels le modèle travaille."],
["Pourquoi une même question peut-elle recevoir des réponses différentes?",["L'IA est brisée","Internet change à chaque seconde","Quelqu'un modifie chaque réponse","Un réglage de « température » ajoute un peu de hasard"],3,"Le modèle choisit parfois des mots moins bien classés, selon la température."]]},
src:[["What Is ChatGPT Doing … and Why Does It Work?","Stephen Wolfram Writings","https://writings.stephenwolfram.com/2023/02/what-is-chatgpt-doing-and-why-does-it-work/"]]}
);

{day:11,id:"compound-interest",cat:"money",min:3,
en:{t:"How does compound interest work?",h:"Interest that earns its own interest grows slowly at first, then surprisingly fast.",
s:[["Interest on interest","Compound interest is the interest you earn on interest. Put $100 in an account earning 5% a year, and after one year you have $105. In year two, you earn 5% on $105, not just on $100, so you reach $110.25."],
["Time does the heavy lifting","With no further deposits, that $100 grows to more than $162 after 10 years, and to almost $340 after 25 years."],
["The Rule of 72","For a quick estimate, divide 72 by the yearly rate. The answer is roughly how many years it takes for money to double. At 9%, that's about 8 years. At 6%, about 12."],
["It works both ways","The same math applies to a debt where unpaid interest is added to what you owe. Then it's working against you."]],
w:"When comparing savings or debts, the rate matters, but so does time. The Rule of 72 lets you do the math in your head.",
k:["Compound interest is interest earned on interest.","Over long periods, growth speeds up.","Rule of 72: divide 72 by the rate to estimate the years to double."],
q:[["What is compound interest?",["Interest earned on interest","A bank fee","Interest only on the original amount","A type of tax"],0,"Each year's interest is added to the balance and then earns interest itself."],
["Using the Rule of 72, how long does money take to double at 6% a year?",["About 6 years","About 18 years","About 12 years","About 72 years"],2,"72 divided by 6 is 12."],
["$100 at 5% a year, with no deposits, is worth how much after two years?",["$110.25","$110.00","$105.00","$125.00"],0,"$105 after year one, then 5% on $105 gives $110.25."]]},
fr:{t:"Comment fonctionnent les intérêts composés?",h:"Des intérêts qui rapportent eux-mêmes des intérêts grandissent lentement au début, puis étonnamment vite.",
s:[["Des intérêts sur les intérêts","Les intérêts composés, ce sont les intérêts que vous gagnez sur vos intérêts. Placez 100 $ dans un compte qui rapporte 5 % par année : après un an, vous avez 105 $. La deuxième année, vous gagnez 5 % sur 105 $, pas seulement sur 100 $, et vous arrivez à 110,25 $."],
["Le temps fait le gros du travail","Sans autre dépôt, ces 100 $ deviennent plus de 162 $ après 10 ans, et presque 340 $ après 25 ans."],
["La règle de 72","Pour une estimation rapide, divisez 72 par le taux annuel. Le résultat donne à peu près le nombre d'années pour que l'argent double. À 9 %, environ 8 ans. À 6 %, environ 12."],
["Ça marche dans les deux sens","Le même calcul s'applique à une dette dont les intérêts impayés s'ajoutent au montant dû. Là, il joue contre vous."]],
w:"Quand vous comparez une épargne ou une dette, le taux compte, mais le temps aussi. La règle de 72 permet de faire le calcul de tête.",
k:["Les intérêts composés sont des intérêts gagnés sur des intérêts.","Sur une longue période, la croissance s'accélère.","Règle de 72 : divisez 72 par le taux pour estimer le nombre d'années avant que l'argent double."],
q:[["Que sont les intérêts composés?",["Des intérêts gagnés sur des intérêts","Des frais bancaires","Des intérêts seulement sur le montant de départ","Une sorte d'impôt"],0,"Les intérêts de chaque année s'ajoutent au solde, puis rapportent à leur tour."],
["Selon la règle de 72, combien de temps faut-il pour doubler son argent à 6 % par année?",["Environ 6 ans","Environ 18 ans","Environ 12 ans","Environ 72 ans"],2,"72 divisé par 6 donne 12."],
["Combien valent 100 $ placés à 5 % par année, sans dépôt, après deux ans?",["110,25 $","110,00 $","105,00 $","125,00 $"],0,"105 $ après un an, puis 5 % sur 105 $ donne 110,25 $."]]},
src:[["What is compound interest?","Investor.gov (U.S. Securities and Exchange Commission)","https://www.investor.gov/additional-resources/information/youth/teachers-classroom-resources/what-compound-interest"]]},

{day:12,id:"um-and-uh",cat:"work",min:3,
en:{t:"Why do we say “um” and “uh”?",h:"They sound like mistakes. They're actually signals.",
s:[["Holding the floor","People who want to keep talking commonly use fillers such as um, er or uh. They tell listeners: I'm not finished yet."],
["Two kinds of pause","Research suggests “uh” is more common when a speaker is searching for a word, and “um” when they're struggling to put a thought together at a deeper level."],
["Listeners use them too","In a 2001 study by psychologist Jean Fox Tree, hearing “uh” helped listeners recognize the words that came next. Hearing “um” had neither a helpful nor a harmful effect."],
["Every language has its own","French speakers say “euh.” In American Spanish it's often “este.” Japanese speakers say “ēto,” and Mandarin speakers say “nàge,” which means “that.”"]],
w:"Fillers are a normal part of how people talk, in every language. An “uh” can even help the person listening to you.",
k:["Fillers signal that a speaker wants to keep talking.","“Uh” often goes with word-searching; “um” with deeper thinking.","Every language has its own fillers."],
q:[["What do fillers like “um” and “uh” often signal?",["I'm finished talking","I disagree","I want to keep talking","I'm not telling the truth"],2,"Speakers who want to continue commonly use them to hold the floor."],
["What did Jean Fox Tree's 2001 study find?",["Hearing “uh” helped listeners recognize upcoming words","Fillers always confuse listeners","“Um” makes speakers seem dishonest","Only English has fillers"],0,"“Uh” helped recognition; “um” had no measurable effect either way."],
["Which filler is common in French?",["Este","Ēto","Nàge","Euh"],3,"“Euh” is the most common French filler."]]},
fr:{t:"Pourquoi dit-on « euh »?",h:"On dirait des erreurs. Ce sont en fait des signaux.",
s:[["Garder la parole","Les gens qui veulent continuer à parler utilisent souvent des mots de remplissage, comme « euh » en français ou « um » et « uh » en anglais. Ils disent à l'auditoire : je n'ai pas fini."],
["Deux sortes de pauses","La recherche en anglais suggère que « uh » est plus fréquent quand on cherche un mot, et « um » quand on a du mal à formuler une idée plus profonde."],
["Ceux qui écoutent s'en servent aussi","Dans une étude de 2001, la psychologue Jean Fox Tree a montré qu'entendre « uh » aidait les gens à reconnaître les mots qui suivaient. Entendre « um » n'avait ni effet positif ni effet négatif."],
["Chaque langue a les siens","En français, on dit surtout « euh ». En espagnol d'Amérique, c'est souvent « este ». En japonais, on dit « ēto », et en mandarin, « nàge », qui veut dire « ça »."]],
w:"Les mots de remplissage font partie de la façon normale de parler, dans toutes les langues. Un « euh » peut même aider la personne qui vous écoute.",
k:["Les mots de remplissage signalent qu'on veut continuer à parler.","En anglais, « uh » accompagne souvent la recherche d'un mot; « um », une réflexion plus profonde.","Chaque langue a ses propres mots de remplissage."],
q:[["Que signalent souvent les mots comme « euh »?",["J'ai fini de parler","Je ne suis pas d'accord","Je veux continuer à parler","Je ne dis pas la vérité"],2,"On s'en sert souvent pour garder la parole."],
["Qu'a montré l'étude de Jean Fox Tree en 2001?",["Entendre « uh » aidait à reconnaître les mots suivants","Ces mots embrouillent toujours l'auditoire","« Um » fait paraître malhonnête","Seul l'anglais en a"],0,"« Uh » aidait la reconnaissance; « um » n'avait aucun effet mesurable."],
["Quel mot de remplissage est courant en espagnol d'Amérique?",["Euh","Ēto","Nàge","Este"],3,"« Este » est courant en espagnol d'Amérique."]]},
src:[["Filler (linguistics)","Wikipedia","https://en.wikipedia.org/wiki/Filler_(linguistics)"]]},

{day:13,id:"sky-blue",cat:"science",min:3,
en:{t:"Why is the sky blue?",h:"Sunlight contains every colour. The air just scatters the blue one all over the sky.",
s:[["White light is a mix","Sunlight looks white, but it's made of all the colours of the rainbow."],
["Blue gets bounced around","Blue light travels as shorter, smaller waves. As sunlight passes through the air, gas molecules scatter blue more than other colours, sending it across the whole sky. That scattered blue is what you see when you look up."],
["Paler near the horizon","Light coming from near the horizon passes through much more air. It gets scattered again and again, and mixed with light reflected from the ground, so the sky looks paler there, almost white."],
["Red sunsets","When the Sun is low, its light crosses even more atmosphere. Most of the blue is scattered away before it reaches you, so the reds and yellows come straight through. Dust and pollution can make the glow stronger."]],
w:"An orange sunset shows you the colours that survived the longest trip through the air.",
k:["Sunlight contains all colours.","Air scatters blue light the most, so the sky looks blue.","At sunset, blue is scattered away and reds get through."],
q:[["Why does the sky look blue?",["It reflects the ocean","Space is blue","The Sun only gives off blue light","Air molecules scatter blue light more than other colours"],3,"Blue travels as shorter waves and is scattered most by the air."],
["Why is the sky paler near the horizon?",["Clouds are always there","There's less air there","Light there passes through more air and gets mixed","The Earth's shadow"],2,"Repeated scattering and reflection from the ground mix the colours."],
["Why are sunsets red and orange?",["The Sun cools down in the evening","The Moon reflects red light","Pollution only appears at night","Blue light is scattered away on the longer path, letting reds through"],3,"When the Sun is low, its light crosses more air and loses its blue."]]},
fr:{t:"Pourquoi le ciel est-il bleu?",h:"La lumière du Soleil contient toutes les couleurs. L'air disperse simplement le bleu dans tout le ciel.",
s:[["La lumière blanche est un mélange","La lumière du Soleil paraît blanche, mais elle contient toutes les couleurs de l'arc-en-ciel."],
["Le bleu rebondit partout","La lumière bleue voyage en ondes plus courtes et plus petites. Quand la lumière traverse l'air, les molécules de gaz dispersent le bleu plus que les autres couleurs et le répandent dans tout le ciel. C'est ce bleu dispersé que vous voyez en levant les yeux."],
["Plus pâle à l'horizon","La lumière qui vient de l'horizon traverse beaucoup plus d'air. Elle est dispersée encore et encore, et mélangée à la lumière renvoyée par le sol. Le ciel y paraît donc plus pâle, presque blanc."],
["Des couchers de soleil rouges","Quand le Soleil est bas, sa lumière traverse encore plus d'atmosphère. La plus grande partie du bleu est dispersée avant de vous atteindre : les rouges et les jaunes passent tout droit. La poussière et la pollution peuvent rendre la lueur plus intense."]],
w:"Un coucher de soleil orangé vous montre les couleurs qui ont survécu au plus long trajet dans l'air.",
k:["La lumière du Soleil contient toutes les couleurs.","L'air disperse surtout le bleu, d'où un ciel bleu.","Au coucher du soleil, le bleu est dispersé et les rouges passent."],
q:[["Pourquoi le ciel paraît-il bleu?",["Il reflète l'océan","L'espace est bleu","Le Soleil n'émet que de la lumière bleue","Les molécules d'air dispersent le bleu plus que les autres couleurs"],3,"Le bleu voyage en ondes plus courtes et l'air le disperse davantage."],
["Pourquoi le ciel est-il plus pâle près de l'horizon?",["Il y a toujours des nuages","Il y a moins d'air","La lumière y traverse plus d'air et se mélange","C'est l'ombre de la Terre"],2,"La dispersion répétée et la lumière renvoyée par le sol mélangent les couleurs."],
["Pourquoi les couchers de soleil sont-ils rouges et orangés?",["Le Soleil refroidit le soir","La Lune reflète du rouge","La pollution n'apparaît que le soir","Le bleu est dispersé sur le trajet plus long, ce qui laisse passer les rouges"],3,"Quand le Soleil est bas, sa lumière traverse plus d'air et perd son bleu."]]},
src:[["Why Is the Sky Blue?","NASA Space Place","https://spaceplace.nasa.gov/blue-sky/en/"]]},

{day:14,id:"sixty-minutes",cat:"history",min:3,
en:{t:"Why are there 60 minutes in an hour?",h:"Every time you check the time, you're using a counting system more than 4,000 years old.",
s:[["Counting in sixties","The Sumerians of ancient Mesopotamia counted in base 60 as early as the third millennium BC. The Babylonians inherited the system, the same people who gave us the seven-day week."],
["Why 60 is so handy","Sixty has twelve divisors. It's the smallest number that can be divided evenly by every number from 1 to 6. That makes fractions easy: an hour splits cleanly into 30, 20, 15, 12 or 10 minutes."],
["Still everywhere","Hours have 60 minutes and minutes have 60 seconds. A circle has 360 degrees, six sixties. Each degree is split into 60 minutes of arc, and each of those into 60 seconds: the system behind map coordinates."]],
w:"Every time you say “quarter past” or “half an hour,” you're using a number chosen because it divides so neatly.",
k:["Base-60 counting began with the Sumerians.","Sixty divides evenly in many ways, which makes it practical.","It survives in time, circles and map coordinates."],
q:[["Who first counted in base 60?",["The Romans","The Greeks","The Sumerians","The Vikings"],2,"The Sumerians of Mesopotamia, in the third millennium BC."],
["What makes 60 especially convenient?",["It's divisible by every number from 1 to 6","It's a prime number","It's the number of days in two months","It's easy to write"],0,"With twelve divisors, it splits cleanly in many ways."],
["How many degrees are in a circle?",["100","60","400","360"],3,"360, which is six sixties."]]},
fr:{t:"Pourquoi une heure a-t-elle 60 minutes?",h:"Chaque fois que vous regardez l'heure, vous utilisez un système de calcul vieux de plus de 4 000 ans.",
s:[["Compter par soixantaines","Les Sumériens, en Mésopotamie, comptaient en base 60 dès le troisième millénaire avant notre ère. Les Babyloniens ont hérité de ce système : ce sont les mêmes qui nous ont donné la semaine de sept jours."],
["Pourquoi 60 est si pratique","Soixante a douze diviseurs. C'est le plus petit nombre qu'on peut diviser exactement par tous les nombres de 1 à 6. Ça rend les fractions faciles : une heure se divise proprement en 30, 20, 15, 12 ou 10 minutes."],
["Encore partout","Les heures ont 60 minutes et les minutes, 60 secondes. Un cercle compte 360 degrés, soit six fois soixante. Chaque degré se divise en 60 minutes d'arc, et chacune en 60 secondes : c'est le système des coordonnées géographiques."]],
w:"Chaque fois que vous dites « et quart » ou « une demi-heure », vous utilisez un nombre choisi parce qu'il se divise si bien.",
k:["Le calcul en base 60 vient des Sumériens.","Soixante se divise de plusieurs façons, ce qui le rend pratique.","On le retrouve encore dans l'heure, les cercles et les coordonnées."],
q:[["Qui a d'abord compté en base 60?",["Les Romains","Les Grecs","Les Sumériens","Les Vikings"],2,"Les Sumériens de Mésopotamie, au troisième millénaire avant notre ère."],
["Qu'est-ce qui rend le nombre 60 si pratique?",["Il est divisible par tous les nombres de 1 à 6","C'est un nombre premier","C'est le nombre de jours dans deux mois","Il est facile à écrire"],0,"Avec douze diviseurs, il se divise proprement de plusieurs façons."],
["Combien de degrés compte un cercle?",["100","60","400","360"],3,"360, soit six fois soixante."]]},
src:[["Sexagesimal","Wikipedia","https://en.wikipedia.org/wiki/Sexagesimal"]]},

{day:15,id:"wrinkly-fingers",cat:"body",min:3,
en:{t:"Why do our fingers wrinkle in water?",h:"It isn't just skin soaking up water. Your nervous system does it on purpose.",
s:[["An active process","Wrinkles form because blood vessels under the skin narrow. That's controlled by the autonomic nervous system, the part of your nervous system that runs automatically."],
["Rain treads?","In a 2013 Newcastle University study, people soaked their hands in warm water for 30 minutes, then moved marbles from one container to another. With wrinkled fingers, they handled wet marbles 12% faster. With dry marbles, wrinkles made no difference. The researchers compared wrinkles to the treads on car tyres."],
["The debate","A 2014 study found no benefit for dexterity. A larger 2021 study, with 516 people analysed, found that wrinkled fingers needed less grip force to hold a wet object, about as little as dry fingers. The evidence now leans toward a grip benefit, but scientists are still testing it."]],
w:"Bath-time fingers turn out to be an active, possibly useful adaptation, and a good example of science testing and retesting an idea.",
k:["Finger wrinkles are caused by blood vessels narrowing, controlled by nerves.","Several studies suggest wrinkles improve grip on wet objects.","Not every study agrees, so the question is still being tested."],
q:[["What causes fingers to wrinkle in water?",["Skin simply absorbing water","Soap","Blood vessels under the skin narrowing, controlled by nerves","Cold water only"],2,"It's an active response of the autonomic nervous system."],
["In the 2013 study, how much faster were people with wrinkled fingers at moving wet marbles?",["2%","12%","50%","No faster"],1,"They were 12% faster with wet marbles, with no difference for dry ones."],
["What best describes the current evidence?",["Proven beyond doubt","Completely disproven","Leaning toward a grip benefit, still being tested","Never studied"],2,"Most results support a benefit, but one study found none."]]},
fr:{t:"Pourquoi nos doigts plissent-ils dans l'eau?",h:"Ce n'est pas juste la peau qui absorbe l'eau. Votre système nerveux le fait exprès.",
s:[["Un processus actif","Les plis apparaissent parce que les vaisseaux sanguins sous la peau se resserrent. C'est contrôlé par le système nerveux autonome, la partie qui fonctionne automatiquement."],
["Des sculptures de pneus?","Dans une étude de l'Université de Newcastle, en 2013, des participants ont trempé leurs mains dans l'eau tiède pendant 30 minutes, puis déplacé des billes d'un contenant à un autre. Avec les doigts plissés, ils manipulaient les billes mouillées 12 % plus vite. Avec des billes sèches, aucune différence. Les chercheurs ont comparé les plis aux rainures des pneus."],
["Le débat","Une étude de 2014 n'a trouvé aucun avantage pour la dextérité. Une étude plus large, en 2021, portant sur 516 personnes, a montré que les doigts plissés avaient besoin de moins de force pour tenir un objet mouillé, à peu près autant que des doigts secs. Les données penchent maintenant vers un avantage de prise, mais les scientifiques continuent de vérifier."]],
w:"Les doigts du bain se révèlent une adaptation active, peut-être utile, et un bon exemple de la science qui teste et reteste une idée.",
k:["Les plis viennent du resserrement des vaisseaux sanguins, contrôlé par les nerfs.","Plusieurs études suggèrent qu'ils améliorent la prise sur les objets mouillés.","Toutes les études ne s'entendent pas : la question est encore à l'étude."],
q:[["Qu'est-ce qui fait plisser les doigts dans l'eau?",["La peau qui absorbe simplement l'eau","Le savon","Les vaisseaux sanguins sous la peau qui se resserrent, sous le contrôle des nerfs","L'eau froide seulement"],2,"C'est une réaction active du système nerveux autonome."],
["Dans l'étude de 2013, de combien les gens aux doigts plissés étaient-ils plus rapides avec des billes mouillées?",["2 %","12 %","50 %","Pas plus rapides"],1,"12 % plus rapides avec des billes mouillées; aucune différence avec des billes sèches."],
["Qu'est-ce qui décrit le mieux l'état actuel des connaissances?",["Prouvé hors de tout doute","Complètement réfuté","Penche vers un avantage de prise, encore à l'étude","Jamais étudié"],2,"La plupart des résultats appuient un avantage, mais une étude n'en a trouvé aucun."]]},
src:[["Get a grip: why we get wrinkly fingers and toes","Newcastle University","https://www.ncl.ac.uk/press/articles/archive/2013/01/getagrip-whywegetwrinklyfingersandtoes.html"],["Water-immersion finger-wrinkling improves grip efficiency in handling wet objects","PLOS ONE","https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0253185"]]},

{day:16,id:"microwave-oven",cat:"tech",min:4,
en:{t:"How does a microwave oven heat food?",h:"It doesn't heat the air or the plate first. It makes the water in your food spin.",
s:[["Spinning molecules","Home microwave ovens send out waves at about 2.45 gigahertz. These make polar molecules, like water, rotate rapidly, and that motion produces heat."],
["Outside in","These microwaves only reach about 1 cm into most foods. Deeper parts warm up as heat spreads inward from the outer layers."],
["Why cold spots happen","Microwaves don't spread evenly inside the oven. Turntables and fan-like stirrers help, but some spots, like the centre, can still stay cooler."],
["Not radioactive","Microwaves are non-ionizing: they don't make food or the oven radioactive. The door's metal mesh has holes far smaller than the 12.2 cm wavelength, so microwaves stay in while light gets out."],
["A melted candy bar","In 1945, engineer Percy Spencer, working on radar at Raytheon, noticed a candy bar melting in his pocket. He tested popcorn and an egg next. The first commercial microwave oven, the Radarange, was built in 1947."]],
w:"Stirring food halfway through does what the turntable can't fully do: it moves heat into the cold spots.",
k:["Microwaves heat food by making water molecules rotate.","They reach only about 1 cm in; heat spreads inward from there.","Microwaves don't make food radioactive."],
q:[["How does a microwave oven heat food?",["It heats the air around the food","It makes molecules like water rotate rapidly","It heats the plate first","It uses tiny flames"],1,"The rotating molecules produce heat inside the food."],
["Do microwaves make food radioactive?",["No, they're non-ionizing","Only metal containers","Yes, a little","Only if heated too long"],0,"Microwave radiation is non-ionizing and doesn't make food or the oven radioactive."],
["What led to the invention of the microwave oven?",["A kitchen fire","A melted candy bar near radar equipment","A space mission","A frozen dinner contest"],1,"Percy Spencer noticed a candy bar melting in his pocket in 1945."]]},
fr:{t:"Comment un four à micro-ondes chauffe-t-il les aliments?",h:"Il ne chauffe pas d'abord l'air ni l'assiette. Il fait tourner l'eau contenue dans vos aliments.",
s:[["Des molécules qui tournent","Les fours à micro-ondes domestiques émettent des ondes d'environ 2,45 gigahertz. Elles font tourner très vite les molécules polaires, comme l'eau, et ce mouvement produit de la chaleur."],
["De l'extérieur vers l'intérieur","Ces micro-ondes ne pénètrent qu'environ 1 cm dans la plupart des aliments. Le cœur se réchauffe à mesure que la chaleur se propage depuis les couches extérieures."],
["Pourquoi il reste des zones froides","Les micro-ondes ne se répartissent pas également dans le four. Le plateau tournant et les brasseurs à pales aident, mais certains endroits, comme le centre, peuvent rester plus froids."],
["Pas radioactif","Les micro-ondes sont non ionisantes : elles ne rendent ni les aliments ni le four radioactifs. Le grillage métallique de la porte a des trous beaucoup plus petits que la longueur d'onde de 12,2 cm : les micro-ondes restent à l'intérieur, la lumière sort."],
["Une friandise fondue","En 1945, l'ingénieur Percy Spencer, qui travaillait sur des radars chez Raytheon, a remarqué qu'une friandise fondait dans sa poche. Il a ensuite essayé du maïs à éclater et un œuf. Le premier four à micro-ondes commercial, le Radarange, a été construit en 1947."]],
w:"Brasser vos aliments à mi-cuisson fait ce que le plateau tournant ne peut pas faire complètement : amener la chaleur dans les zones froides.",
k:["Les micro-ondes chauffent en faisant tourner les molécules d'eau.","Elles ne pénètrent qu'environ 1 cm; la chaleur se propage ensuite vers l'intérieur.","Les micro-ondes ne rendent pas les aliments radioactifs."],
q:[["Comment un four à micro-ondes chauffe-t-il les aliments?",["Il chauffe l'air autour","Il fait tourner rapidement des molécules comme l'eau","Il chauffe d'abord l'assiette","Il utilise de minuscules flammes"],1,"Les molécules qui tournent produisent de la chaleur dans l'aliment."],
["Les micro-ondes rendent-elles les aliments radioactifs?",["Non, elles sont non ionisantes","Seulement les contenants en métal","Oui, un peu","Seulement si on chauffe trop longtemps"],0,"Le rayonnement micro-ondes est non ionisant : ni les aliments ni le four ne deviennent radioactifs."],
["Qu'est-ce qui a mené à l'invention du four à micro-ondes?",["Un feu de cuisine","Une friandise fondue près d'un radar","Une mission spatiale","Un concours de plats surgelés"],1,"Percy Spencer a vu une friandise fondre dans sa poche en 1945."]]},
src:[["Microwave oven","Wikipedia","https://en.wikipedia.org/wiki/Microwave_oven"]]},

{day:17,id:"tap-to-pay",cat:"money",min:3,
en:{t:"How does tap-to-pay work?",h:"Your card and the terminal have a very short radio conversation, at very close range.",
s:[["Radio at arm's length (almost)","Contactless cards and phones use NFC, short for near-field communication, which runs at 13.56 MHz. It works best at 4 cm or less, and the signal can never reach beyond 10 cm."],
["Why there's a limit","Because tapping usually skips the PIN, banks cap how much a contactless purchase can be. In Canada, the limit has typically been $250 since 2020. Banks set it; no law fixes the amount."],
["Phones add a layer","Mobile wallets like Apple Pay don't use your actual card number. Your card issuer creates a separate device account number, stored on the phone with a private key that's used to authorize each payment. Because the phone also checks your face, fingerprint or passcode, the usual tap limit often doesn't apply."]],
w:"Tap-to-pay only works when the terminal is within a few centimetres. That short range is part of the design.",
k:["Tap-to-pay uses NFC radio that only works within a few centimetres.","Card tap limits exist because there's usually no PIN; in Canada, typically $250.","Phone wallets use a separate device number instead of your card number."],
q:[["How close does a card need to be for tap-to-pay to work best?",["About 10 metres","About 1 metre","About 4 cm or less","Anywhere in the store"],2,"NFC works best at 4 cm or less and never beyond 10 cm."],
["What has the typical Canadian contactless limit been since 2020?",["$100","$500","$250","There's no limit at all"],2,"Typically $250, set by banks rather than by law."],
["What does a phone wallet use instead of your real card number?",["Your PIN","Your name","Your phone number","A separate device account number"],3,"The issuer creates a device account number for the phone."]]},
fr:{t:"Comment fonctionne le paiement sans contact?",h:"Votre carte et le terminal ont une très courte conversation radio, de très près.",
s:[["De la radio à quelques centimètres","Les cartes et les téléphones sans contact utilisent la NFC, pour « communication en champ proche », qui fonctionne à 13,56 MHz. Elle marche le mieux à 4 cm ou moins, et le signal ne peut jamais dépasser 10 cm."],
["Pourquoi il y a une limite","Comme le paiement sans contact évite généralement le NIP, les banques plafonnent le montant d'un achat. Au Canada, la limite est habituellement de 250 $ depuis 2020. Ce sont les banques qui la fixent; aucune loi n'impose de montant."],
["Le téléphone ajoute une couche","Les portefeuilles mobiles comme Apple Pay n'utilisent pas votre vrai numéro de carte. L'émetteur de votre carte crée un numéro de compte distinct pour l'appareil, conservé dans le téléphone avec une clé privée qui sert à autoriser chaque paiement. Comme le téléphone vérifie aussi votre visage, votre empreinte ou votre code, la limite habituelle ne s'applique souvent pas."]],
w:"Le paiement sans contact ne fonctionne que si le terminal est à quelques centimètres. Cette courte portée fait partie de la conception.",
k:["Le paiement sans contact utilise une radio NFC qui ne porte qu'à quelques centimètres.","La limite existe parce qu'il n'y a généralement pas de NIP; au Canada, habituellement 250 $.","Les portefeuilles mobiles utilisent un numéro d'appareil plutôt que votre numéro de carte."],
q:[["À quelle distance une carte doit-elle être pour que le paiement sans contact fonctionne le mieux?",["Environ 10 mètres","Environ 1 mètre","Environ 4 cm ou moins","N'importe où dans le magasin"],2,"La NFC fonctionne le mieux à 4 cm ou moins, et jamais au-delà de 10 cm."],
["Quelle est la limite habituelle du sans contact au Canada depuis 2020?",["100 $","500 $","250 $","Aucune limite"],2,"Habituellement 250 $, une limite fixée par les banques et non par la loi."],
["Qu'utilise un portefeuille mobile à la place de votre vrai numéro de carte?",["Votre NIP","Votre nom","Votre numéro de téléphone","Un numéro de compte distinct pour l'appareil"],3,"L'émetteur crée un numéro de compte propre au téléphone."]]},
src:[["Contactless payment","Wikipedia","https://en.wikipedia.org/wiki/Contactless_payment"]]},

{day:18,id:"first-impressions",cat:"work",min:3,
en:{t:"How fast do we form first impressions?",h:"In about a tenth of a second. Looking longer mostly makes us more sure.",
s:[["The experiment","In a 2006 study published in Psychological Science, psychologists Willis and Todorov showed people photos of faces for one-tenth of a second, half a second, or a full second. People rated each face for attractiveness, likeability, competence, trustworthiness and aggressiveness."],
["A tenth of a second was enough","Judgments made after a tenth of a second closely matched the judgments people made with no time limit. Trustworthiness showed the strongest match."],
["More time, more confidence","Longer looks made people more confident and their impressions more detailed. But they didn't bring the quick judgments much closer to the slow ones."],
["Fast isn't the same as right","The study measured whether quick judgments matched slower ones, not whether they were accurate about the real person. The researchers suggested that judging trustworthiness quickly may have evolved as a survival skill."]],
w:"Your reaction to a new face arrives almost instantly and feels certain. Knowing it's fast, not necessarily right, is a good reason to give people a second look.",
k:["People form impressions of faces in about a tenth of a second.","Looking longer increases confidence more than it changes the judgment.","Quick impressions are consistent, but that doesn't make them accurate."],
q:[["How briefly were faces shown in the shortest condition?",["One second","One-tenth of a second","Five seconds","One minute"],1,"100 milliseconds, one-tenth of a second."],
["Which trait showed the strongest match between quick and untimed judgments?",["Attractiveness","Aggressiveness","Competence","Trustworthiness"],3,"Trustworthiness had the highest correlation."],
["What did looking at a face for longer mainly change?",["Nothing at all","People's confidence","Whether impressions were accurate","Which face people preferred"],1,"Longer looks raised confidence and detail, not agreement with untimed judgments."]]},
fr:{t:"À quelle vitesse se fait-on une première impression?",h:"En un dixième de seconde environ. Regarder plus longtemps nous rend surtout plus sûrs de nous.",
s:[["L'expérience","Dans une étude publiée en 2006 dans Psychological Science, les psychologues Willis et Todorov ont montré des photos de visages pendant un dixième de seconde, une demi-seconde ou une seconde complète. Les participants évaluaient l'attrait, la sympathie, la compétence, la fiabilité et l'agressivité de chaque visage."],
["Un dixième de seconde suffisait","Les jugements portés après un dixième de seconde concordaient de près avec ceux portés sans limite de temps. C'est pour la fiabilité que la concordance était la plus forte."],
["Plus de temps, plus d'assurance","Regarder plus longtemps rendait les gens plus confiants et leurs impressions plus nuancées. Mais ça ne rapprochait pas beaucoup les jugements rapides des jugements réfléchis."],
["Rapide ne veut pas dire juste","L'étude mesurait si les jugements rapides concordaient avec les jugements lents, pas s'ils étaient exacts au sujet de la vraie personne. Les chercheurs ont suggéré que juger rapidement la fiabilité d'autrui pourrait être une capacité de survie héritée de l'évolution."]],
w:"Votre réaction devant un nouveau visage arrive presque instantanément et semble certaine. Savoir qu'elle est rapide, mais pas forcément juste, est une bonne raison d'accorder une deuxième chance.",
k:["On se fait une impression d'un visage en un dixième de seconde environ.","Regarder plus longtemps augmente l'assurance plus que ça ne change le jugement.","Les impressions rapides sont constantes, mais ça ne les rend pas exactes."],
q:[["Pendant combien de temps les visages étaient-ils montrés dans la condition la plus courte?",["Une seconde","Un dixième de seconde","Cinq secondes","Une minute"],1,"100 millisecondes, soit un dixième de seconde."],
["Pour quel trait la concordance entre jugement rapide et jugement réfléchi était-elle la plus forte?",["L'attrait","L'agressivité","La compétence","La fiabilité"],3,"C'est la fiabilité qui avait la plus forte corrélation."],
["Qu'est-ce que regarder un visage plus longtemps changeait surtout?",["Rien du tout","L'assurance des participants","L'exactitude des impressions","Le visage préféré"],1,"Plus de temps augmentait l'assurance et les nuances, pas la concordance."]]},
src:[["How Many Seconds to a First Impression?","Association for Psychological Science (APS Observer)","https://www.psychologicalscience.org/observer/how-many-seconds-to-a-first-impression"]]},

{day:19,id:"moon-same-side",cat:"science",min:3,
en:{t:"Why do we always see the same side of the Moon?",h:"The Moon does spin. It just spins at exactly the right speed to keep the same face toward us.",
s:[["Perfect timing","The Moon takes exactly as long to turn once on its axis as it does to orbit Earth. This is called tidal locking, and it means the same face always points our way."],
["How it happened","Earth's gravity stretched the Moon into a slight football shape. That bulge kept getting pulled back toward Earth, and the energy lost slowed the Moon's spin until the two timings matched."],
["A little wobble","Because the Moon's orbit is an oval and its axis is slightly tilted, it seems to rock back and forth a little. Over time, we see about 59% of its surface from Earth."],
