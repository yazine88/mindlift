<style>
/* MindLift beta. Quiet editorial: warm paper, confident ink, one spark of vermilion.
   Layout: one reading column (600px) with a bottom tab bar on phones; a side rail and wider grid from 960px. */
:root {
  --bg: #F5F2EC;
  --surface: #FFFFFF;
  --surface-2: #ECE8DF;
  --line: #DCD7CC;
  --ink: #16181D;
  --muted: #5E6068;
  --on-ink: #F5F2EC;
  --accent: #C4401F;
  --teal: #1F5E5B;
  --teal-soft: #DCEAE7;
  --saffron: #F2C14E;
  --mark: #F2C14E;
  --warn: #8A5A0B;
  --warn-soft: #F6EAD0;
  --scrim: rgba(22, 24, 29, 0.42);
  --shadow-feature: 0 12px 28px -14px rgba(22, 24, 29, 0.22);
  --shadow-rest: 0 1px 2px rgba(22, 24, 29, 0.14);
  --shadow-sheet: 0 -8px 32px -12px rgba(22, 24, 29, 0.28);

  --sci-t: #D4E8DC; --sci-d: #22593F;
  --his-t: #EFDAD6; --his-d: #7A2E2E;
  --bod-t: #E5DCEC; --bod-d: #56397A;
  --tec-t: #D8E2EE; --tec-d: #244A74;
  --mon-t: #EDE3C4; --mon-d: #6B5314;
  --wor-t: #EEDCCF; --wor-d: #7A3E1F;

  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --read-size: 21px; --read-lh: 32px;
  --rail: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121316; --surface: #1B1D22; --surface-2: #24272E; --line: #30333A;
    --ink: #EEEAE2; --muted: #A3A39E; --on-ink: #121316;
    --accent: #F0714F; --teal: #6FC2BB; --teal-soft: #1C3432;
    --saffron: #F2C14E; --mark: #5A4716; --warn: #E2B866; --warn-soft: #2E2716;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow-feature: none; --shadow-rest: none; --shadow-sheet: none;
    --sci-t: #1C2E25; --sci-d: #8FD1AC;
    --his-t: #33201F; --his-d: #E6A09A;
    --bod-t: #2A2433; --bod-d: #C3A8E3;
    --tec-t: #1D2633; --tec-d: #9DBDE3;
    --mon-t: #2E2A1C; --mon-d: #E2C77A;
    --wor-t: #33251D; --wor-d: #E3AE8C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121316; --surface: #1B1D22; --surface-2: #24272E; --line: #30333A;
  --ink: #EEEAE2; --muted: #A3A39E; --on-ink: #121316;
  --accent: #F0714F; --teal: #6FC2BB; --teal-soft: #1C3432;
  --saffron: #F2C14E; --mark: #5A4716; --warn: #E2B866; --warn-soft: #2E2716;
  --scrim: rgba(0, 0, 0, 0.6);
  --shadow-feature: none; --shadow-rest: none; --shadow-sheet: none;
  --sci-t: #1C2E25; --sci-d: #8FD1AC;
  --his-t: #33201F; --his-d: #E6A09A;
  --bod-t: #2A2433; --bod-d: #C3A8E3;
  --tec-t: #1D2633; --tec-d: #9DBDE3;
  --mon-t: #2E2A1C; --mon-d: #E2C77A;
  --wor-t: #33251D; --wor-d: #E3AE8C;
  color-scheme: dark;
}
:root.size-0 { --read-size: 19px; --read-lh: 29px; }
:root.size-2 { --read-size: 24px; --read-lh: 36px; }

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 24px;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
html.locked, html.locked body { overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
a { color: var(--teal); }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
p { text-wrap: pretty; }
[tabindex="-1"]:focus { outline: none; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Type */
.t-display { font-family: var(--serif); font-size: 40px; line-height: 44px; font-weight: 500; letter-spacing: -0.02em; }
.t-h1 { font-family: var(--serif); font-size: 30px; line-height: 36px; font-weight: 500; letter-spacing: -0.015em; }
.t-h2 { font-family: var(--serif); font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em; }
.t-h3 { font-size: 17px; line-height: 24px; font-weight: 600; }
.t-hook { font-family: var(--serif); font-style: italic; font-size: 18px; line-height: 26px; color: var(--muted); }
.t-caption { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--muted); }
.t-over { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.t-over.spark { color: var(--accent); }
.muted { color: var(--muted); }
.reading { font-family: var(--serif); font-size: var(--read-size); line-height: var(--read-lh); }

/* ---------- Icons */
.i { width: 22px; height: 22px; flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.i-sm { width: 16px; height: 16px; }
.i-md { width: 20px; height: 20px; }
.i .fill { fill: currentColor; stroke: none; }

/* ---------- Brand */
.brand { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
.brand-name { font-family: var(--serif); font-size: 20px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; }
.mark-dot { fill: var(--accent); }
.mark-bar { fill: var(--ink); }
.beta { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 1px 8px; }

/* ---------- Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: var(--r-md); font-size: 16px; line-height: 20px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; transition: background-color 120ms var(--ease), transform 120ms var(--ease), opacity 120ms; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(0.985); }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn-primary:hover { background: var(--ink); opacity: 0.9; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-block { width: 100%; }
.btn-sm { min-height: 44px; font-size: 15px; padding: 0 18px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none; border-radius: var(--r-pill); border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; transition: background-color 120ms var(--ease); }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn.raised { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow-rest); }
.iconbtn.lg { width: 52px; height: 52px; }
.iconbtn[aria-pressed="true"] { color: var(--teal); }
.link { background: none; border: 0; padding: 12px 0; color: var(--teal); font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Segmented control */
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.seg button { flex: 1 1 0; min-width: 48px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; padding: 0 12px; transition: background-color 120ms var(--ease), color 120ms; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-rest); }
.seg.inline { display: inline-flex; }
.seg.lg button { min-height: 44px; font-size: 15px; }

/* ---------- Tags and chips */
.tag { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-xs); font-size: 13px; line-height: 16px; font-weight: 600; white-space: nowrap; background: var(--t); color: var(--d); }
.tag.pill { border-radius: var(--r-pill); height: 32px; padding: 0 12px; font-weight: 500; }
.ev { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-pill); font-size: 13px; font-weight: 600; white-space: nowrap; }
.ev-established { background: var(--teal-soft); color: var(--teal); }
.ev-leading { background: var(--surface-2); color: var(--ink); }
.ev-early { background: var(--warn-soft); color: var(--warn); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--r-pill); font-size: 14px; font-weight: 500; white-space: nowrap; flex: none; cursor: pointer; background: var(--surface); color: var(--ink); border: 1px solid var(--line); transition: background-color 120ms var(--ease); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }

.cat-science { --t: var(--sci-t); --d: var(--sci-d); }
.cat-history { --t: var(--his-t); --d: var(--his-d); }
.cat-body { --t: var(--bod-t); --d: var(--bod-d); }
.cat-tech { --t: var(--tec-t); --d: var(--tec-d); }
.cat-money { --t: var(--mon-t); --d: var(--mon-d); }
.cat-work { --t: var(--wor-t); --d: var(--wor-d); }

/* ---------- Art */
.art { display: block; width: 100%; height: 100%; background: var(--t); }
.art .t { fill: var(--t); }
.art .d { fill: var(--d); }
.art .s { stroke: var(--d); fill: none; }
.art .sf { fill: var(--saffron); }
.art .v { fill: var(--accent); }
.art .k { fill: var(--ink); }
.art .ks { stroke: var(--ink); fill: none; }
.thumb { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; flex: none; }

/* ---------- App shell */
#root { min-height: 100%; }
.main { max-width: 600px; margin: 0 auto; padding-block: 28px calc(110px + env(safe-area-inset-bottom, 0px)); padding-inline: 20px; }
.page { display: flex; flex-direction: column; gap: 36px; }
.section { display: flex; flex-direction: column; gap: 4px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .rail-brand, .tabbar .rail-foot, .tabbar .rail-search { display: none; }
.tab { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 12px; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; line-height: 16px; font-weight: 500; }
.tab .pillwrap { width: 60px; height: 32px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; transition: background-color 200ms var(--ease); }
.tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tab[aria-current="page"] .pillwrap { background: var(--surface-2); }

.topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.greet { display: flex; flex-direction: column; gap: 4px; }

/* ---------- Daily card */
.daily { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-feature); display: flex; flex-direction: column; }
.daily-art { height: 180px; }
.daily-body { display: flex; flex-direction: column; gap: 12px; padding: 18px 20px 20px; }
.daily-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.daily-title { font-family: var(--serif); font-size: 27px; line-height: 32px; font-weight: 500; letter-spacing: -0.015em; }
.daily-hook { font-family: var(--serif); font-style: italic; font-size: 17px; line-height: 25px; color: var(--muted); }
.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.daily-actions { display: flex; gap: 10px; padding-top: 4px; }
.daily-actions .btn-primary { flex: 1; }
.daily-done { display: flex; align-items: center; gap: 8px; color: var(--teal); font-size: 14px; font-weight: 600; }

/* ---------- Week rhythm */
.week { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-radius: 16px; background: var(--surface-2); }
.week-txt { display: flex; flex-direction: column; gap: 2px; }
.dots { display: flex; gap: 8px; align-items: center; }
.dot { width: 26px; height: 26px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); }
.dot.done { background: var(--teal); border-color: var(--teal); color: var(--surface); }
.dot.today { border: 1.5px dashed var(--ink); color: var(--ink); }

/* ---------- Lesson rows */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 14px; padding: 12px 0; min-height: 44px; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; color: var(--ink); }
.rows .row:first-child { border-top: 0; }
.row-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.row-title { font-size: 16px; line-height: 22px; font-weight: 600; }
.row-end { display: flex; align-items: center; gap: 6px; color: var(--muted); flex: none; }
.row-done { display: inline-flex; align-items: center; gap: 4px; color: var(--teal); font-size: 13px; font-weight: 600; }
.row:hover .row-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

/* ---------- Tiles (other subjects) */
.tiles { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
.tiles::-webkit-scrollbar { display: none; }
.tile { flex: 0 0 240px; scroll-snap-align: start; display: flex; flex-direction: column; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; cursor: pointer; color: var(--ink); padding: 0; transition: border-color 120ms var(--ease); }
.tile:hover { border-color: var(--muted); }
.tile-art { height: 110px; }
.tile-body { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 16px; align-items: flex-start; }
.tile-title { font-family: var(--serif); font-size: 19px; line-height: 24px; font-weight: 500; }

.endnote { display: flex; align-items: center; gap: 12px; padding: 20px 0 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; line-height: 20px; }

/* ---------- Explore */
.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 6px 0 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.search:focus-within { border: 2px solid var(--ink); padding-left: 13px; }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.subjects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.subject { display: flex; flex-direction: column; text-align: left; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; cursor: pointer; color: var(--ink); transition: border-color 120ms var(--ease); }
.subject:hover { border-color: var(--muted); }
.subject-art { height: 84px; }
.subject-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 2px; }
.subject-name { font-size: 15px; line-height: 20px; font-weight: 600; }
.note { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 16px; background: var(--surface-2); }
.note p { font-size: 14px; line-height: 20px; color: var(--muted); }
.note strong { display: block; font-size: 15px; line-height: 20px; color: var(--ink); margin-bottom: 2px; }

/* ---------- Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.divider { height: 1px; background: var(--line); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat-n { font-family: var(--serif); font-size: 26px; line-height: 30px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 12px; line-height: 16px; color: var(--muted); }
.hist { display: flex; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; cursor: pointer; color: var(--ink); }
.hist:first-child { border-top: 0; }
.hist-date { width: 84px; flex: none; font-size: 13px; color: var(--muted); line-height: 21px; }
.hist-title { font-size: 15px; line-height: 21px; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 28px 20px; border: 1px dashed var(--line); border-radius: var(--r-lg); }
.empty p { color: var(--muted); font-size: 15px; line-height: 22px; max-width: 32ch; }

/* ---------- Layers (full screen) */
.layer { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; animation: layer-in 200ms var(--ease); }
@keyframes layer-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.flow { max-width: 600px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-block: calc(10px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); padding-inline: 20px; }
.flow-bar { display: flex; align-items: center; gap: 12px; min-height: 52px; margin-inline: -8px; }
.flow-body { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-top: 14px; }
.flow-foot { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding-block: 16px 4px; background: var(--bg); margin-top: 24px; }
.flow-foot .row-btns { display: flex; gap: 10px; align-items: center; }
.flow-foot .row-btns .btn-primary { flex: 1; }
.progress { flex: 1; display: flex; gap: 4px; }
.progress span { flex: 1 1 0; height: 4px; border-radius: var(--r-pill); background: var(--line); }
.progress span.on { background: var(--ink); }
.hint { text-align: center; font-size: 13px; line-height: 18px; color: var(--muted); }
.step { animation: step-in 320ms var(--ease); }
.layer.still-layer { animation: none; }
.layer.still .step { animation: none; }
@keyframes step-in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

/* Intro */
.intro-art { position: relative; height: 280px; border-radius: var(--r-xl); overflow: hidden; margin-top: 8px; }
.intro-art .float { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; }
.intro-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Card */
.card-art { height: 170px; border-radius: 24px; overflow: hidden; }
.card-heading { font-family: var(--serif); font-size: 28px; line-height: 34px; font-weight: 500; letter-spacing: -0.01em; margin-top: -6px; }

/* Key points */
.keys { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
.keys li { display: flex; gap: 16px; align-items: baseline; }
.keys .n { font-family: var(--serif); font-size: 28px; line-height: 28px; color: var(--accent); width: 20px; flex: none; }
.keys .kt { font-size: 17px; line-height: 25px; font-weight: 500; }
.box { padding: 16px 18px; border-radius: 16px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; }
.box .reading { font-size: calc(var(--read-size) - 3px); line-height: calc(var(--read-lh) - 4px); }

/* Quiz */
.question { font-family: var(--serif); font-size: 24px; line-height: 30px; font-weight: 500; letter-spacing: -0.01em; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 12px 16px; text-align: left; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 16px; line-height: 22px; cursor: pointer; transition: background-color 120ms var(--ease), opacity 200ms; }
.opt:hover:not(:disabled) { background: var(--surface-2); }
.opt:disabled { cursor: default; }
.opt .radio { width: 20px; height: 20px; border-radius: var(--r-pill); border: 2px solid var(--line); flex: none; display: flex; align-items: center; justify-content: center; }
.opt .ot { flex: 1; }
.opt.right { background: var(--teal-soft); border: 2px solid var(--teal); padding: 11px 15px; }
.opt.right .radio { border-color: var(--teal); background: var(--teal); color: var(--surface); }
.opt.wrong { background: var(--bad-soft); border: 2px solid var(--bad); padding: 11px 15px; }
.opt.wrong .radio { border-color: var(--bad); background: var(--bad); color: #fff; }
.feedback strong { color: var(--bad); }
.feedback strong.good { color: var(--teal); }
.feedback.bad { border-color: var(--bad); }
.opt.dim { opacity: 0.55; }
.feedback { padding: 16px 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; animation: step-in 200ms var(--ease); }
.feedback strong { font-size: 16px; }
.feedback .good { color: var(--teal); }

/* Sources */
.info { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-2); font-size: 14px; line-height: 20px; }
.srcs { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.src { display: flex; gap: 14px; align-items: flex-start; padding: 16px; color: var(--ink); text-decoration: none; border-top: 1px solid var(--line); }
.src:first-child { border-top: 0; }
.src:hover .src-title { text-decoration: underline; text-underline-offset: 3px; }
.src-ic { width: 40px; height: 40px; border-radius: var(--r-sm); background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex: none; }
.src-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.src-pub { font-size: 13px; line-height: 18px; color: var(--muted); }
.src-title { font-size: 16px; line-height: 21px; font-weight: 600; overflow-wrap: anywhere; }
.sure { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: var(--r-lg); border: 1px solid var(--line); }
.sure p { font-size: 15px; line-height: 22px; color: var(--muted); }

/* Done */
.done-top { display: flex; flex-direction: column; gap: 12px; padding-top: 24px; }
.done-check { width: 56px; height: 56px; border-radius: var(--r-pill); background: var(--teal); color: var(--surface); display: flex; align-items: center; justify-content: center; }

/* Welcome */
.welcome { min-height: 100%; display: flex; flex-direction: column; gap: 26px; }
.welcome-art { height: 280px; border-radius: var(--r-xl); overflow: hidden; flex: none; }
.welcome-art svg { width: 100%; height: 100%; display: block; }
.spacer { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* Interests */
.pick { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 0 18px; border-radius: 16px; font-size: 16px; font-weight: 500; text-align: left; cursor: pointer; background: var(--surface); color: var(--ink); border: 1px solid var(--line); transition: background-color 120ms var(--ease); }
.pick .sw { width: 12px; height: 12px; border-radius: var(--r-pill); background: var(--d); flex: none; }
.pick .pl { flex: 1; }
.pick[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.pick[aria-pressed="true"] .sw { box-shadow: 0 0 0 2px var(--on-ink); }

/* Settings */
.group { display: flex; flex-direction: column; gap: 8px; }
.group > .t-over { padding: 0 4px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.item { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; min-height: 56px; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; color: var(--ink); }
.list > .item:first-child { border-top: 0; }
.item.col { flex-direction: column; align-items: stretch; gap: 10px; }
.item.col > .seg.inline { display: flex; }
button.item { cursor: pointer; }
button.item:hover { background: var(--surface-2); }
.item-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item-label { font-size: 16px; line-height: 22px; font-weight: 500; }
.item-note { font-size: 13px; line-height: 18px; color: var(--muted); }
.item-val { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 15px; flex: none; max-width: 50%; text-align: right; }
.item.danger .item-label { color: var(--accent); }
.switch { position: relative; width: 52px; height: 32px; border-radius: var(--r-pill); background: var(--line); border: 0; flex: none; cursor: pointer; transition: background-color 200ms var(--ease); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: var(--r-pill); background: var(--surface); box-shadow: var(--shadow-rest); transition: transform 200ms var(--ease); }
.switch[aria-checked="true"] { background: var(--teal); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.size-a { font-family: var(--serif); font-weight: 500; }

/* ---------- Sheet */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade 200ms var(--ease); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0; padding-block: 12px calc(24px + env(safe-area-inset-bottom, 0px)); padding-inline: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-sheet); animation: sheet-in 200ms var(--ease); }
@keyframes sheet-in { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.grabber { width: 40px; height: 4px; border-radius: var(--r-pill); background: var(--line); align-self: center; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet p { font-size: 16px; line-height: 24px; }
.sheet .muted { font-size: 15px; line-height: 22px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-size: 14px; font-weight: 600; }
.textarea { width: 100%; min-height: 120px; resize: vertical; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 16px; line-height: 24px; }
.textarea:focus { outline: none; border: 2px solid var(--ink); padding: 11px 13px; }
.ctx { font-size: 13px; line-height: 18px; color: var(--muted); }
.status-line { font-size: 14px; line-height: 20px; color: var(--teal); font-weight: 600; min-height: 20px; }

/* ---------- Toast */
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: var(--r-pill); font-size: 14px; font-weight: 600; box-shadow: var(--shadow-feature); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; animation: fade 120ms var(--ease); }
.toast.long { white-space: normal; width: max-content; max-width: min(92vw, 420px); border-radius: 16px; line-height: 20px; }

html.locked .toast { bottom: auto; top: calc(16px + env(safe-area-inset-top, 0px)); }

/* ---------- Practice */
:root { --bad: #C4301F; --bad-soft: #FBE4E0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bad: #F27A68; --bad-soft: #3A1D19; } }
:root[data-theme="dark"] { --bad: #F27A68; --bad-soft: #3A1D19; }
:root { --cw-stage: #16181D; --cw-red: #FF6B5E; --cw-blue: #6FA6FF; --cw-green: #4CC38A; --cw-yellow: #F2C14E; --sw-edge: rgba(22, 24, 29, 0.16); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --cw-stage: #0B0C0E; --sw-edge: rgba(238, 234, 226, 0.2); }
}
:root[data-theme="dark"] { --cw-stage: #0B0C0E; --sw-edge: rgba(238, 234, 226, 0.2); }
.g-y3 { --t: var(--teal-soft); --d: var(--teal); }

.g-nm { --t: var(--warn-soft); --d: var(--warn); }
.art .pg { fill: var(--surface); }
.art .dg { font-family: var(--serif); font-size: 64px; font-weight: 500; text-anchor: middle; fill: var(--ink); }
.art .dg.v { fill: var(--accent); }
.art .c-red { fill: var(--cw-red); } .art .c-blue { fill: var(--cw-blue); } .art .c-green { fill: var(--cw-green); } .art .c-yellow { fill: var(--cw-yellow); }

.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.pcard-top { display: flex; gap: 14px; align-items: center; }
.pcard-art { width: 72px; height: 72px; border-radius: 16px; overflow: hidden; flex: none; }
.pcard-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pcard-title { font-family: var(--serif); font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em; }
.pcard-desc { font-size: 15px; line-height: 21px; color: var(--muted); }
.pcard .daily-done { margin-top: 4px; align-items: flex-start; }

.row:disabled { cursor: default; }
.row:disabled .thumb { opacity: 0.45; }
.row:disabled:hover .row-title { text-decoration: none; }
.practice-note { font-size: 13px; line-height: 18px; color: var(--muted); }

.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 16px; line-height: 24px; }
.lesson-ref { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); }
.lesson-ref .row-txt { gap: 2px; flex: 1; }

button.lesson-ref:active { transform: scale(0.99); }

.cw-stage { height: 210px; border-radius: var(--r-xl); background: var(--cw-stage); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; padding: 0 16px; }
.cw-word { font-family: var(--sans); font-size: 52px; line-height: 60px; font-weight: 600; letter-spacing: 0.04em; }
.cw-word.in { animation: fade 120ms var(--ease); }
.cw-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cw-btn { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 17px; line-height: 22px; font-weight: 600; text-align: left; cursor: pointer; transition: background-color 120ms var(--ease), opacity 160ms; }
.cw-btn:active:not(:disabled) { transform: scale(0.985); }
.cw-btn:disabled { cursor: default; }
.cw-btn .sw { width: 22px; height: 22px; border-radius: var(--r-pill); flex: none; box-shadow: inset 0 0 0 1px var(--sw-edge); }
.cw-btn .mk { margin-left: auto; display: flex; }
.cw-btn.right { background: var(--teal-soft); border: 2px solid var(--teal); padding: 0 15px; }
.cw-btn.right .mk { color: var(--teal); }
.cw-btn.wrong { background: var(--bad-soft); border: 2px solid var(--bad); padding: 0 15px; }
.cw-btn.wrong .mk { color: var(--bad); }
.cw-btn.dim { opacity: 0.5; }

.nm-stage { height: 200px; border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
.nm-digit { font-family: var(--serif); font-size: 104px; line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums; animation: pop 220ms var(--ease); }
@keyframes pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }
.nm-dots { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.nm-dots span { width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--line); }

.slot { width: 40px; height: 52px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 28px; font-variant-numeric: tabular-nums; }
.slot.cur { border: 2px solid var(--ink); }

.slot.bad { border: 2px solid var(--bad); background: var(--bad-soft); color: var(--bad); }

.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 360px; margin: 0 auto; }
.key { min-height: 56px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--serif); font-size: 28px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background-color 120ms var(--ease); }
.key:active:not(:disabled) { transform: scale(0.97); }
.key:disabled { opacity: 0.4; cursor: default; }
.key-gap { min-height: 56px; }
@media (hover: hover) {
  .cw-btn:hover:not(:disabled), .key:hover:not(:disabled), button.lesson-ref:hover { background: var(--surface-2); }
}
@media (min-width: 700px) {

/* ---------- Feedback: little animations */
#fx-host { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.fx-dot { position: absolute; border-radius: 50%; will-change: transform, opacity; }
.fx-dot.bar { border-radius: 2px; }
@keyframes good-pop { 0% { transform: scale(1); } 40% { transform: scale(1.035); } 100% { transform: scale(1); } }
@keyframes tick-in { from { transform: scale(0.3); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes glow-good { from { box-shadow: 0 0 0 0 rgba(31, 94, 91, 0.45); } to { box-shadow: 0 0 0 14px rgba(31, 94, 91, 0); } }
@keyframes shake { 0%, 100% { transform: none; } 15% { transform: translateX(-9px); } 30% { transform: translateX(8px); } 45% { transform: translateX(-6px); } 60% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }

@keyframes flash-bad { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }
.opt.right.just, .cw-btn.right.just { animation: good-pop 380ms cubic-bezier(0.2, 1.3, 0.4, 1), glow-good 750ms ease-out; }
.opt.wrong.just, .cw-btn.wrong.just { animation: shake 450ms ease-in-out, glow-bad 750ms ease-out; }
.opt.wrong.just .radio, .cw-btn.wrong.just .mk { animation: tick-in 320ms cubic-bezier(0.2, 1.5, 0.4, 1); }
.slots.shake { animation: shake 450ms ease-in-out; }
.bad-flash { position: fixed; inset: 0; pointer-events: none; z-index: 85; box-shadow: inset 0 0 0 6px var(--bad), inset 0 0 60px rgba(196, 48, 31, 0.25); animation: flash-bad 600ms ease-out forwards; }
.opt.right.just .radio, .cw-btn.right.just .mk { animation: tick-in 320ms cubic-bezier(0.2, 1.5, 0.4, 1); }
@keyframes slot-hop { 0%, 100% { transform: none; } 40% { transform: translateY(-9px); } }
.slots.wave .slot { animation: slot-hop 460ms var(--ease) both; }
.done-check { position: relative; }
@keyframes done-pop { 0% { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes ring-out { from { transform: scale(1); opacity: 0.7; } to { transform: scale(2.2); opacity: 0; } }
.done-check.celebrate { animation: done-pop 520ms cubic-bezier(0.2, 1.3, 0.4, 1) both; }
.done-check.celebrate.big::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--teal); animation: ring-out 900ms 120ms var(--ease) both; }
@media (prefers-reduced-motion: reduce) {

  .opt.right.just, .cw-btn.right.just, .opt.right.just .radio, .cw-btn.right.just .mk, .slots.wave .slot, .done-check.celebrate, .done-check.celebrate.big::after { animation: none !important; }
}

/* ---------- Articles (one news pick a day) */

.news-title { font-family: var(--serif); font-size: 20px; line-height: 25px; font-weight: 500; letter-spacing: -0.01em; }

/* ---------- Onboarding pages */
.ob { display: flex; flex-direction: column; gap: 22px; }
.ob-art { height: 200px; border-radius: var(--r-xl); overflow: hidden; flex: none; }
.ob-art svg { width: 100%; height: 100%; display: block; }
@media (min-width: 700px) { .ob-art { height: 240px; } }
.ob-text { display: flex; flex-direction: column; gap: 14px; }
.ob-text p { font-family: var(--serif); font-size: 21px; line-height: 31px; }
.ob-text p + p { color: var(--muted); }
.ob-dots { display: flex; justify-content: center; gap: 8px; padding: 2px 0 6px; }
.ob-dot { width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--line); border: 0; padding: 0; transition: width 200ms var(--ease), background-color 200ms var(--ease); }
.ob-dot[aria-current="step"] { width: 22px; background: var(--ink); }
.ob-nav { display: flex; gap: 10px; }
.ob-nav .btn-primary { flex: 1; }
.ob-foot { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }
.ob-icon { width: 92px; height: 92px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--teal); }
.ob-icon .i { width: 40px; height: 40px; stroke-width: 1.5; }
.ob-logo { position: relative; height: 100%; }
.ob-logo .logo-anim .la-in { animation: none !important; }
.ob-badge { position: absolute; right: 16px; bottom: 16px; width: 52px; height: 52px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line); color: var(--teal); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-rest); }
.ob-scene { height: 100%; display: flex; align-items: center; justify-content: center; gap: 18px; background: var(--surface-2); }
.me-card { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.me-av { width: 52px; height: 52px; border-radius: var(--r-pill); background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 24px; font-weight: 600; flex: none; }
.me-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.me-name { font-family: var(--serif); font-size: 22px; line-height: 28px; font-weight: 500; overflow-wrap: anywhere; }
.me-card .btn { flex: none; }
@media (max-width: 420px) { .me-card { flex-wrap: wrap; } .me-card .btn { width: 100%; } }
.voice-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.voice-opts { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.voice-opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 8px 8px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-align: left; }
.voice-opt[data-on="true"] { border: 2px solid var(--ink); padding: 7px 7px 7px 13px; }
.voice-pick { flex: 1; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 6px 0; cursor: pointer; text-align: left; color: inherit; min-height: 44px; }
.voice-radio { width: 20px; height: 20px; border-radius: var(--r-pill); border: 2px solid var(--line); flex: none; display: flex; align-items: center; justify-content: center; }
.voice-opt[data-on="true"] .voice-radio { border-color: var(--ink); }
.voice-opt[data-on="true"] .voice-radio::after { content: ""; width: 10px; height: 10px; border-radius: var(--r-pill); background: var(--ink); }
.voice-txt { display: flex; flex-direction: column; gap: 1px; }
.voice-name { font-size: 16px; line-height: 22px; font-weight: 600; }
.voice-desc { font-size: 14px; line-height: 19px; color: var(--muted); }
.voice-badge { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 6px; }

/* ---------- Animated logo (welcome) */
.logo-anim .la-in, .logo-anim .la-float, .logo-anim .la-breathe, .logo-anim .la-tw { transform-box: fill-box; transform-origin: center; }
.logo-anim .la-bar { animation: la-bar 650ms cubic-bezier(0.2, 0.8, 0.2, 1) 150ms both; }
.logo-anim .la-dot { animation: la-dot 950ms cubic-bezier(0.3, 1.55, 0.5, 1) 480ms both; }
.logo-anim .la-halo { animation: la-halo 900ms cubic-bezier(0.2, 0.8, 0.2, 1) 950ms both; }
.logo-anim .la-word { animation: la-word 750ms cubic-bezier(0.2, 0.8, 0.2, 1) 1250ms both; }
.logo-anim .la-line { animation: fade 900ms ease-out both; }
.logo-anim .la-float { animation: la-float 3.8s ease-in-out 2.3s infinite; }
.logo-anim .la-breathe { animation: la-breathe 3.8s ease-in-out 2.3s infinite; }
.logo-anim .la-tw { animation: la-tw 2.8s ease-in-out infinite; }
@keyframes la-bar { from { transform: scaleX(0); } to { transform: none; } }
@keyframes la-dot { 0% { transform: translateY(30px) scale(0.5); opacity: 0; } 18% { opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes la-halo { from { transform: scale(0.35); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes la-word { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes la-float { 0%, 100% { transform: none; } 50% { transform: translateY(-5px); } }
@keyframes la-breathe { 0%, 100% { transform: none; } 50% { transform: scale(1.06); } }
@keyframes la-tw { 0%, 100% { opacity: 0; transform: scale(0.6); } 45%, 55% { opacity: 1; transform: none; } }
.layer.still-layer .logo-anim .la-in { animation: none !important; }
@media (prefers-reduced-motion: reduce) {
  .logo-anim .la-in, .logo-anim .la-float, .logo-anim .la-breathe { animation: none !important; }
  .logo-anim .la-tw { animation: none !important; opacity: 0.8; }
}

/* ---------- Larger screens */
@media (min-width: 700px) {
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: visible; }

}

  .page.narrow { max-width: 640px; }
  .tabbar { top: 0; bottom: 0; right: auto; width: var(--rail); flex-direction: column; gap: 4px; padding: 28px 16px; border-top: 0; border-right: 1px solid var(--line); background: var(--bg); }
  .tabbar .rail-brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 24px; }
  .tabbar .rail-search { display: flex; align-items: center; gap: 10px; height: 44px; margin: 0 4px 16px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 15px; text-align: left; }
  .tabbar .rail-foot { display: block; margin-top: auto; padding: 0 12px; font-size: 13px; line-height: 18px; color: var(--muted); }
  .tab { flex: none; flex-direction: row; gap: 12px; padding: 0 12px; height: 44px; border-radius: 12px; font-size: 15px; }
  .tab .pillwrap { width: auto; height: auto; background: none !important; }
  .tab[aria-current="page"] { background: var(--surface-2); }
  .tab:hover { color: var(--ink); }
  .mobile-only { display: none !important; }
  .daily { flex-direction: row; }

  .daily-body { padding: 28px; justify-content: center; }

  .toast { bottom: 32px; left: calc(50% + var(--rail) / 2); }
}
@media (max-width: 380px) {

  .t-display { font-size: 34px; line-height: 40px; }
}
@media (prefers-reduced-motion: reduce) {

  .layer, .step, .sheet, .scrim, .feedback, .toast { animation: fade 120ms ease-out !important; }
  .layer.still-layer { animation: none !important; }
  .layer.still .step { animation: none !important; }
}

<script type="application/json" id="mindlift-articles">{"articles":[{"date":"2026-10-09","url":"https://www.smithsonianmag.com/smart-news/a-ship-carrying-stacks-of-ancient-dishware-sank-off-the-coast-of-turkey-2100-years-ago-its-ceramic-cargo-is-still-remarkably-intact-180989626/","title":"A Ship Carrying Stacks of Ancient Dishware Sank Off the Coast of Turkey 2,100 Years Ago. Its Ceramic Cargo Is Still Remarkably Intact","source":"Smithsonian Magazine","author":"Sonja Anderson","published":"2026-10-07","lang":"en","cat":"history","readMin":2,"en":{"t":"A 2,100-year-old shipwreck full of neatly packed dinner plates","h":"Off Turkey's southern coast, divers are lifting thousands of ancient plates and bowls that survived the sea for two millennia.","s":"A merchant ship loaded with fine tableware sank near Adrasan, on Turkey's Mediterranean coast, in the first century BCE. A team from Akdeniz University led by Hakan Öniz has been excavating it since 2025 and has sorted thousands of pieces into 122 forms and sizes. Coins from Antioch help date the wreck, and clay packed between the dishes helped keep them whole. Most plates likely came from Rhosus, today's Arsuz, and the ship was probably bound for Rome.","w":"It is a snapshot of ancient trade: a whole shipment of everyday luxury goods, still stacked the way it was loaded. Cicero even mentioned ordering this kind of pottery in a letter in 50 BCE."},"fr":{"t":"Une épave de 2 100 ans remplie d'assiettes bien empilées","h":"Au large de la Turquie, des plongeurs remontent des milliers d'assiettes et de bols antiques restés intacts sous la mer.","s":"Un navire marchand chargé de vaisselle fine a coulé près d'Adrasan, sur la côte méditerranéenne de la Turquie, au Ier siècle avant notre ère. Une équipe de l'Université Akdeniz dirigée par Hakan Öniz le fouille depuis 2025 et a classé des milliers de pièces en 122 formes et tailles. Des pièces de monnaie d'Antioche aident à dater l'épave, et l'argile glissée entre les plats les a protégés. La plupart venaient sans doute de Rhosus, l'actuelle Arsuz, et le bateau filait probablement vers Rome.","w":"C'est un instantané du commerce antique : toute une cargaison de vaisselle de luxe, encore empilée comme au chargement. Cicéron évoquait d'ailleurs ce genre de poterie dans une lettre écrite en 50 avant notre ère."},"audio":["ava","leo"]},{"date":"2026-10-08","url":"https://www.futura-sciences.com/sciences/actualites/chimie-prix-nobel-chimie-2026-francais-henri-kagan-recompense-decouverte-relie-medicaments-mystere-vivant-138324/","title":"Prix Nobel de chimie 2026 : le Français Henri Kagan récompensé pour une découverte qui relie médicaments et mystère du vivant","source":"Futura","author":"Nathalie Mayer","published":"2026-10-07","lang":"fr","cat":"science","readMin":2,"en":{"t":"Why do molecules come in left and right hands?","h":"This year's Nobel Prize in Chemistry rewards reactions that favour one mirror image of a molecule and keep amplifying it.","s":"The 2026 Nobel Prize in Chemistry goes to Henri Kagan of Université Paris-Saclay and Kenso Soai of the Tokyo University of Science. Many molecules exist in two mirror-image forms, like a left and a right hand, and often only one is active: in medicine, the other can be useless or even toxic. The pair discovered reactions that amplify themselves, tipping the mix strongly toward a single form. Their work paved the way for cleaner production of drugs, flavourings and advanced materials.","w":"Life on Earth uses only one hand for its basic building blocks, such as amino acids. Self-amplifying reactions offer a clue to how that lopsided choice might have come about."},"fr":{"t":"Pourquoi les molécules ont-elles une main gauche et une main droite?","h":"Le Nobel de chimie 2026 récompense des réactions qui favorisent un des deux reflets d'une molécule, puis l'amplifient d'elles-mêmes.","s":"Le prix Nobel de chimie 2026 est remis à Henri Kagan, de l'Université Paris-Saclay, et à Kenso Soai, de l'Université des sciences de Tokyo. Bien des molécules existent sous deux formes, reflets l'une de l'autre comme nos deux mains, et souvent une seule est active : en pharmacie, l'autre peut être inutile, voire toxique. Les deux chimistes ont découvert des réactions qui s'amplifient elles-mêmes et font nettement pencher le mélange vers une seule forme. Leurs travaux ont ouvert la voie à une fabrication plus propre de médicaments, d'arômes et de matériaux de pointe.","w":"Le vivant n'utilise qu'une seule « main » pour ses briques de base, comme les acides aminés. Ces réactions qui s'emballent d'elles-mêmes offrent une piste pour comprendre l'origine de ce choix."},"audio":["ava","leo"]},{"date":"2026-10-07","url":"https://www.wusf.org/2026-10-07/who-will-win-the-2026-nobel-prize-in-economics","title":"Who will win the 2026 Nobel Prize in economics?","source":"NPR Planet Money","author":"Greg Rosalsky","published":"2026-10-07","lang":"en","cat":"money","readMin":8,"en":{"t":"Can betting markets predict the Nobel Prize in economics?","h":"Before Monday's announcement, Planet Money looked at a betting market on who will win, and found very few people betting.","s":"The economics prize is the odd one out: Sweden's central bank created it in 1968, long after Alfred Nobel's will. Greg Rosalsky of NPR's Planet Money starts from a Kalshi betting market that put Harvard's Ariel Pakes, known for tools that estimate how mergers affect prices, and Stanford's Susan Athey, who brought machine learning to cause-and-effect questions, near the top. But only about $11,000 had been bet by October 6, so a few people could swing the odds. He adds his own picks, from Raj Chetty to Janet Currie.","w":"It's a neat lesson in how prices carry information, and when they don't: a market with very few traders may say more about a handful of bettors than about the likely winner."},"fr":{"t":"Les paris peuvent-ils prédire le Nobel d'économie?","h":"Avant l'annonce de lundi, Planet Money a examiné un marché de paris sur le futur lauréat. Le hic : très peu de gens y misent.","s":"Le prix d'économie fait bande à part : la banque centrale de Suède l'a créé en 1968, bien après le testament d'Alfred Nobel. Greg Rosalsky, de Planet Money (NPR), part d'un marché de paris de Kalshi qui plaçait en tête Ariel Pakes, de Harvard, connu pour ses outils qui estiment l'effet des fusions sur les prix, et Susan Athey, de Stanford, qui a appliqué l'apprentissage automatique aux questions de cause à effet. Mais à peine 11 000 $ y avaient été misés au 6 octobre : quelques personnes suffisent à faire bouger les cotes. Il ajoute ses favoris, de Raj Chetty à Janet Currie.","w":"Une belle leçon sur l'information que portent les prix, et sur ses limites : un marché qui compte très peu de parieurs en dit parfois plus sur une poignée de gens que sur le gagnant probable."},"audio":["ava","leo"]},{"date":"2026-10-06","url":"https://www.smithsonianmag.com/smart-news/what-are-medieval-english-coins-doing-in-rome-they-could-be-rare-evidence-of-a-little-england-enclave-that-received-special-papal-privileges-180989625/","title":"What Are Medieval English Coins Doing in Rome? They Could Be Rare Evidence of a 'Little England' Enclave That Received Special Papal Privileges","source":"Smithsonian Magazine","author":"Christian Thorsberg","published":"2026-10-06","lang":"en","cat":"history","readMin":4,"en":{"t":"What were English coins doing next to the Vatican?","h":"Twenty silver pennies dug up in Rome may be the first physical trace of a medieval 'Little England' for pilgrims.","s":"In the garden of Rome's Palazzo della Rovere, near the Vatican, archaeologists found 20 English coins from the 900s, struck for Edward the Elder, Athelstan and Eadred, the son and grandsons of Alfred the Great. Historians Rory Naismith (University of Cambridge) and Francesca Tinti (University of the Basque Country) helped read them. Old texts describe the Schola Saxonum, an English quarter for pilgrims founded in the 700s, but no physical trace had been found. The absence of melted-down silver hints that the English there spent their own money.","w":"It's a rare case of archaeology confirming something known only from written records. Hundreds of people may have lived there, working leather, bone and metal."},"fr":{"t":"Que faisaient des pièces anglaises à deux pas du Vatican?","h":"Vingt pièces d'argent déterrées à Rome seraient la première trace concrète d'une « petite Angleterre » médiévale pour les pèlerins.","s":"Dans le jardin du palais della Rovere, près du Vatican, des archéologues ont trouvé 20 pièces anglaises du 10e siècle, frappées au nom d'Édouard l'Ancien, d'Æthelstan et d'Eadred, le fils et les petits-fils d'Alfred le Grand. Les historiens Rory Naismith (Université de Cambridge) et Francesca Tinti (Université du Pays basque) ont aidé à les interpréter. Des textes anciens décrivent la Schola Saxonum, un quartier anglais pour pèlerins fondé au 8e siècle, mais on n'en avait aucune trace matérielle. L'absence d'argent fondu laisse croire que les Anglais y payaient avec leur propre monnaie.","w":"C'est un cas rare où l'archéologie confirme ce qu'on ne connaissait que par les écrits. Des centaines de personnes y auraient vécu en travaillant le cuir, l'os et le métal."},"audio":["ava","leo"]},{"date":"2026-10-05","url":"https://www.nprillinois.org/2026-10-05/karl-deisseroth-winner-of-nobel-prize-in-medicine-explains-the-future-of-optogenetics-discovery","title":"What is optogenetics? Nobel Prize winner Karl Deisseroth explains how light could help treat brain disorders","source":"WBUR Here & Now","author":"Robin Young","published":"2026-10-05","lang":"en","cat":"body","readMin":3,"en":{"t":"How can light switch brain cells on and off?","h":"This year's Nobel Prize in Medicine went to optogenetics. One of the winners explains what it is and where it could lead.","s":"The 2026 Nobel Prize in Physiology or Medicine went to Karl Deisseroth of Stanford, Peter Hegemann of Humboldt University in Berlin and Georg Nagel of the University of Würzburg. In this radio interview, Deisseroth explains the idea: give chosen brain cells a gene from single-celled algae, and the protein it makes responds to light, so a flash can switch those cells on or off. Labs worldwide use it to map which cells do what. In early tests with people blinded by retinitis pigmentosa, it restored some sensitivity to light.","w":"It gives researchers a precise on-off switch for one type of cell at a time in a living brain. Deisseroth hopes that finding the cells behind psychiatric symptoms will lead to better-targeted treatments."},"fr":{"t":"Comment la lumière peut-elle allumer ou éteindre des neurones?","h":"Le Nobel de médecine 2026 récompense l'optogénétique. L'un des lauréats explique de quoi il s'agit et où ça pourrait mener.","s":"Le Nobel de physiologie ou médecine 2026 va à Karl Deisseroth (Stanford), Peter Hegemann (Université Humboldt de Berlin) et Georg Nagel (Université de Wurtzbourg). En entrevue, Deisseroth explique le principe : on donne à certains neurones un gène venu d'algues unicellulaires; la protéine produite réagit à la lumière, si bien qu'un éclair peut allumer ou éteindre ces cellules. Les laboratoires du monde entier s'en servent pour savoir quelles cellules font quoi. Lors de premiers essais chez des personnes aveugles à cause d'une rétinite pigmentaire, elle a redonné une certaine sensibilité à la lumière.","w":"Elle donne aux chercheurs un interrupteur précis, un type de cellule à la fois, dans un cerveau vivant. Deisseroth espère qu'en repérant les cellules en cause dans les troubles psychiatriques, on pourra mieux cibler les traitements."},"audio":["ava","leo"]},{"date":"2026-10-04","url":"https://www.smithsonianmag.com/smart-news/these-wild-lemurs-sing-just-like-opera-stars-widening-their-mouths-as-they-hit-the-high-notes-study-suggests-180989603/","title":"These Wild Lemurs Sing Just Like Opera Stars, Widening Their Mouths as They Hit the High Notes, Study Suggests","source":"Smithsonian Magazine","author":"Sarah Kuta","published":"2026-10-02","lang":"en","cat":"science","readMin":4,"en":{"t":"Why do singing lemurs open wide on the high notes?","h":"The indri, Madagascar's only singing lemur, seems to use the same trick as an opera soprano.","s":"A team led by biologist Filippo Carugati of the University of Turin filmed 19 wild indris in eastern Madagascar and tracked their lips frame by frame across 83 recordings. The higher the note, the wider the mouth. Trained singers do the same to make high notes ring out, a technique called formant tuning. The study, in PLOS Computational Biology, is small, and the payoff for the lemurs, songs that carry through dense forest, is a likely explanation rather than something measured.","w":"Humans and indris last shared an ancestor about 74 million years ago, so the trick probably evolved twice. Indris are critically endangered, with perhaps 1,000 to 10,000 left in the wild."},"fr":{"t":"Pourquoi ce lémurien chanteur ouvre-t-il grand la bouche?","h":"L'indri, seul lémurien chanteur de Madagascar, semble utiliser le même truc qu'une soprano à l'opéra.","s":"Une équipe menée par le biologiste Filippo Carugati, de l'Université de Turin, a filmé 19 indris sauvages dans l'est de Madagascar et suivi leurs lèvres image par image dans 83 enregistrements. Plus la note est aiguë, plus la bouche s'ouvre. Les chanteurs lyriques font pareil pour faire résonner leurs aigus : c'est l'accord des formants. L'étude, parue dans PLOS Computational Biology, est petite, et l'avantage pour les lémuriens (un chant qui porte mieux dans la forêt dense) reste une explication probable, pas une mesure.","w":"Les humains et les indris ont eu un ancêtre commun il y a environ 74 millions d'années : la technique est sans doute apparue deux fois. L'indri est en danger critique; il en resterait de 1 000 à 10 000 à l'état sauvage."},"audio":["ava","leo"]},{"date":"2026-10-03","url":"https://www.smithsonianmag.com/smart-news/google-wants-to-send-data-centers-to-space-and-just-launched-a-satellite-to-test-whether-its-ambitious-plan-will-work-180989613/","title":"Google Wants to Send Data Centers to Space—and Just Launched an Experimental Satellite to Test Whether Its Ambitious Plan Will Work","source":"Smithsonian Magazine","author":"Sara Hashemi","published":"2026-10-02","lang":"en","cat":"tech","readMin":3,"en":{"t":"Why would Google put a data centre in orbit?","h":"Up there the sun almost never sets. Google just launched a first test satellite to see whether the idea can work.","s":"On October 1, Google sent a fridge-sized test satellite into low orbit on a SpaceX rocket, built with the imaging company Planet. It carries four of Google's own AI chips, which work in short bursts and then pause to shed heat. The appeal is power: in orbit, solar panels get sunlight almost all the time, up to eight times what they'd collect on the ground, Google says. The hard parts are heat, radiation and space debris, and four chips add up to roughly one server in a large data centre on Earth.","w":"Data centres already use about 1.5% of the world's electricity, and that share could double by 2030. Where we put the machines that run AI is turning into a real energy and engineering question."},"fr":{"t":"Pourquoi Google veut-il un centre de données en orbite?","h":"Là-haut, le soleil ne se couche presque jamais. Google vient de lancer un premier satellite d'essai pour voir si l'idée tient la route.","s":"Le 1er octobre, une fusée de SpaceX a placé en orbite basse un satellite d'essai de Google, gros comme un réfrigérateur et conçu avec l'entreprise d'imagerie Planet. Il transporte quatre puces d'IA de Google, qui travaillent par courtes séances avant de s'arrêter pour évacuer leur chaleur. L'attrait : en orbite, les panneaux solaires reçoivent la lumière presque en continu, jusqu'à huit fois plus qu'au sol, selon Google. Les défis : la chaleur, les radiations et les débris. Et quatre puces équivalent à peu près à un seul serveur d'un grand centre de données.","w":"Les centres de données consomment déjà environ 1,5 % de l'électricité mondiale, une part qui pourrait doubler d'ici 2030. L'endroit où l'on installe les machines de l'IA devient un vrai casse-tête d'énergie et d'ingénierie."},"audio":["ava","leo"]}]}</script>
