["The far side isn't dark","The side we never see gets sunlight just like ours does. It's simply turned away from Earth. Spacecraft have mapped it."]],
w:"The Moon is still slowly drifting away from us, about 4 cm a year, so the system is still changing.",
k:["The Moon spins once for every orbit, so one face always points at Earth.","Earth's gravity slowed the Moon's spin until it matched.","We see about 59% of the Moon over time, and the far side isn't dark."],
q:[["Does the Moon spin on its axis?",["Yes, once for each orbit around Earth","No, it doesn't spin","Yes, once a day","Only during a full moon"],0,"Its spin and its orbit take the same time: that's tidal locking."],
["About how much of the Moon's surface can we see from Earth over time?",["About 59%","Exactly 50%","About 75%","All of it"],0,"A slight rocking motion lets us see about 59%."],
["Is the far side of the Moon always dark?",["Yes, it never gets sunlight","Only in winter","No, it gets sunlight; it just faces away from us","Nobody knows"],2,"“Far side” means hidden from Earth, not dark."]]},
fr:{t:"Pourquoi voit-on toujours la même face de la Lune?",h:"La Lune tourne bel et bien sur elle-même. Juste à la bonne vitesse pour garder la même face tournée vers nous.",
s:[["Un minutage parfait","La Lune met exactement le même temps à faire un tour sur elle-même qu'à faire le tour de la Terre. C'est ce qu'on appelle la rotation synchrone, ou verrouillage gravitationnel : la même face pointe toujours vers nous."],
["Comment c'est arrivé","La gravité terrestre a étiré la Lune en une forme légèrement ovale, comme un ballon de football. Ce renflement était sans cesse ramené vers la Terre, et l'énergie perdue a ralenti la rotation de la Lune jusqu'à ce que les deux durées concordent."],
["Un léger balancement","Comme l'orbite de la Lune est ovale et que son axe est un peu incliné, elle semble se balancer légèrement. Avec le temps, on voit environ 59 % de sa surface depuis la Terre."],
["La face cachée n'est pas sombre","La face qu'on ne voit jamais reçoit la lumière du Soleil autant que la nôtre. Elle est simplement tournée dans l'autre sens. Des sondes l'ont cartographiée."]],
w:"La Lune s'éloigne encore lentement de nous, d'environ 4 cm par année : le système continue de changer.",
k:["La Lune fait un tour sur elle-même par orbite : une seule face pointe vers la Terre.","La gravité terrestre a ralenti sa rotation jusqu'à ce qu'elle concorde.","On voit environ 59 % de la Lune avec le temps, et la face cachée n'est pas sombre."],
q:[["La Lune tourne-t-elle sur elle-même?",["Oui, une fois par tour de la Terre","Non, elle ne tourne pas","Oui, une fois par jour","Seulement à la pleine lune"],0,"Sa rotation et son orbite durent le même temps : c'est la rotation synchrone."],
["Quelle part de la surface lunaire peut-on voir depuis la Terre, avec le temps?",["Environ 59 %","Exactement 50 %","Environ 75 %","Toute la surface"],0,"Un léger balancement nous permet d'en voir environ 59 %."],
["La face cachée de la Lune est-elle toujours dans le noir?",["Oui, elle ne reçoit jamais de lumière","Seulement en hiver","Non, elle est éclairée; elle est seulement tournée à l'opposé de nous","Personne ne le sait"],2,"« Cachée » veut dire invisible depuis la Terre, pas sombre."]]},
src:[["Tidal Locking","NASA Science","https://science.nasa.gov/moon/tidal-locking/"],["Libration","Wikipedia","https://en.wikipedia.org/wiki/Libration"]]},

{day:20,id:"qwerty-keyboard",cat:"history",min:3,
en:{t:"Why are keyboards QWERTY?",h:"The popular story about jammed typewriters may not be the whole truth.",
s:[["An 1860s invention","Christopher Latham Sholes, a Milwaukee printer and amateur inventor, patented an early typewriter with several colleagues in 1868."],
["The popular story","The usual explanation is that Sholes arranged the keys to stop the metal typebars from jamming when neighbouring letters were typed quickly, by separating common pairs like “th.”"],
["Another theory","A 2011 paper by Koichi and Motoko Yasuoka of Kyoto University argues that telegraph operators, who transcribed Morse code and found an alphabetical layout confusing, shaped the design. In their words, “the typist came before the keyboard.”"],
["How it stuck","Remington began selling QWERTY typewriters in 1874. In 1893, major typewriter makers including Remington merged and adopted QWERTY as the standard. Once millions of people had learned it, it was locked in. The Dvorak layout, developed in the 1930s, never displaced it."]],
w:"Standards often win because everyone already uses them, not because they're the best design. QWERTY is the classic example.",
k:["QWERTY dates from Christopher Latham Sholes's typewriter of the late 1860s.","The jam-prevention story is popular but disputed.","It stuck because typewriter makers standardized on it in 1893."],
q:[["Who designed the early typewriter behind QWERTY?",["Thomas Edison","Alexander Graham Bell","Christopher Latham Sholes","August Dvorak"],2,"Sholes patented an early typewriter with colleagues in 1868."],
["What does the Kyoto University theory say shaped QWERTY?",["Telegraph operators transcribing Morse code","Printers in Paris","Computer programmers","Piano keyboards"],0,"The Yasuokas argue that “the typist came before the keyboard.”"],
["Why did QWERTY become the standard?",["Typewriter makers merged and adopted it in 1893","A law required it","It's scientifically the fastest layout","Dvorak was never invented"],0,"Once the industry standardized on it and millions learned it, it stuck."]]},
fr:{t:"Pourquoi les claviers sont-ils QWERTY?",h:"L'histoire populaire des machines à écrire qui se coinçaient n'est peut-être pas toute la vérité.",
s:[["Une invention des années 1860","Christopher Latham Sholes, imprimeur et inventeur amateur de Milwaukee, a fait breveter une des premières machines à écrire avec quelques collègues, en 1868."],
["L'histoire populaire","L'explication habituelle : Sholes aurait disposé les touches pour éviter que les tiges métalliques se coincent quand on tapait vite des lettres voisines, en séparant des paires fréquentes en anglais comme « th »."],
["Une autre théorie","Un article publié en 2011 par Koichi et Motoko Yasuoka, de l'Université de Kyoto, soutient que ce sont les télégraphistes, qui transcrivaient le morse et trouvaient l'ordre alphabétique déroutant, qui ont façonné la disposition. Selon eux, « le dactylo est venu avant le clavier »."],
["Pourquoi c'est resté","Remington a commencé à vendre des machines QWERTY en 1874. En 1893, de grands fabricants, dont Remington, ont fusionné et adopté le QWERTY comme norme. Une fois que des millions de personnes l'ont appris, il était trop tard pour changer. La disposition Dvorak, créée dans les années 1930, ne l'a jamais remplacé."]],
w:"Une norme gagne souvent parce que tout le monde l'utilise déjà, pas parce qu'elle est la meilleure. Le QWERTY en est l'exemple classique.",
k:["Le QWERTY vient de la machine à écrire de Christopher Latham Sholes, à la fin des années 1860.","L'histoire des touches qui se coinçaient est populaire, mais contestée.","Il s'est imposé parce que les fabricants l'ont adopté comme norme en 1893."],
q:[["Qui a conçu la machine à écrire à l'origine du QWERTY?",["Thomas Edison","Alexander Graham Bell","Christopher Latham Sholes","August Dvorak"],2,"Sholes a fait breveter une des premières machines à écrire avec des collègues en 1868."],
["Selon la théorie de l'Université de Kyoto, qui a façonné le QWERTY?",["Les télégraphistes qui transcrivaient le morse","Des imprimeurs parisiens","Des programmeurs","Les claviers de piano"],0,"Les Yasuoka soutiennent que « le dactylo est venu avant le clavier »."],
["Pourquoi le QWERTY est-il devenu la norme?",["Les fabricants ont fusionné et l'ont adopté en 1893","Une loi l'a imposé","C'est scientifiquement la disposition la plus rapide","Le Dvorak n'a jamais été inventé"],0,"Une fois l'industrie alignée et des millions de gens formés, il s'est imposé."]]},
src:[["The QWERTY Keyboard Will Never Die. Where Did the 150-Year-Old Design Come From?","Smithsonian Magazine","https://www.smithsonianmag.com/history/the-qwerty-keyboard-will-never-die-where-did-the-150-year-old-design-come-from-49863249/"]]}
);

LESSONS.push(
{day:21,id:"brain-freeze",cat:"body",min:3,
en:{t:"What causes brain freeze?",h:"That sudden ice-cream headache may be your brain protecting its temperature.",
s:[["The experiment","In 2012, researchers led by Jorge Serrador studied 13 healthy adults. The volunteers sipped ice water through a straw pressed against the roof of their mouth while blood flow in their brain arteries was monitored. They raised a hand when the pain started, and again when it faded."],
["A rush of blood","As the pain began, a brain artery called the anterior cerebral artery quickly widened, sending a rush of blood. As the pain faded, the artery narrowed again."],
["Why it might hurt","The researchers suggest this is a self-protective response: warm blood rushes in to keep the temperature-sensitive brain warm. But the skull is a closed space, so a sudden flood of blood could raise pressure and cause pain. Narrowing the artery brings the pressure back down."],
["A clue for other headaches","People who get migraines have brain freeze more often. The researchers think similar blood-flow changes may be involved in other headaches. The findings came from a small group and were presented at a scientific conference, so they're an early clue, not the final word."]],
w:"Brain freeze passes quickly because the artery narrows again. Understanding it may one day help researchers understand other kinds of headache.",
k:["During brain freeze, a brain artery suddenly widens.","The rush of blood may protect the brain's temperature but raise pressure.","The evidence is early: one small study."],
q:[["What happened to the anterior cerebral artery when the pain started?",["Nothing changed","It closed completely","It froze","It widened quickly"],3,"It widened, sending a rush of blood, then narrowed as the pain faded."],
["How many people took part in the study?",["3","13","130","1,300"],1,"13 healthy adults, which is why it's an early clue."],
["What purpose did the researchers suggest for the rush of blood?",["Cooling the mouth","Digesting the ice cream","Waking you up","Keeping the brain warm"],3,"Warm blood may protect the temperature-sensitive brain."]]},
fr:{t:"Qu'est-ce qui cause le « gel de cerveau »?",h:"Ce mal de tête soudain quand on mange de la crème glacée, c'est peut-être votre cerveau qui protège sa température.",
s:[["L'expérience","En 2012, des chercheurs dirigés par Jorge Serrador ont étudié 13 adultes en bonne santé. Les volontaires buvaient de l'eau glacée avec une paille appuyée contre le palais, pendant qu'on mesurait le débit sanguin dans les artères de leur cerveau. Ils levaient la main quand la douleur commençait, puis quand elle disparaissait."],
["Un afflux de sang","Au début de la douleur, une artère du cerveau, l'artère cérébrale antérieure, s'élargissait rapidement et envoyait un afflux de sang. Quand la douleur s'estompait, l'artère se resserrait."],
["Pourquoi ça ferait mal","Les chercheurs y voient une réaction de protection : du sang chaud afflue pour garder au chaud un cerveau sensible à la température. Mais le crâne est un espace fermé : un afflux soudain pourrait faire monter la pression et causer de la douleur. En se resserrant, l'artère ramène la pression à la normale."],
["Un indice pour d'autres maux de tête","Les personnes qui ont des migraines ont plus souvent des gels de cerveau. Les chercheurs pensent que des changements semblables du débit sanguin pourraient jouer un rôle dans d'autres maux de tête. Les résultats viennent d'un petit groupe et ont été présentés lors d'un congrès scientifique : c'est un premier indice, pas le dernier mot."]],
w:"Le gel de cerveau passe vite parce que l'artère se resserre. Le comprendre pourrait un jour aider les chercheurs à comprendre d'autres maux de tête.",
k:["Pendant un gel de cerveau, une artère du cerveau s'élargit soudainement.","L'afflux de sang protégerait la température du cerveau, mais ferait monter la pression.","Les preuves sont préliminaires : une seule petite étude."],
q:[["Qu'arrivait-il à l'artère cérébrale antérieure au début de la douleur?",["Rien ne changeait","Elle se fermait complètement","Elle gelait","Elle s'élargissait rapidement"],3,"Elle s'élargissait et envoyait un afflux de sang, puis se resserrait quand la douleur passait."],
["Combien de personnes ont participé à l'étude?",["3","13","130","1 300"],1,"13 adultes en bonne santé : c'est pourquoi on parle d'un premier indice."],
["Quel rôle les chercheurs proposent-ils pour cet afflux de sang?",["Refroidir la bouche","Digérer la crème glacée","Vous réveiller","Garder le cerveau au chaud"],3,"Le sang chaud protégerait un cerveau sensible à la température."]]},
src:[["Changes in brain's blood flow could cause 'brain freeze'","ScienceDaily (American Physiological Society)","https://www.sciencedaily.com/releases/2012/04/120422231742.htm"]]},

{day:22,id:"noise-cancelling",cat:"tech",min:3,
en:{t:"How do noise-cancelling headphones work?",h:"They fight sound with sound.",
s:[["Sound is a wave","Sound is a pressure wave: a pattern of slightly higher and lower air pressure."],
["An opposite wave","A microphone in the headphones picks up the noise around you. Electronics then create a matching wave with the same strength but the opposite pattern: where the noise pushes, the new wave pulls."],
["Waves that cancel","When the two waves meet, they cancel each other out. Physicists call this destructive interference. The noise you hear gets much quieter."],
["Best on steady drones","It works best on constant, low droning sounds like engines, road noise and train rumble. It's less effective on sudden, sharp sounds like voices or breaking glass. For higher-pitched sounds, the ear cups themselves do most of the blocking."],
["Made for pilots","Engineers worked on the idea in the 1950s to reduce cockpit noise. Bose's aviation headsets from the late 1980s are often cited as the first commercial ones."]],
w:"That's why the engine hum fades on a plane while you can still hear the flight attendant speaking.",
k:["Noise-cancelling headphones create an opposite sound wave.","The two waves cancel out: destructive interference.","It works best on steady, low sounds like engines."],
q:[["How do noise-cancelling headphones reduce noise?",["By creating an opposite sound wave that cancels the noise","By blocking all air","By playing louder music","By lowering your hearing sensitivity"],0,"The opposite wave and the noise cancel each other out."],
["What kind of sound do they cancel best?",["Sudden, sharp sounds","Steady, low droning, like engines","Human voices","Breaking glass"],1,"Constant low sounds are the easiest to predict and cancel."],
["What do physicists call waves cancelling each other?",["Resonance","Destructive interference","Echo","Amplification"],1,"Destructive interference: two opposite waves add up to near silence."]]},
fr:{t:"Comment fonctionnent les écouteurs à réduction de bruit?",h:"Ils combattent le son avec du son.",
s:[["Le son est une onde","Le son est une onde de pression : une alternance de pression d'air un peu plus haute et un peu plus basse."],
["Une onde inversée","Un microphone dans les écouteurs capte le bruit ambiant. L'électronique crée ensuite une onde de même intensité, mais inversée : là où le bruit pousse, la nouvelle onde tire."],
["Des ondes qui s'annulent","Quand les deux ondes se rencontrent, elles s'annulent. Les physiciens appellent ça une interférence destructive. Le bruit que vous entendez diminue beaucoup."],
["Efficaces sur les bourdonnements","Ça fonctionne le mieux sur les bruits constants et graves, comme les moteurs, le bruit de la route ou le grondement d'un train. C'est moins efficace sur les bruits soudains et aigus, comme les voix ou du verre qui se brise. Pour les sons plus aigus, ce sont surtout les coussinets eux-mêmes qui bloquent le bruit."],
["Conçus pour les pilotes","Des ingénieurs ont travaillé sur l'idée dans les années 1950 pour réduire le bruit dans le poste de pilotage. Les casques d'aviation de Bose, à la fin des années 1980, sont souvent cités comme les premiers modèles commerciaux."]],
w:"C'est pour ça qu'en avion, le bourdonnement du moteur s'efface alors que vous entendez encore l'agent de bord.",
k:["Les écouteurs à réduction de bruit créent une onde sonore inversée.","Les deux ondes s'annulent : c'est l'interférence destructive.","Ça marche le mieux sur les sons graves et constants, comme les moteurs."],
q:[["Comment les écouteurs à réduction de bruit atténuent-ils le bruit?",["En créant une onde inversée qui annule le bruit","En bloquant tout l'air","En jouant la musique plus fort","En diminuant la sensibilité de l'oreille"],0,"L'onde inversée et le bruit s'annulent."],
["Quel type de bruit annulent-ils le mieux?",["Les bruits soudains et aigus","Les bourdonnements graves et constants, comme les moteurs","Les voix","Le verre qui se brise"],1,"Les sons graves et constants sont les plus faciles à prévoir et à annuler."],
["Comment les physiciens appellent-ils des ondes qui s'annulent?",["La résonance","L'interférence destructive","L'écho","L'amplification"],1,"L'interférence destructive : deux ondes inversées donnent presque le silence."]]},
src:[["How do Active Noise Canceling Headphones Work?","Scientific American","https://www.scientificamerican.com/blog/psi-vid/how-do-active-noise-canceling-headphones-work/"],["Noise-cancelling headphones","Wikipedia","https://en.wikipedia.org/wiki/Noise-cancelling_headphones"]]},

{day:23,id:"inflation-basket",cat:"money",min:4,
en:{t:"What's actually in the inflation “basket”?",h:"When you hear an inflation number, it's measured on a shopping basket that may not look like yours.",
s:[["A fixed basket","Statistics Canada measures inflation with the Consumer Price Index, by tracking the cost of a fixed basket of goods and services over time."],
["Weighted by spending","Each item counts in proportion to how much households spend on it. Big spending categories move the index more than small ones."],
["Today's basket","Since the May 2026 index, the weights are based on 2025 spending: shelter 28.5%, transportation 17.9%, food 16.8%, household operations and furnishings 13.2%, recreation, education and reading 10.0%, health and personal care 5.4%, clothing and footwear 4.5%, and alcohol, tobacco and cannabis 3.8%."],
["It gets updated","The weights change as spending habits change. In the latest update, transportation gained the most. Shelter's share dipped slightly, mainly because of lower mortgage interest costs."]],
w:"Official inflation is an average. If more of your budget goes to rent or transportation than the basket assumes, your own experience of rising prices can feel quite different.",
k:["Inflation in Canada is measured with a weighted basket of goods and services.","Shelter is the biggest part of the basket, at about 28.5%.","The weights are updated as household spending changes."],
q:[["Who measures the Consumer Price Index in Canada?",["The Bank of Canada","Each province","Statistics Canada","The banks"],2,"Statistics Canada tracks the cost of the basket."],
["Which category has the biggest weight in the basket?",["Food","Shelter","Clothing","Transportation"],1,"Shelter, at about 28.5%."],
["Which category gained the most weight in the latest update?",["Shelter","Transportation","Alcohol and tobacco","Recreation"],1,"Transportation had the largest gain in basket share."]]},
fr:{t:"Qu'y a-t-il vraiment dans le « panier » de l'inflation?",h:"Quand vous entendez un taux d'inflation, il est calculé sur un panier d'achats qui ne ressemble peut-être pas au vôtre.",
s:[["Un panier fixe","Statistique Canada mesure l'inflation avec l'Indice des prix à la consommation, en suivant le coût d'un panier fixe de biens et de services au fil du temps."],
["Pondéré selon les dépenses","Chaque élément compte en proportion de ce que les ménages y consacrent. Les grosses catégories de dépenses font davantage bouger l'indice."],
["Le panier actuel","Depuis l'indice de mai 2026, les pondérations reposent sur les dépenses de 2025 : logement 28,5 %, transport 17,9 %, aliments 16,8 %, dépenses courantes, ameublement et équipement du ménage 13,2 %, loisirs, formation et lecture 10,0 %, soins de santé et soins personnels 5,4 %, vêtements et chaussures 4,5 %, et boissons alcoolisées, produits du tabac et cannabis récréatif 3,8 %."],
["Il est mis à jour","Les pondérations changent avec les habitudes de consommation. Lors de la dernière mise à jour, c'est le transport qui a le plus augmenté. La part du logement a légèrement diminué, surtout en raison de la baisse des frais d'intérêt hypothécaire."]],
w:"L'inflation officielle est une moyenne. Si une plus grande part de votre budget va au loyer ou au transport que dans le panier, la hausse des prix peut vous sembler très différente.",
k:["Au Canada, l'inflation se mesure avec un panier pondéré de biens et de services.","Le logement en est la plus grosse part, environ 28,5 %.","Les pondérations sont mises à jour selon les dépenses des ménages."],
q:[["Qui mesure l'Indice des prix à la consommation au Canada?",["La Banque du Canada","Chaque province","Statistique Canada","Les banques"],2,"Statistique Canada suit le coût du panier."],
["Quelle catégorie pèse le plus lourd dans le panier?",["Les aliments","Le logement","Les vêtements","Le transport"],1,"Le logement, environ 28,5 %."],
["Quelle catégorie a le plus augmenté lors de la dernière mise à jour?",["Le logement","Le transport","L'alcool et le tabac","Les loisirs"],1,"C'est le transport qui a gagné la plus grande part."]]},
src:[["An Analysis of the 2026 Consumer Price Index Basket Update, Based on 2025 Expenditures","Statistics Canada","https://www150.statcan.gc.ca/n1/pub/62f0014m/62f0014m2026005-eng.htm"]]},

{day:24,id:"video-call-fatigue",cat:"work",min:3,
en:{t:"Why are video calls so tiring?",h:"A Stanford researcher found four reasons, and they're about the tools, not about you.",
s:[["Too much eye contact","In a 2021 paper, Stanford professor Jeremy Bailenson pointed out that on video, everyone is looking at everyone, all the time."],
["A mirror that follows you","Seeing your own image all day is stressful, a bit like being followed around by a mirror."],
["Stuck in one spot","The camera's frame keeps you in a small area, so you lose the natural movement you'd have in a room or on a phone call."],
["Extra mental work","Nonverbal cues are harder on video. You have to exaggerate nods and gestures and keep them in frame, which takes effort."],
["Small changes that help","Bailenson's suggestions: use a smaller window instead of full screen, hide your self-view, put the camera farther away so you can move, and take short audio-only breaks."]],
w:"Video-call fatigue comes largely from how the tools work. A few settings can make the same meeting less draining.",
k:["Constant close-up eye contact is tiring.","Watching yourself all day adds stress.","Hiding self-view and audio-only breaks can help."],
q:[["Which of these is one of Bailenson's four causes of video-call fatigue?",["Bad internet only","Too few meetings","Seeing your own image constantly","Bright screens"],2,"Constant self-view is stressful, like a mirror following you."],
["Why does video limit your movement?",["The camera's frame keeps you in one spot","Laptops are heavy","Meetings are shorter","Headphones have cords"],0,"Staying in frame keeps you more still than normal."],
["Which change did Bailenson suggest?",["Making the window full screen","Hiding your self-view","Adding more participants","Sitting closer to the camera"],1,"Hiding self-view removes the “mirror” effect."]]},
fr:{t:"Pourquoi les appels vidéo sont-ils si fatigants?",h:"Un chercheur de Stanford a trouvé quatre raisons. Elles tiennent aux outils, pas à vous.",
s:[["Trop de contact visuel","Dans un article publié en 2021, le professeur Jeremy Bailenson, de l'Université Stanford, a souligné qu'en vidéo, tout le monde regarde tout le monde, tout le temps."],
["Un miroir qui vous suit","Voir sa propre image toute la journée est stressant, un peu comme être suivi partout par un miroir."],
["Coincé au même endroit","Le cadre de la caméra vous garde dans un petit espace : vous perdez les mouvements naturels que vous auriez dans une salle ou au téléphone."],
["Un effort mental de plus","Les signaux non verbaux sont plus difficiles en vidéo. Il faut exagérer les hochements de tête et les gestes, et les garder dans le cadre, ce qui demande un effort."],
["De petits changements qui aident","Les suggestions de Bailenson : réduire la fenêtre plutôt que d'utiliser le plein écran, masquer votre propre image, éloigner la caméra pour pouvoir bouger et prendre de courtes pauses en audio seulement."]],
w:"La fatigue des appels vidéo vient en bonne partie du fonctionnement des outils. Quelques réglages peuvent rendre la même réunion moins épuisante.",
k:["Un contact visuel rapproché et constant est fatigant.","Se regarder toute la journée ajoute du stress.","Masquer sa propre image et prendre des pauses audio peut aider."],
q:[["Laquelle de ces causes fait partie des quatre causes de Bailenson?",["Seulement une mauvaise connexion Internet","Trop peu de réunions","Voir constamment sa propre image","Des écrans trop lumineux"],2,"Se voir sans cesse est stressant, comme un miroir qui vous suit."],
["Pourquoi la vidéo limite-t-elle vos mouvements?",["Le cadre de la caméra vous garde au même endroit","Les ordinateurs portables sont lourds","Les réunions sont plus courtes","Les écouteurs ont des fils"],0,"Rester dans le cadre vous rend plus immobile que d'habitude."],
["Quel changement Bailenson suggère-t-il?",["Passer en plein écran","Masquer sa propre image","Ajouter des participants","S'approcher de la caméra"],1,"Masquer votre image supprime l'effet « miroir »."]]},
src:[["Stanford researchers identify four causes for 'Zoom fatigue' and their simple fixes","Stanford Report","https://news.stanford.edu/stories/2021/02/four-causes-zoom-fatigue-solutions"]]},

{day:25,id:"ocean-salty",cat:"science",min:3,
en:{t:"Why is the ocean salty?",h:"Much of the salt in the sea started out as rock on land.",
s:[["Rain wears down rock","Rain is slightly acidic. Over time, it erodes rock and releases minerals, which streams and rivers carry to the sea. This is the main source of the ocean's dissolved salts."],
["Salt from below","Seawater also seeps into cracks in the ocean floor, gets heated by magma, and comes back out through hydrothermal vents carrying dissolved minerals. Underwater volcanoes and undersea salt deposits add more."],
["Why it builds up","When seawater evaporates, the water leaves, but the salt stays behind."],
["What's in it","Chloride and sodium, the two parts of table salt, make up about 85% of the dissolved minerals. Magnesium and sulfate add about another 10%. On average, seawater is about 3.5% salt by weight, or 35 parts per thousand."]],
w:"A glass of seawater carries traces of rock that wore away on land, possibly a very long time ago.",
k:["Most ocean salt comes from rock on land, worn down by rain and carried by rivers.","Vents and volcanoes on the sea floor add minerals too.","Seawater is about 3.5% salt, mostly sodium and chloride."],
q:[["What is the main source of the ocean's salt?",["Salt added by people","Fish","Melting icebergs","Rock on land, worn down by rain and carried by rivers"],3,"Rainwater erodes rock, and rivers carry the minerals to the sea."],
["Which two make up about 85% of the dissolved minerals in seawater?",["Calcium and iron","Chloride and sodium","Magnesium and sulfate","Potassium and zinc"],1,"Chloride and sodium, the parts of table salt."],
["On average, how salty is seawater?",["About 3.5% salt","About 0.5% salt","About 15% salt","About 35% salt"],0,"About 35 parts per thousand, or 3.5% by weight."]]},
fr:{t:"Pourquoi la mer est-elle salée?",h:"Une bonne partie du sel de la mer était d'abord de la roche, sur la terre ferme.",
s:[["La pluie use la roche","L'eau de pluie est légèrement acide. Avec le temps, elle érode la roche et libère des minéraux, que les ruisseaux et les rivières transportent jusqu'à la mer. C'est la principale source des sels dissous de l'océan."],
["Du sel venu d'en dessous","L'eau de mer s'infiltre aussi dans les fissures du fond océanique, est chauffée par le magma, puis ressort par des sources hydrothermales chargée de minéraux dissous. Les volcans sous-marins et les gisements de sel sous la mer en ajoutent encore."],
["Pourquoi le sel s'accumule","Quand l'eau de mer s'évapore, l'eau s'en va, mais le sel reste."],
["Ce qu'elle contient","Le chlorure et le sodium, les deux composants du sel de table, représentent environ 85 % des minéraux dissous. Le magnésium et le sulfate en ajoutent environ 10 %. En moyenne, l'eau de mer contient environ 3,5 % de sel en poids, soit 35 parties pour mille."]],
w:"Un verre d'eau de mer contient des traces de roches usées sur la terre ferme, peut-être il y a très longtemps.",
k:["La plupart du sel marin vient de roches usées par la pluie et transportées par les rivières.","Les sources hydrothermales et les volcans sous-marins ajoutent aussi des minéraux.","L'eau de mer contient environ 3,5 % de sel, surtout du sodium et du chlorure."],
q:[["Quelle est la principale source du sel de la mer?",["Le sel ajouté par les humains","Les poissons","La fonte des icebergs","Les roches sur terre, usées par la pluie et transportées par les rivières"],3,"La pluie érode la roche, et les rivières apportent les minéraux à la mer."],
["Quels deux éléments représentent environ 85 % des minéraux dissous dans l'eau de mer?",["Le calcium et le fer","Le chlorure et le sodium","Le magnésium et le sulfate","Le potassium et le zinc"],1,"Le chlorure et le sodium, les composants du sel de table."],
["En moyenne, à quel point l'eau de mer est-elle salée?",["Environ 3,5 % de sel","Environ 0,5 % de sel","Environ 15 % de sel","Environ 35 % de sel"],0,"Environ 35 parties pour mille, soit 3,5 % en poids."]]},
src:[["Why is the ocean salty?","NOAA National Ocean Service","https://oceanservice.noaa.gov/facts/whysalty.html"]]},

{day:26,id:"name-of-montreal",cat:"history",min:3,
en:{t:"Where does the name Montréal come from?",h:"The city is named after its mountain, with a spelling from the 1500s.",
s:[["Cartier's mountain","In 1535, Jacques Cartier reached the village of Hochelaga, on the island. On October 3, 1535, he named the mountain, writing: “Nous nommasmes icelle montaigne le mont Royal” — “We named that mountain Mount Royal.”"],
["Royal becomes Réal","In the 1500s, “réal” was a variant of “royal.” The best-known explanation is that Mont Royal became Mont Réal, then Montréal. In 1556, the Italian geographer Giovanni Battista Ramusio wrote “Monte Real” on his map of Hochelaga."],
["First, Ville-Marie","In 1642, Paul de Chomedey de Maisonneuve founded a settlement on the island for the Société Notre-Dame de Montréal. It was named Ville-Marie, in honour of the Virgin Mary. During the 1700s, the name Montréal replaced it."],
["Older names","The island had Indigenous names long before. Today, Montréal is also known by its modern Iroquoian name, Tiohtià:ke."]],
w:"Every time you say Montréal, you're using a 16th-century way of saying “royal mountain.”",
k:["Jacques Cartier named the mountain Mont Royal in 1535.","“Réal” was an old variant of “royal,” which led to Montréal.","The first French settlement, in 1642, was called Ville-Marie."],
q:[["Who named the mountain Mont Royal?",["Jacques Cartier","Samuel de Champlain","Paul de Chomedey de Maisonneuve","Giovanni Battista Ramusio"],0,"Jacques Cartier, on October 3, 1535."],
["What was the 1642 settlement first called?",["Hochelaga","Mont-Réal","Ville-Marie","Nouvelle-France"],2,"Ville-Marie, in honour of the Virgin Mary."],
["What was “réal” in the 1500s?",["A coin","A type of tree","An Indigenous word","A variant of “royal”"],3,"“Réal” was a 16th-century variant of “royal.”"]]},
fr:{t:"D'où vient le nom Montréal?",h:"La ville porte le nom de sa montagne, avec une orthographe qui date des années 1500.",
s:[["La montagne de Cartier","En 1535, Jacques Cartier atteint le village d'Hochelaga, sur l'île. Le 3 octobre 1535, il nomme la montagne en écrivant : « Nous nommasmes icelle montaigne le mont Royal »."],
["Royal devient Réal","Au 16e siècle, « réal » était une variante de « royal ». Selon l'explication la plus connue, le mont Royal serait devenu le mont Réal, puis Montréal. En 1556, le géographe italien Giovanni Battista Ramusio inscrivait « Monte Real » sur sa carte d'Hochelaga."],
["D'abord, Ville-Marie","En 1642, Paul de Chomedey de Maisonneuve fonde un établissement sur l'île pour la Société Notre-Dame de Montréal. On le nomme Ville-Marie, en l'honneur de la Vierge. Au cours du 18e siècle, le nom Montréal le remplace."],
["Des noms plus anciens","L'île avait des noms autochtones bien avant. Aujourd'hui, Montréal est aussi connue sous son nom iroquoien moderne, Tiohtià:ke."]],
w:"Chaque fois que vous dites « Montréal », vous utilisez une façon du 16e siècle de dire « mont royal ».",
k:["Jacques Cartier a nommé la montagne « mont Royal » en 1535.","« Réal » était une ancienne variante de « royal », d'où Montréal.","Le premier établissement français, en 1642, s'appelait Ville-Marie."],
q:[["Qui a nommé la montagne « mont Royal »?",["Jacques Cartier","Samuel de Champlain","Paul de Chomedey de Maisonneuve","Giovanni Battista Ramusio"],0,"Jacques Cartier, le 3 octobre 1535."],
["Comment s'appelait d'abord l'établissement fondé en 1642?",["Hochelaga","Mont-Réal","Ville-Marie","Nouvelle-France"],2,"Ville-Marie, en l'honneur de la Vierge."],
["Qu'était le mot « réal » au 16e siècle?",["Une pièce de monnaie","Une sorte d'arbre","Un mot autochtone","Une variante de « royal »"],3,"« Réal » était une variante de « royal » au 16e siècle."]]},
src:[["Name of Montreal","Wikipedia","https://en.wikipedia.org/wiki/Name_of_Montreal"]]},

{day:27,id:"onions-cry",cat:"body",min:3,
en:{t:"Why do onions make you cry?",h:"Cutting an onion sets off a small chemical chain reaction, and it ends at your eyes.",
s:[["Breaking cells","When you cut an onion, you break open its cells. Enzymes then go to work on the onion's sulfur compounds."],
["The real culprit","For a long time, scientists blamed an enzyme called alliinase. Japanese researchers later found that a different, previously unknown enzyme, lachrymatory-factor synthase, is the key. The reaction produces an irritating gas called syn-propanethial-S-oxide."],
["Your eyes respond","The gas floats up to your eyes and stimulates your tear glands, called lachrymal glands, which release tears."]],
w:"Those tears are a reflex: your eyes are responding to an irritant in the air, not to anything you feel.",
k:["Cutting an onion breaks its cells and starts a chemical reaction.","The reaction makes an irritating gas: syn-propanethial-S-oxide.","The gas triggers your tear glands."],
q:[["What starts the reaction that makes you cry?",["The onion's smell alone","Cutting breaks the onion's cells","Cold onions","The onion's skin"],1,"Broken cells let enzymes act on sulfur compounds."],
["Which enzyme did Japanese researchers identify as the key?",["Lactase","Lachrymatory-factor synthase","Amylase","Pepsin"],1,"A previously unknown enzyme, lachrymatory-factor synthase."],
["What do the tears come from?",["Onion juice in your eyes","Tear glands stimulated by the gas","Sadness","Dry air"],1,"The gas stimulates the lachrymal glands, which release tears."]]},
fr:{t:"Pourquoi les oignons nous font-ils pleurer?",h:"Couper un oignon déclenche une petite réaction chimique en chaîne, qui se termine dans vos yeux.",
s:[["Des cellules brisées","Quand vous coupez un oignon, vous brisez ses cellules. Des enzymes se mettent alors à transformer les composés soufrés de l'oignon."],
["Le vrai coupable","Longtemps, les scientifiques ont accusé une enzyme appelée alliinase. Des chercheurs japonais ont ensuite découvert qu'une autre enzyme, jusque-là inconnue, la synthase du facteur lacrymogène, joue le rôle clé. La réaction produit un gaz irritant, l'oxyde de syn-propanethial (syn-propanethial-S-oxyde)."],
["Vos yeux réagissent","Le gaz monte jusqu'à vos yeux et stimule vos glandes lacrymales, qui libèrent des larmes."]],
w:"Ces larmes sont un réflexe : vos yeux réagissent à un irritant dans l'air, pas à une émotion.",
k:["Couper un oignon brise ses cellules et déclenche une réaction chimique.","La réaction produit un gaz irritant, le syn-propanethial-S-oxyde.","Ce gaz stimule les glandes lacrymales."],
q:[["Qu'est-ce qui déclenche la réaction qui fait pleurer?",["La seule odeur de l'oignon","La coupe, qui brise les cellules de l'oignon","Un oignon froid","La pelure de l'oignon"],1,"Les cellules brisées permettent aux enzymes d'agir sur les composés soufrés."],
["Quelle enzyme des chercheurs japonais ont-ils désignée comme clé?",["La lactase","La synthase du facteur lacrymogène","L'amylase","La pepsine"],1,"Une enzyme jusque-là inconnue : la synthase du facteur lacrymogène."],
["D'où viennent les larmes?",["Du jus d'oignon dans les yeux","Des glandes lacrymales stimulées par le gaz","De la tristesse","De l'air sec"],1,"Le gaz stimule les glandes lacrymales, qui libèrent des larmes."]]},
src:[["Why does chopping an onion make you cry?","Library of Congress, Everyday Mysteries","https://www.loc.gov/everyday-mysteries/food-and-nutrition/item/why-does-chopping-an-onion-make-you-cry/"]]},

{day:28,id:"airplane-mode",cat:"tech",min:3,
en:{t:"Why do we need airplane mode?",h:"The rule is older than smartphones, and the danger it guards against was never clearly shown.",
s:[["What it does","Airplane mode switches off a device's radio transmissions: cellular, Wi-Fi and Bluetooth. Apps that don't need a connection keep working."],
["A 1991 precaution","In 1991, the US Federal Communications Commission banned the airborne use of most cell phones because of possible interference with airplane systems. Clear scientific evidence of that danger was never established."],
["Rules relax","In 2013, after an expert committee concluded that most commercial airplanes can tolerate radio signals from personal devices, the US Federal Aviation Administration allowed devices in airplane mode from gate to gate. Europe's aviation safety agency did the same that December. Wi-Fi can be used when the airline offers it."],
["Calls are a separate question","In the US, FCC rules have long prohibited cell phone calls in the air. In Europe, since 2023, airlines have been allowed to install small on-board cell stations to offer mobile service in flight."]],
w:"Today, airplane mode is less about danger and more about rules and courtesy. On board, the crew's instructions are what count.",
k:["Airplane mode turns off a device's radio transmissions.","The rule began in 1991 as a precaution.","Since 2013, devices in airplane mode have been allowed throughout US and European flights."],
q:[["What does airplane mode switch off?",["Radio transmissions like cellular, Wi-Fi and Bluetooth","All apps","The screen","The battery"],0,"It suspends the device's radio signals; offline apps still work."],
["When did the FCC ban airborne use of most cell phones?",["1971","1991","2007","2013"],1,"In 1991, as a precaution against possible interference."],
["What did the FAA allow in 2013?",["Phone calls during takeoff","Unlimited free Wi-Fi","Turning off seatbelt signs","Devices in airplane mode from gate to gate"],3,"After a review found most airplanes tolerate device signals."]]},
fr:{t:"À quoi sert le mode avion?",h:"La règle est plus vieille que les téléphones intelligents, et le danger qu'elle vise n'a jamais été clairement démontré.",
s:[["Ce qu'il fait","Le mode avion coupe les transmissions radio d'un appareil : réseau cellulaire, Wi-Fi et Bluetooth. Les applications qui n'ont pas besoin de connexion continuent de fonctionner."],
["Une précaution de 1991","En 1991, la Federal Communications Commission (FCC) des États-Unis a interdit l'usage en vol de la plupart des téléphones cellulaires, en raison d'un risque possible d'interférence avec les systèmes de l'avion. Aucune preuve scientifique claire de ce danger n'a jamais été établie."],
["Des règles assouplies","En 2013, après qu'un comité d'experts a conclu que la plupart des avions commerciaux tolèrent les signaux radio des appareils personnels, la Federal Aviation Administration (FAA) des États-Unis a permis leur usage en mode avion, de la porte d'embarquement à l'arrivée. L'agence européenne de la sécurité aérienne a fait de même en décembre. Le Wi-Fi est permis quand la compagnie aérienne l'offre."],
["Les appels, c'est autre chose","Aux États-Unis, les règles de la FCC interdisent depuis longtemps les appels cellulaires en vol. En Europe, depuis 2023, les compagnies aériennes peuvent installer à bord de petites stations cellulaires pour offrir un service mobile en vol."]],
w:"Aujourd'hui, le mode avion relève moins du danger que des règles et de la courtoisie. À bord, ce sont les consignes de l'équipage qui comptent.",
k:["Le mode avion coupe les transmissions radio d'un appareil.","La règle date de 1991 et était une précaution.","Depuis 2013, les appareils en mode avion sont permis pendant tout le vol aux États-Unis et en Europe."],
q:[["Qu'est-ce que le mode avion désactive?",["Les transmissions radio comme le cellulaire, le Wi-Fi et le Bluetooth","Toutes les applications","L'écran","La pile"],0,"Il suspend les signaux radio; les applications hors ligne fonctionnent toujours."],
["Quand la FCC a-t-elle interdit l'usage en vol de la plupart des cellulaires?",["1971","1991","2007","2013"],1,"En 1991, par précaution contre une interférence possible."],
["Qu'a permis la FAA en 2013?",["Les appels pendant le décollage","Le Wi-Fi gratuit et illimité","L'arrêt des consignes de ceinture","Les appareils en mode avion de la porte d'embarquement à l'arrivée"],3,"Après qu'un examen a montré que la plupart des avions tolèrent ces signaux."]]},
src:[["Airplane mode","Wikipedia","https://en.wikipedia.org/wiki/Airplane_mode"],["Portable Electronic Devices (PEDs)","Federal Aviation Administration","https://www.faa.gov/about/initiatives/ped"]]},

{day:29,id:"canada-penny",cat:"money",min:3,
en:{t:"Why did Canada get rid of the penny?",h:"Each one cost more to make than it was worth.",
s:[["More than a cent","It cost the federal government 1.6 cents to make each new penny. Supplying pennies to the economy cost about $11 million a year."],
["The last one","The Royal Canadian Mint in Winnipeg struck Canada's last penny on May 4, 2012. In 2013, stores stopped handing them out as change."],
["Rounding, only for cash","When you pay cash, the final total, after taxes, is rounded to the nearest five cents. A total ending in 1 or 2 cents rounds down; one ending in 3 or 4 rounds up. Payments by card, debit or cheque are still made to the exact cent."],
["Still money","The penny keeps its value, so any you still have can be used. Canada's first one-cent coins date back to 1858."]],
w:"Rounding goes both ways and applies only to cash totals. Pay by card and you pay to the cent.",
k:["Each penny cost 1.6 cents to make.","The last Canadian penny was struck in 2012.","Only cash totals are rounded to the nearest five cents."],
q:[["How much did it cost to make each penny?",["0.5 cents","1 cent","1.6 cents","5 cents"],2,"1.6 cents, more than the coin was worth."],
["When paying cash, a total of $4.03 becomes:",["$4.00","$4.05","$4.10","$4.03"],1,"Totals ending in 3 or 4 cents round up to the nearest five cents."],
["Are card payments rounded too?",["Yes, always","Only on weekends","Only above $100","No, they're paid to the exact cent"],3,"Rounding applies only to cash totals."]]},
fr:{t:"Pourquoi le Canada a-t-il abandonné la cenne noire?",h:"Chaque pièce coûtait plus cher à fabriquer qu'elle ne valait.",
s:[["Plus qu'un cent","Il en coûtait au gouvernement fédéral 1,6 cent pour fabriquer chaque nouvelle pièce d'un cent. Approvisionner l'économie en pièces d'un cent coûtait environ 11 millions de dollars par année."],
["La dernière","La Monnaie royale canadienne a frappé la dernière pièce d'un cent du pays le 4 mai 2012, à Winnipeg. En 2013, les commerces ont cessé de la remettre en monnaie."],
["L'arrondi, seulement en argent comptant","Quand vous payez comptant, le total final, taxes comprises, est arrondi aux cinq cents les plus près. Un total qui finit par 1 ou 2 cents est arrondi vers le bas; par 3 ou 4 cents, vers le haut. Les paiements par carte de crédit, par carte de débit ou par chèque se font toujours au cent près."],
["Encore de l'argent","La pièce d'un cent garde sa valeur : celles qui vous restent peuvent encore servir. Les premières pièces d'un cent du Canada remontent à 1858."]],
w:"L'arrondi va dans les deux sens et ne s'applique qu'aux totaux payés comptant. À la carte, vous payez au cent près.",
k:["Chaque cenne coûtait 1,6 cent à fabriquer.","La dernière pièce d'un cent canadienne a été frappée en 2012.","Seuls les totaux payés comptant sont arrondis aux cinq cents."],
q:[["Combien coûtait la fabrication de chaque pièce d'un cent?",["0,5 cent","1 cent","1,6 cent","5 cents"],2,"1,6 cent, soit plus que la valeur de la pièce."],
["En argent comptant, un total de 4,03 $ devient :",["4,00 $","4,05 $","4,10 $","4,03 $"],1,"Un total qui finit par 3 ou 4 cents est arrondi vers le haut."],
["Les paiements par carte sont-ils arrondis aussi?",["Oui, toujours","Seulement la fin de semaine","Seulement au-dessus de 100 $","Non, ils se font au cent près"],3,"L'arrondi ne s'applique qu'aux totaux payés comptant."]]},
src:[["Whatever happened to the penny? A history of our one-cent coin","Bank of Canada Museum","https://www.bankofcanadamuseum.ca/2025/08/whatever-happened-to-the-penny-a-history-of-our-one-cent-coin/"],["Eliminating the Penny (Budget 2012)","Government of Canada","https://www.budget.canada.ca/2012/themes/theme2-eng.pdf"]]},

{day:30,id:"forgetting-curve",cat:"work",min:4,
en:{t:"Why do we forget what we learn?",h:"Most forgetting happens fast, and someone first measured it more than 140 years ago.",
s:[["One man, many nonsense syllables","In the 1880s, Hermann Ebbinghaus memorized lists of nonsense syllables, made-up sounds with no meaning. He was the only person in his experiments."],
["Measuring what's left","He measured how much faster he could relearn a list later. Twenty minutes after learning, relearning took about 58% less time than the first time. After an hour, about 44% less. After a day, about 34% less. Forgetting is fast at first, then slows down."],
["Tested again in 2015","Researchers Murre and Dros repeated the experiment. One person spent 70 hours learning lists and relearning them after 20 minutes, 1 hour, 9 hours, and 1, 2 and 31 days. The curve held up. They also saw a small upward bump at 24 hours, possibly linked to sleep, which still needs more testing."],
["Memory leaves a trace","Even after you seem to forget, relearning is faster than learning the first time. That's exactly what Ebbinghaus's “savings” measure shows."]],
w:"That's why each lesson ends with a few questions, and why coming back to an idea later takes less effort than learning it the first time.",
k:["Forgetting is fastest right after learning, then slows.","Ebbinghaus's 1880s findings held up in a 2015 replication.","Relearning is faster than first learning: memory leaves a trace."],
q:[["What did Ebbinghaus memorize?",["Poems","Historical dates","Phone numbers","Nonsense syllables"],3,"Made-up syllables with no meaning."],
["When is forgetting fastest?",["After a year","After a month","Right after learning","It's the same at all times"],2,"Forgetting is fast at first, then slows down."],
["What did the 2015 replication find?",["Ebbinghaus was wrong","The curve held up, with a possible bump at 24 hours","Memory doesn't fade at all","Only children forget quickly"],1,"The forgetting curve was replicated, with a small upturn at 24 hours possibly tied to sleep."]]},
fr:{t:"Pourquoi oublie-t-on ce qu'on apprend?",h:"L'essentiel de l'oubli se produit vite, et quelqu'un l'a mesuré pour la première fois il y a plus de 140 ans.",
s:[["Un homme et beaucoup de syllabes absurdes","Dans les années 1880, Hermann Ebbinghaus a mémorisé des listes de syllabes absurdes, des sons inventés sans aucun sens. Il était le seul participant de ses expériences."],
["Mesurer ce qui reste","Il mesurait à quel point il réapprenait une liste plus vite par la suite. Vingt minutes après l'avoir apprise, la réapprendre prenait environ 58 % moins de temps que la première fois. Après une heure, environ 44 % de moins. Après une journée, environ 34 % de moins. L'oubli est rapide au début, puis il ralentit."],
["Retesté en 2015","Les chercheurs Murre et Dros ont refait l'expérience. Une personne a passé 70 heures à apprendre des listes et à les réapprendre après 20 minutes, 1 heure, 9 heures, puis 1, 2 et 31 jours. La courbe a tenu. Ils ont aussi observé une petite remontée à 24 heures, peut-être liée au sommeil, ce qui reste à vérifier."],
["La mémoire laisse une trace","Même quand on croit avoir oublié, réapprendre est plus rapide qu'apprendre la première fois. C'est exactement ce que mesure l'« économie » d'Ebbinghaus."]],
w:"C'est pour ça que chaque leçon se termine par quelques questions, et que revenir sur une idée plus tard demande moins d'effort que de l'apprendre la première fois.",
k:["L'oubli est le plus rapide juste après l'apprentissage, puis il ralentit.","Les résultats d'Ebbinghaus, des années 1880, ont été confirmés en 2015.","Réapprendre est plus rapide qu'apprendre : la mémoire laisse une trace."],
q:[["Qu'est-ce qu'Ebbinghaus a mémorisé?",["Des poèmes","Des dates historiques","Des numéros de téléphone","Des syllabes absurdes"],3,"Des syllabes inventées, sans aucun sens."],
["Quand l'oubli est-il le plus rapide?",["Après un an","Après un mois","Juste après l'apprentissage","C'est pareil en tout temps"],2,"L'oubli est rapide au début, puis il ralentit."],
["Qu'a montré la reproduction de 2015?",["Qu'Ebbinghaus avait tort","Que la courbe tenait, avec une possible remontée à 24 heures","Que la mémoire ne s'efface pas","Que seuls les enfants oublient vite"],1,"La courbe de l'oubli a été confirmée, avec une légère remontée à 24 heures peut-être liée au sommeil."]]},
src:[["Replication and Analysis of Ebbinghaus' Forgetting Curve","PLOS ONE (Murre & Dros, 2015)","https://pure.uva.nl/ws/files/2701916/172027_503084.pdf"]]}
);

/* ================= Narration =================
   Free recorded narration made with Kokoro (open source): Ava = af_heart (EN) / ff_siwis (FR), files in
   audio/<lang>/<day>-<card>.mp3; Leo = am_michael (EN only), files in audio/leo/en/. Card 0 (DD-0.mp3) is
   the question itself. Samples in audio/voices/, articles in audio/articles/<voice>/<lang>/<date>.mp3.
   Each play tries the chosen voice, then the other one, so French with Leo falls back to Ava.
   Articles without a recording are read by the device's own voice. */
const TTS = { ok: true, speaking: false, el: null, what: null, synth: false };
function pad2(n) { return String(n).padStart(2, '0'); }
function vpath(v, lang, f) { return v === 'ava' ? 'audio/' + lang + '/' + f : 'audio/' + v + '/' + lang + '/' + f; }
function voiceOrder() { return [S.voice].concat(VOICES.filter(v => v !== S.voice)); }
function cardUrls(lesson, i) {
  const f = pad2(lesson.day) + '-' + (i + 1) + '.mp3';
  return voiceOrder().map(v => vpath(v, S.lang, f));
}
function audioUrl(lesson, i) { return cardUrls(lesson, i)[0]; }
function articleUrls(a) {
  const have = Array.isArray(a.audio) ? a.audio : [];
  return voiceOrder().filter(v => have.includes(v) && !(v === 'leo' && S.lang === 'fr')).map(v => 'audio/articles/' + v + '/' + S.lang + '/' + a.date + '.mp3');
}
function articleScript(a) {
  const x = AL(a);
  return [x.t, x.h, x.s, x.w ? t('whyRead') + '. ' + x.w : ''].filter(Boolean).join(' \n');
}
function playUrls(urls, what, fallbackText, onDone) {
  stopSpeak();
  let a;
  try { a = new Audio(); } catch (e) { return; }
  TTS.el = a; TTS.what = what || null;
  let idx = 0;
  a.preload = 'auto';
  a.addEventListener('playing', () => { if (TTS.el === a) { TTS.speaking = true; syncListen(); } });
  a.addEventListener('ended', () => { if (TTS.el === a) { TTS.speaking = false; syncListen(); if (onDone) onDone(); } });
  a.addEventListener('pause', () => { if (TTS.el === a && !a.ended) { TTS.speaking = false; syncListen(); } });
  const next = () => {
    if (TTS.el !== a) return;
    idx++;
    if (idx < urls.length) { a.src = urls[idx]; tryPlay(); return; }
    TTS.speaking = false; syncListen();
    if (fallbackText) speakText(fallbackText, what, onDone); else toast(t('noVoice'));
  };
  const tryPlay = () => { try { const p = a.play(); if (p && p.catch) p.catch(err => { if (err && err.name === 'NotAllowedError' && TTS.el === a) { TTS.speaking = false; syncListen(); } }); } catch (e) { } };
  a.addEventListener('error', next);
  if (!urls.length) { TTS.el = null; if (fallbackText) speakText(fallbackText, what, onDone); return; }
  a.src = urls[0];
  TTS.speaking = true; syncListen();
  tryPlay();
}
// Device voice, used only for articles that don't have a recording yet.
function speakText(text, what, onDone) {
  const ss = window.speechSynthesis;
  if (!ss || typeof SpeechSynthesisUtterance === 'undefined') { if (onDone) onDone(); else toast(t('noVoice')); return; }
  stopSpeak();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = S.lang === 'fr' ? 'fr-CA' : 'en-CA';
  try {
    const vs = ss.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith(S.lang));
    const pick = vs.find(v => /natural|premium|enhanced/i.test(v.name)) || vs[0];
    if (pick) u.voice = pick;
  } catch (e) { }
  u.rate = 0.97;
  // Some devices never start or never report the end of device speech: guard so listening keeps going.
  let started = false, finished = false;
  const finish = (ok) => { if (finished) return; finished = true; clearTimeout(g1); clearTimeout(g2); if (TTS.synth && TTS.what === what) { TTS.synth = false; TTS.speaking = false; syncListen(); if (onDone) onDone(); } void ok; };
  const g1 = setTimeout(() => { if (!started) { try { ss.cancel(); } catch (e) { } finish(false); } }, 2500);
  const g2 = setTimeout(() => finish(true), 4000 + text.length * 95);
  u.onstart = () => { started = true; };
  u.onerror = () => finish(false);
  u.onend = () => finish(true);
  TTS.synth = true; TTS.speaking = true; TTS.what = what || null;
  ss.speak(u); syncListen();
}
function autoNext(lesson, i) {
  return () => setTimeout(() => {
    if (S.mode !== 'listen' || V.layer !== 'lesson' || !V.lesson || V.lesson.id !== lesson.id || V.lesson.step !== 'card' || V.lesson.i !== i || V.sheet) return;
    nextCard();
  }, 700);
}
function playCard(lesson, i) { playUrls(cardUrls(lesson, i), 'card', null, S.mode === 'listen' ? autoNext(lesson, i) : null); }
// The question itself (title + hook), read before card 1: a recorded intro (DD-0.mp3) if one exists, otherwise the device voice.
function playIntroThenCard(lesson) {
  const x = L(lesson), f = pad2(lesson.day) + '-0.mp3';
  const urls = voiceOrder().map(v => vpath(v, S.lang, f));
  playUrls(urls, 'card', x.t + ' ' + x.h, () => setTimeout(() => {
    if (V.layer === 'lesson' && V.lesson && V.lesson.id === lesson.id && V.lesson.step === 'card' && V.lesson.i === 0) playCard(lesson, 0);
  }, 500));
}
function playArticle(a) { playUrls(articleUrls(a), 'article', articleScript(a)); }
// Voice preview (audio/voices/<voice>-<lang>.mp3). If a sample is missing, it plays the current narration
// (first card of today's lesson) and says so, instead of failing silently.
function playSample(v) {
  const urls = [S.lang, S.lang === 'fr' ? 'en' : 'fr'].map(l => 'audio/voices/' + v + '-' + l + '.mp3');
  const legacy = 'audio/' + S.lang + '/' + pad2(todayLesson().day) + '-1.mp3';
  const head = u => fetch(u, { method: 'HEAD' }).then(r => r.ok).catch(() => false);
  Promise.all(urls.map(head)).then(ok => {
    const have = urls.filter((u, k) => ok[k]);
    if (have.length) { playUrls(have, 'sample-' + v); return; }
    playUrls([legacy], 'sample-' + v);
    toast(t('voiceSoon', { name: t('v_' + v) }));
  });
}
function preloadCard(lesson, i) {
  try { if (i < L(lesson).s.length) { const a = new Audio(); a.preload = 'auto'; a.src = audioUrl(lesson, i); } } catch (e) { }
}
function stopSpeak() {
  const a = TTS.el; TTS.el = null;
  if (a) { try { a.pause(); a.removeAttribute('src'); a.load(); } catch (e) { } }
  if (TTS.synth) { TTS.synth = false; try { window.speechSynthesis.cancel(); } catch (e) { } }
  TTS.speaking = false; syncListen();
  TTS.what = null;
}
function syncListen() {
  musicLevel();
  document.querySelectorAll('[data-act="voice-sample"]').forEach(s => {
    const on = TTS.speaking && TTS.what === 'sample-' + s.dataset.v;
    s.setAttribute('aria-pressed', String(on));
    s.innerHTML = icon(on ? 'pause' : 'listen', 'i-md');
  });
  const ab = document.getElementById('art-listen');
  if (ab) {
    const on = TTS.speaking && TTS.what === 'article';
    ab.setAttribute('aria-pressed', String(on));
    ab.innerHTML = icon(on ? 'pause' : 'listen', 'i-md') + '<span>' + esc(on ? t('stop') : t('listenArticle')) + '</span>';
  }
  const b = document.getElementById('listen-btn');
  if (!b) return;
  const on = TTS.speaking && TTS.what === 'card';
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.innerHTML = icon(on ? 'pause' : 'listen', 'i-md') + '<span>' + esc(on ? t('stop') : t('listen')) + '</span>';
}

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg) {
  const host = document.getElementById('toast-host');
  if (!host) return;
  const long = msg.length > 40;
  host.innerHTML = '<div class="toast' + (long ? ' long' : '') + '">' + (long ? '' : icon('check', 'i-sm')) + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { host.innerHTML = ''; }, long ? 4500 : 2200);
}

/* ================= Derived lists ================= */
function todayLesson() { return lessonFor(new Date()); }
function weekLessons() {
  const now = new Date(), mon = startOfWeek(now), out = [];
  for (let d = mon; ymd(d) !== ymd(now); d = addDays(d, 1)) out.push({ date: d, lesson: lessonFor(d) });
  return out;
}
function recencyOrder() {
  const now = new Date(), seen = new Set(), out = [];
  for (let k = 0; k < 400 && out.length < LESSONS.length; k++) {
    const l = lessonFor(addDays(now, -k));
    if (!seen.has(l.id)) { seen.add(l.id); out.push({ lesson: l, k }); }
  }
  LESSONS.forEach(l => { if (!seen.has(l.id)) out.push({ lesson: l, k: 999 }); });
  return out;
}
function suggestions() {
  const today = todayLesson(), week = new Set(weekLessons().map(w => w.lesson.id)), read = readSet(), seed = ymd(new Date());
  const cands = LESSONS.filter(l => l.cat !== today.cat && !week.has(l.id) && l.id !== today.id)
    .map(l => ({ l, score: (S.interests.includes(l.cat) ? 4 : 0) + (read.has(l.id) ? 0 : 2) + (hash(seed + l.id) % 1000) / 1000 }))
    .sort((a, b) => b.score - a.score);
  const out = [], cats = new Set();
  for (const c of cands) { if (!cats.has(c.l.cat)) { out.push(c.l); cats.add(c.l.cat); } if (out.length === 3) break; }
  return out;
}
function related(lesson) {
  const read = readSet();
  return LESSONS.filter(l => l.cat === lesson.cat && l.id !== lesson.id)
    .sort((a, b) => (read.has(a.id) ? 1 : 0) - (read.has(b.id) ? 1 : 0) || a.day - b.day).slice(0, 2);
}
function searchLessons(q, filter) {
  const f = fold(q.trim());
  return recencyOrder().map(x => x.lesson).filter(l => {
    if (filter !== 'all' && l.cat !== filter) return false;
    if (!f) return true;
    const hay = [l.en, l.fr].map(x => [x.t, x.h, x.w, x.k.join(' '), x.s.map(s => s.join(' ')).join(' ')].join(' ')).join(' ') + ' ' + CAT_NAME.en[l.cat] + ' ' + CAT_NAME.fr[l.cat];
    return f.split(/\s+/).every(w => fold(hay).includes(w));
  });
}

function weekStrip(asCard) {
  const now = new Date(), mon = startOfWeek(now), days = daySet(), letters = T[S.lang].letters;
  let n = 0, dots = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), k = ymd(d), done = days.has(k), isToday = k === ymd(now);
    if (done) n++;
    const name = d.toLocaleDateString(locale(), { weekday: 'long' });
    const lab = name + (done ? ', ' + t('learnedOn') : '') + (isToday ? ', ' + t('todayWord') : '');
    dots += '<span class="dot' + (done ? ' done' : (isToday ? ' today' : '')) + '" role="img" aria-label="' + esc(lab) + '">' + (done ? icon('check', 'i-sm') : esc(letters[i])) + '</span>';
  }
  const label = n === 0 ? t('week0') : (n === 1 ? t('week1') : t('weekN', { n }));
  if (asCard) return { n, dots: '<div class="dots">' + dots + '</div>', label };
  return '<div class="week"><div class="week-txt"><span style="font-size:14px;font-weight:600">' + esc(t('thisWeek')) + '</span><span class="t-caption" style="font-weight:400">' + esc(label) + '</span></div><div class="dots">' + dots + '</div></div>';
}

function reportContext() {
  const parts = ['MindLift beta', S.lang.toUpperCase()];
  if (V.layer === 'article' && V.article) {
    const a = articleById(V.article);
    parts.push((S.lang === 'fr' ? 'Article du ' : 'Article for ') + V.article + (a ? ' ' + AL(a).t : ''));
  } else if (V.lesson) {
    const l = byId(V.lesson.id), x = L(l);

/* ================= Render ================= */
let prevKey = '', prevLayer = '';
function render(focusSel) {
  applyPrefs();
  const root = document.getElementById('root');
  const oldLayer = root.querySelector('.layer');
  const oldScroll = oldLayer ? oldLayer.scrollTop : 0;
  const layerKey = V.layer || '';
  const key = layerKey + '|' + (V.lesson ? V.lesson.id + V.lesson.step + V.lesson.i + '-' + V.lesson.qi : '') + (V.layer === 'game' && V.game ? gameKey() : '') + (V.layer === 'article' ? V.article : '') + (V.layer === 'welcome' ? V.wp : '');
  let html = '';
  if (V.layer !== 'welcome' && V.layer !== 'setup' && !(V.layer === 'interests' && V.interestsFrom === 'welcome')) {
    html += tabbar() + '<main class="main" id="main">' + (V.tab === 'today' ? renderToday() : V.tab === 'explore' ? renderExplore() : V.tab === 'articles' ? renderArticles() : renderYou()) + '</main>';
  }
  if (V.layer === 'welcome') html += renderWelcome();
  else if (V.layer === 'setup') html += renderSetup();
  else if (V.layer === 'interests') html += renderInterests();
  else if (V.layer === 'lesson') html += renderLesson();
  else if (V.layer === 'settings') html += renderSettings();
  else if (V.layer === 'game' && V.game) html += renderGame();
  else if (V.layer === 'article') html += renderArticle();
  root.innerHTML = html;
  const layerEl = root.querySelector('.layer');
  if (layerEl) {
    if (layerKey === prevLayer) layerEl.classList.add('still-layer');
    if (key === prevKey) { layerEl.classList.add('still'); layerEl.scrollTop = oldScroll; }
    layerEl.inert = !!V.sheet;
  }
  prevKey = key; prevLayer = layerKey;
  const main = document.getElementById('main');
  if (main) main.inert = !!V.layer || !!V.sheet;
  const nav = root.querySelector('.tabbar');
  if (nav) nav.inert = !!V.layer || !!V.sheet;
  document.getElementById('sheet-host').innerHTML = renderSheet();
  document.documentElement.classList.toggle('locked', !!V.layer || !!V.sheet);
  if (focusSel) {
    const el = (V.sheet && document.getElementById('sheet-h')) || document.querySelector(focusSel);
    if (el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
  }
}
function go(fn, focusSel) { fn(); render(focusSel); }

function openLesson(id) {
  stopSpeak();

  V.layer = 'lesson';
  render('#step-h');
  const layer = document.getElementById('lesson-layer'); if (layer) layer.scrollTop = 0;
}
function setStep(step, extra) {
  stopSpeak();
  Object.assign(V.lesson, { step }, extra || {});
  const l = byId(V.lesson.id);
  if (step === 'keys') markRead(l.id);
  render('#step-h');
  const layer = document.getElementById('lesson-layer'); if (layer) layer.scrollTop = 0;
  if (step === 'card') { if (S.mode === 'listen') { if (extra && extra.intro) playIntroThenCard(l); else playCard(l, V.lesson.i); } preloadCard(l, V.lesson.i + 1); }
}
function nextCard() {
  const l = byId(V.lesson.id), n = L(l).s.length;
  if (V.lesson.i < n - 1) setStep('card', { i: V.lesson.i + 1 }); else setStep('keys');
}
function prevCard() {
  if (V.lesson.i > 0) setStep('card', { i: V.lesson.i - 1 }); else setStep('intro');
}
function closeLesson() {
  stopSpeak();
  V.lesson = null; V.layer = null; V.sheet = null;

  if (ev.target && ev.target.closest && ev.target.closest('[data-act="music"], [data-act="music-pref"]')) return;
  musicPlay();
}, true);
document.addEventListener('keydown', () => { if (S.music && !MUSIC.playing && !MUSIC.loading) musicPlay(); }, true);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (MUSIC.playing) { MUSIC.resume = true; musicPause(); } }
  else if (MUSIC.resume) { MUSIC.resume = false; musicPlay(); }
});

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  switch (act) {
    case 'scrim': if (ev.target === el) closeSheet(); break;
    case 'tab': setTab(v); break;
    case 'railsearch': V.tab = 'explore'; V.layer = null; render(); { const q = document.getElementById('q'); if (q) q.focus(); } break;
    case 'open': openLesson(id); break;
    case 'article': openArticle(id); break;
    case 'close-article': stopSpeak(); closeArticle(); break;
    case 'save': {
      const on = toggleSave(id);
      el.setAttribute('aria-pressed', String(on));
      el.setAttribute('aria-label', on ? t('unsave') : t('save'));
      el.innerHTML = icon(on ? 'saved' : 'save', 'i-md');
      if (!V.layer && V.tab === 'you') render();
      break;
    }
    case 'lang': S.lang = v; persist(); stopSpeak(); render(); { const b = document.querySelector('[data-act="lang"][data-v="' + v + '"]'); if (b) b.focus(); } break;
    case 'welcome-start': markOnboarded(); persist(); openLesson(todayLesson().id); break;
    case 'setup': V.setupFrom = 'welcome'; V.layer = 'setup'; render('#setup-h'); break;
    case 'make-mine': V.setupFrom = 'you'; V.layer = 'setup'; render('#setup-h'); break;
    case 'setup-save': grabName(); persist(); V.layer = null; V.tab = 'you'; render('#page-h'); toast(S.name ? t('allSetName', { name: S.name }) : t('prefsSaved')); break;
    case 'setup-back': grabName(); persist(); if (V.setupFrom === 'you') { V.layer = null; V.tab = 'you'; render('#page-h'); } else { V.layer = 'welcome'; V.wp = WP.length - 1; render('#welcome-h'); } break;
    case 'setup-skip': grabName(); markOnboarded(); persist(); V.layer = null; V.tab = 'today'; render('#page-h'); welcomeToast(); break;
    case 'setup-next': grabName(); persist(); V.interestsFrom = 'welcome'; V.draft = S.interests.slice(); V.layer = 'interests'; render('#int-h'); break;
    case 'replay-intro': V.layer = 'welcome'; V.wp = 0; render('#welcome-h'); break;
    case 'wp-next': V.wp = Math.min(WP.length - 1, V.wp + 1); render('#welcome-h'); break;
    case 'wp-back': V.wp = Math.max(0, V.wp - 1); render('#welcome-h'); break;
    case 'wp-go': V.wp = Number(v) || 0; render('#welcome-h'); break;
    case 'wp-skip': V.wp = WP.length - 1; render('#welcome-h'); break;
    case 'voice': S.voice = VOICES.includes(v) ? v : 'ava'; persist(); stopSpeak(); render(); { const b = document.querySelector('[data-act="voice"][data-v="' + S.voice + '"]'); if (b) b.focus(); } playSample(S.voice); break;
    case 'voice-sample': if (TTS.speaking && TTS.what === 'sample-' + v) stopSpeak(); else playSample(v); break;
    case 'art-listen': { const a = articleById(V.article); if (!a) break; if (TTS.speaking && TTS.what === 'article') stopSpeak(); else playArticle(a); break; }
    case 'music': if (S.music && !MUSIC.playing) musicPlay(); else { S.music = !S.music; persist(); if (S.music) musicPlay(); else musicPause(); } syncMusicBtn(); if (MUSIC.failed && S.music) toast(t('musicFail')); break;
    case 'music-pref': S.music = !S.music; persist(); if (S.music) musicPlay(); else musicPause(); render(); { const b = document.querySelector('[data-act="music-pref"]'); if (b) b.focus(); } if (MUSIC.failed && S.music) toast(t('musicFail')); break;
    case 'musicvol': S.musicVol = Number(v); persist(); musicLevel(); render(); { const b = document.querySelector('[data-act="musicvol"][data-v="' + v + '"]'); if (b) b.focus(); } break;
    case 'interests': V.interestsFrom = v; V.draft = S.interests.slice(); V.layer = 'interests'; render('#int-h'); break;
    case 'pick': V.draft = V.draft.includes(v) ? V.draft.filter(c => c !== v) : V.draft.concat([v]); render(); { const b = document.querySelector('[data-act="pick"][data-v="' + v + '"]'); if (b) b.focus(); } break;
    case 'int-back': V.layer = V.interestsFrom === 'welcome' ? 'setup' : (V.interestsFrom === 'settings' ? 'settings' : null); render(V.layer === 'setup' ? '#setup-h' : (V.layer ? '#set-h' : '#page-h')); break;
    case 'int-skip': markOnboarded(); persist(); V.layer = null; V.tab = 'today'; render('#page-h'); welcomeToast(); break;
    case 'int-done': { const fromW = V.interestsFrom === 'welcome'; S.interests = CATS.filter(c => V.draft.includes(c)); if (fromW) markOnboarded(); else S.onboarded = true; persist(); V.layer = V.interestsFrom === 'settings' ? 'settings' : null; if (!V.layer && fromW) V.tab = 'today'; render(V.layer ? '#set-h' : '#page-h'); if (fromW) welcomeToast(); break; }
    case 'surprise': {
      markOnboarded(); persist();
      const read = readSet(), pool = LESSONS.filter(l => !read.has(l.id)), list = pool.length ? pool : LESSONS;
      openLesson(list[Math.floor(Math.random() * list.length)].id); break;
    }
    case 'layer': V.layer = v; render('#set-h'); break;
    case 'close-layer': V.layer = null; render('#page-h'); break;
    case 'close-lesson': closeLesson(); break;
    case 'mode': S.mode = v; persist(); render(); { const b = document.querySelector('[data-act="mode"][data-v="' + v + '"]'); if (b) b.focus(); } break;
    case 'step':
      if (v === 'card0') setStep('card', { i: 0, intro: S.mode === 'listen' });
      else if (v === 'quiz') setStep('quiz', { qi: 0, picked: null });
      else setStep(v);
      break;
    case 'next': nextCard(); break;
    case 'prev': prevCard(); break;
    case 'listen': {
      if (TTS.speaking && TTS.what === 'card') { stopSpeak(); if (S.mode === 'listen') { S.mode = 'read'; persist(); } }
      else { if (S.mode !== 'listen') { S.mode = 'listen'; persist(); } playCard(byId(V.lesson.id), V.lesson.i); }
      break;
    }
    case 'size': S.size = (S.size + 1) % 3; persist(); applyPrefs(); break;
    case 'answer': V.lesson.picked = Number(v); render(); { const b = document.querySelector('.feedback') ? document.querySelector('.flow-foot .btn') : null; if (b) b.focus(); } if (V.lesson.picked === L(byId(V.lesson.id)).q[V.lesson.qi][2]) goodAnswerFx('#lesson-layer'); else badAnswerFx('#lesson-layer'); break;
    case 'nextq': setStep('quiz', { qi: V.lesson.qi + 1, picked: null }); break;
    case 'filter': V.filter = v; render(); { const b = document.querySelector('.chip[data-v="' + v + '"]'); if (b) { b.focus(); b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } } break;
    case 'clearsearch': V.search = ''; render(); { const q = document.getElementById('q'); if (q) q.focus(); } break;
    case 'histall': V.historyAll = !V.historyAll; render(); break;
    case 'showweek': S.showWeek = !S.showWeek; persist(); render(); { const b = document.querySelector('[data-act="showweek"]'); if (b) b.focus(); } break;
    case 'theme': S.theme = v; persist(); render(); { const b = document.querySelector('[data-act="theme"][data-v="' + v + '"]'); if (b) b.focus(); } break;
    case 'setsize': S.size = Number(v); persist(); render(); { const b = document.querySelector('[data-act="setsize"][data-v="' + v + '"]'); if (b) b.focus(); } break;
    case 'clear': openSheet('clear'); break;
    case 'clear-yes': S.log = []; S.saved = []; S.artRead = []; S.practice = practiceDefaults(); persist(); V.sheet = { ret: '[data-act="clear"]' }; closeSheet(); toast(t('cleared')); break;
    case 'howmade': openSheet('howmade'); break;
    case 'report': openSheet('report'); break;
    case 'close-sheet': closeSheet(); break;
    case 'copy-report': copyReport(el); break;
    case 'game': openGame(v); break;
    case 'game-start': startGame(); break;
    case 'game-close': closeGame(); break;
    case 'game-lesson': gameToLesson(); break;
    case 'aboutpractice': openSheet('aboutpractice'); break;
    case 'y3-answer': y3Answer(Number(v)); break;
    case 'y3-next': y3Next(); break;
    case 'cw-pick': cwPick(v); break;
    case 'nm-key': nmKey(v); break;
    case 'nm-del': nmDel(); break;
    case 'nm-check': nmCheck(); break;
    case 'nm-next': nmNext(); break;
    case 'nm-dir': S.practice.nm.dir = v === 'b' ? 'b' : 'f'; persist(); render(); { const b = document.querySelector('[data-act="nm-dir"][data-v="' + v + '"]'); if (b) b.focus(); } break;
    case 'sound': S.sound = !S.sound; persist(); render(); { const b = document.querySelector('[data-act="sound"]'); if (b) b.focus(); } if (S.sound) sfx('correct'); break;
    case 'showpractice': S.showPractice = !S.showPractice; persist(); render(); { const b = document.querySelector('[data-act="showpractice"]'); if (b) b.focus(); } break;
  }
});

['change', 'focusout'].forEach(type => document.addEventListener(type, (ev) => {
  if (ev.target && (ev.target.id === 'name-input' || ev.target.id === 'name-set')) { S.name = ev.target.value.replace(/\s+/g, ' ').trim().slice(0, 30); persist(); }
}));
window.addEventListener('pagehide', () => { grabName(); persist(); });
document.addEventListener('input', (ev) => {
  if (ev.target && ev.target.id === 'q') {
    V.search = ev.target.value;
    const box = document.getElementById('explore-results');
    if (box) box.innerHTML = exploreResults();
    const lab = ev.target.parentElement;
    const has = !!lab.querySelector('[data-act="clearsearch"]');
    if (!!V.search !== has) {
      if (V.search) lab.insertAdjacentHTML('beforeend', '<button type="button" class="iconbtn" data-act="clearsearch" aria-label="' + esc(t('clearSearch')) + '">' + icon('x', 'i-md') + '</button>');
      else lab.querySelector('[data-act="clearsearch"]').remove();
    }
  }
  if (ev.target && ev.target.id === 'report-text' && V.sheet) V.sheet.text = ev.target.value;
  if (ev.target && (ev.target.id === 'name-input' || ev.target.id === 'name-set')) { S.name = ev.target.value.replace(/\s+/g, ' ').trim().slice(0, 30); persist(); }
});

let swipeX = null, swipeY = null;
document.addEventListener('touchstart', (ev) => { if (V.layer !== 'welcome' || !ev.touches[0]) return; swipeX = ev.touches[0].clientX; swipeY = ev.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', (ev) => {
  if (V.layer !== 'welcome' || swipeX === null || !ev.changedTouches[0]) return;
  const dx = ev.changedTouches[0].clientX - swipeX, dy = ev.changedTouches[0].clientY - swipeY; swipeX = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const nv = Math.max(0, Math.min(WP.length - 1, V.wp + (dx < 0 ? 1 : -1)));
  if (nv !== V.wp) { V.wp = nv; render('#welcome-h'); }
}, { passive: true });
document.addEventListener('keydown', (ev) => {
  if (V.layer === 'welcome' && !V.sheet && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && !(ev.target && ev.target.closest && ev.target.closest('input, textarea, .seg'))) {
    const nv = Math.max(0, Math.min(WP.length - 1, V.wp + (ev.key === 'ArrowRight' ? 1 : -1)));
    if (nv !== V.wp) { V.wp = nv; render('#welcome-h'); ev.preventDefault(); return; }
  }
}, true);
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') {
    if (V.sheet) { ev.preventDefault(); closeSheet(); return; }
  }
  if (V.layer === 'game' && V.game && V.game.step === 'play' && !V.sheet) {
    const tg = (ev.target && ev.target.tagName) || '';
    if (tg !== 'INPUT' && tg !== 'TEXTAREA' && !ev.metaKey && !ev.ctrlKey && !ev.altKey) {
      const G = V.game;
      if (G.id === 'nm' && G.phase === 'input') {
        if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); nmKey(ev.key); return; }
        if (ev.key === 'Backspace') { ev.preventDefault(); nmDel(); return; }
        if (ev.key === 'Enter' && G.typed.length === G.span) { ev.preventDefault(); nmCheck(); return; }
      } else if (G.id === 'cw' && !G.fb && /^[1-4]$/.test(ev.key)) { ev.preventDefault(); cwPick(G.trials[G.i].order[Number(ev.key) - 1]); return; }
    }
  }
  if (V.layer === 'lesson' && V.lesson && V.lesson.step === 'card' && !V.sheet) {
    const tag = (ev.target && ev.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (ev.key === 'ArrowRight') { ev.preventDefault(); nextCard(); }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); prevCard(); }
  }
});

let lastDay = ymd(new Date());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && ymd(new Date()) !== lastDay) { lastDay = ymd(new Date()); if (!V.layer) render(); }
});
try {
  window.addEventListener('storage', (e) => { if (e.key === KEY) { Object.assign(S, load()); render(); } });
} catch (e) { }

/* ================= Boot ================= */
loadArticles();
function start(data) {
  try { if (data && data.V) { Object.assign(V, data.V, { sheet: null }); if (V.lesson && !byId(V.lesson.id)) { V.lesson = null; if (V.layer === 'lesson') V.layer = null; } if (V.game || V.layer === 'game') { V.game = null; if (V.layer === 'game') V.layer = null; } } } catch (e) { }
  render();
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ V: Object.assign({}, V, { sheet: null }) }));
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start(hot && hot.data ? hot.data : {});
} catch (e) { start({}); }

window.__mindlift = { S, V, A, MUSIC, musicPlay, musicPause, normArticle, LESSONS, lessonFor, recencyOrder, suggestions, searchLessons, dayOfYear, featuredGame, recallEntry, cwTrials, render };
})();

</script>
